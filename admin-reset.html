<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#74191b"><title>Redefinir senha do Admin — Naruto Unison</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:18px;background:#0d0b09;color:#eee2cf;font:15px system-ui,-apple-system,Segoe UI,sans-serif}.card{width:min(560px,100%);padding:24px;border:1px solid #5c422d;border-radius:16px;background:#17120e;box-shadow:0 24px 90px #000}.brand{font-size:12px;letter-spacing:.14em;color:#c9a77b}label{display:block;margin:13px 0}input{width:100%;margin-top:6px;padding:12px;border:1px solid #6b4d34;border-radius:8px;background:#0b0907;color:white}button,a{display:inline-block;margin:6px 6px 6px 0;padding:11px 14px;border:1px solid #79563a;border-radius:8px;background:#842828;color:#fff;text-decoration:none;font-weight:700;cursor:pointer}button:disabled{opacity:.55}.hidden{display:none}.ok{color:#afe0ad}.bad{color:#ffaaaa}.muted{color:#b9a58a}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script></head><body><main class="card"><div class="brand">NARUTO UNISON — OWNER</div><h1>Redefinir senha administrativa</h1><p id="status" class="muted">Validando o link de recuperação...</p><section id="form" class="hidden"><label>Nova senha<input id="p1" type="password" autocomplete="new-password" minlength="12" maxlength="128"></label><label>Confirmar nova senha<input id="p2" type="password" autocomplete="new-password" minlength="12" maxlength="128"></label><button id="save">SALVAR NOVA SENHA</button><p id="msg"></p></section><p><a href="./admin.html">VOLTAR AO ADMIN</a></p></main><script>(()=>{'use strict';const URL='https://cpdgkszviwrgrwsltbyk.supabase.co',KEY='sb_publishable_KGkT_uJNg1nRBgftEvlT3w_c_aHOo5K',OWNER='admin@naruto-unison.example';const sb=window.supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}),$=id=>document.getElementById(id);async function check(){const {data,error}=await sb.auth.getUser();if(error||!data.user){$('status').textContent='Link inválido ou expirado. Gere um novo link de recuperação.';$('status').className='bad';return}if(String(data.user.email||'').toLowerCase()!==OWNER){await sb.auth.signOut();$('status').textContent='Este link não pertence ao OWNER administrativo.';$('status').className='bad';return}$('status').textContent='OWNER validado. Defina a nova senha abaixo.';$('status').className='ok';$('form').classList.remove('hidden')}sb.auth.onAuthStateChange(()=>setTimeout(check,0));$('save').onclick=async()=>{const p=$('p1').value,p2=$('p2').value;if(p.length<12||p.length>128){$('msg').textContent='Use uma senha entre 12 e 128 caracteres.';$('msg').className='bad';return}if(p!==p2){$('msg').textContent='As senhas não conferem.';$('msg').className='bad';return}$('save').disabled=true;$('msg').textContent='Atualizando...';$('msg').className='muted';const {error}=await sb.auth.updateUser({password:p});if(error){$('msg').textContent=error.message;$('msg').className='bad';$('save').disabled=false;return}$('msg').textContent='Senha administrativa atualizada. Abrindo o console...';$('msg').className='ok';setTimeout(()=>location.href='./admin.html',900)};setTimeout(check,250)})();</script></body></html>
