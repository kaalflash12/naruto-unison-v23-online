<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#74191b"><title>Admin — Naruto Unison</title><style>
*{box-sizing:border-box}body{margin:0;background:#0d0b09;color:#eee2cf;font:14px system-ui,-apple-system,Segoe UI,sans-serif}header{position:sticky;top:0;z-index:5;background:#16100c;border-bottom:1px solid #4e3a28;padding:12px 18px;display:flex;gap:12px;align-items:center;justify-content:space-between}button,a.btn{border:1px solid #79563a;background:#2a1d14;color:#fff;border-radius:8px;padding:9px 12px;cursor:pointer;text-decoration:none}button.primary{background:#842828}.wrap{max-width:1180px;margin:auto;padding:18px}.card{background:#17120e;border:1px solid #4e3a28;border-radius:12px;padding:16px;margin:12px 0}.hidden{display:none}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tabs button.active{background:#842828}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}label{display:block}input,select,textarea{width:100%;margin-top:5px;padding:9px;border:1px solid #5f4933;border-radius:7px;background:#0c0a08;color:#fff}textarea{min-height:85px}table{width:100%;border-collapse:collapse;min-width:760px}th,td{text-align:left;border-bottom:1px solid #3e3022;padding:9px;vertical-align:top}.scroll{overflow:auto}.muted{color:#b9a58a}.ok{color:#aadea9}.bad{color:#ffaaaa}.pill{display:inline-block;padding:3px 7px;border:1px solid #6d5138;border-radius:999px;font-size:11px;margin:2px}.rowBtns{display:flex;gap:5px;flex-wrap:wrap}.rowBtns button{padding:6px 8px;font-size:12px}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script></head><body>
<header><div><b>NARUTO UNISON — ADMIN</b><div class="muted">Contas • temporadas • recompensas</div></div><div><a class="btn" href="./">JOGO</a> <button id="logout" class="hidden">SAIR</button></div></header><main class="wrap">
<section id="loginCard" class="card"><h2>Acesso OWNER</h2><div class="grid"><label>E-mail<input id="email" type="email" autocomplete="username" value="admin@naruto-unison.example"></label><label>Senha<input id="password" type="password" autocomplete="current-password"></label></div><p><button id="login" class="primary">ENTRAR</button></p><p id="loginMsg" class="muted"></p></section>
<section id="app" class="hidden"><div class="tabs"><button data-tab="accounts" class="active">CONTAS</button><button data-tab="seasons">TEMPORADAS</button><button data-tab="rewards">RECOMPENSAS</button></div>
<section id="tab-accounts" class="tab card"><h2>Contas</h2><div style="display:flex;gap:8px"><input id="accountSearch" placeholder="Buscar usuário"><button id="accountSearchBtn">BUSCAR</button></div><p id="accountMsg" class="muted"></p><div class="scroll"><table><thead><tr><th>Conta</th><th>Tipo</th><th>Nível</th><th>XP</th><th>Ryō</th><th>Recuperação</th><th>Ações</th></tr></thead><tbody id="accountsBody"></tbody></table></div></section>
<section id="tab-seasons" class="tab card hidden"><h2>Temporadas</h2><div class="grid"><label>Slug<input id="seasonSlug" placeholder="temporada-1"></label><label>Nome<input id="seasonName"></label><label>Início<input id="seasonStart" type="datetime-local"></label><label>Fim<input id="seasonEnd" type="datetime-local"></label><label>Status<select id="seasonStatus"><option>PLANNED</option><option>ACTIVE</option><option>ENDED</option><option>ARCHIVED</option></select></label></div><label>Config JSON<textarea id="seasonConfig">{}</textarea></label><label>Recompensas JSON<textarea id="seasonRewards">{}</textarea></label><p><button id="createSeason" class="primary">CRIAR TEMPORADA</button></p><p id="seasonMsg" class="muted"></p><div id="seasonsList"></div></section>
<section id="tab-rewards" class="tab card hidden"><h2>Conceder recompensa</h2><div class="grid"><label>Conta<select id="rewardTarget"></select></label><label>Tipo<select id="rewardType"><option>RYO</option><option>XP</option><option>ITEM</option><option>UNLOCK</option><option>CUSTOM</option></select></label><label>Quantidade<input id="rewardAmount" type="number" value="0"></label><label>Motivo<input id="rewardReason" maxlength="500"></label></div><label>Payload JSON (ITEM/UNLOCK/CUSTOM)<textarea id="rewardPayload">{}</textarea></label><p><button id="grantReward" class="primary">CONCEDER</button></p><p id="rewardMsg" class="muted"></p><h3>Histórico recente</h3><div class="scroll"><table><thead><tr><th>Data</th><th>Destino</th><th>Tipo</th><th>Qtd.</th><th>Motivo</th></tr></thead><tbody id="rewardsBody"></tbody></table></div></section>
</section></main><script>
(()=>{'use strict';const URL='https://cpdgkszviwrgrwsltbyk.supabase.co',KEY='sb_publishable_KGkT_uJNg1nRBgftEvlT3w_c_aHOo5K';const sb=window.supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});const $=id=>document.getElementById(id);let accounts=[];
function text(id,s,bad=false){const e=$(id);e.textContent=s;e.className=bad?'bad':'ok'}
async function api(path,opts={}){const {data}=await sb.auth.getSession();const tok=data.session?.access_token;if(!tok)throw new Error('Sessão expirada.');const r=await fetch(URL+'/functions/v1/admin-gameops'+path,{...opts,headers:{'content-type':'application/json','apikey':KEY,'authorization':'Bearer '+tok,...(opts.headers||{})}});const b=await r.json().catch(()=>({}));if(!r.ok||b.ok===false)throw new Error(b.error||b.code||('HTTP '+r.status));return b}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function enter(){try{await loadAccounts();$('loginCard').classList.add('hidden');$('app').classList.remove('hidden');$('logout').classList.remove('hidden');await Promise.all([loadSeasons(),loadRewards()])}catch(e){text('loginMsg',e.message,true)}}
$('login').onclick=async()=>{text('loginMsg','Autenticando...');const {error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)return text('loginMsg',error.message,true);await enter()};$('logout').onclick=async()=>{await sb.auth.signOut();location.reload()};
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.tab').forEach(x=>x.classList.add('hidden'));$('tab-'+b.dataset.tab).classList.remove('hidden')});
async function loadAccounts(){const q=$('accountSearch')?.value.trim()||'';const b=await api('/accounts'+(q?'?q='+encodeURIComponent(q):''));accounts=b.accounts||[];$('accountsBody').innerHTML=accounts.map(a=>`<tr><td><b>${esc(a.username)}</b><br><small>${esc(a.targetId)}</small></td><td><span class="pill">${esc(a.targetKind)}</span></td><td>${a.level}</td><td>${a.xp}</td><td>${a.ryo}</td><td>${a.recoveryReady?'ATIVA':'NÃO ATIVA'}${a.linkedAuth?' • VINCULADA':''}</td><td><div class="rowBtns"><button data-reward="${esc(a.id)}">RECOMPENSA</button><button data-xp="${esc(a.id)}">+100 XP</button><button data-ryo="${esc(a.id)}">+500 RYŌ</button>${a.moderationSupported?`<button data-ban="${esc(a.id)}">${a.banned?'DESBANIR':'BANIR'}</button>`:''}</div></td></tr>`).join('');$('rewardTarget').innerHTML=accounts.map(a=>`<option value="${esc(a.id)}">${esc(a.username)} — ${a.targetKind}</option>`).join('');$('accountsBody').querySelectorAll('[data-reward]').forEach(x=>x.onclick=()=>{selectReward(x.dataset.reward);document.querySelector('[data-tab="rewards"]').click()});$('accountsBody').querySelectorAll('[data-xp]').forEach(x=>x.onclick=()=>patchAccount(x.dataset.xp,{xpDelta:100}));$('accountsBody').querySelectorAll('[data-ryo]').forEach(x=>x.onclick=()=>patchAccount(x.dataset.ryo,{ryoDelta:500}));$('accountsBody').querySelectorAll('[data-ban]').forEach(x=>x.onclick=()=>patchAccount(x.dataset.ban,{toggleBan:true,reason:'Ação administrativa'}));text('accountMsg',accounts.length+' conta(s) carregada(s).')}
function selectReward(id){$('rewardTarget').value=id}
async function patchAccount(id,body){try{await api('/accounts/'+encodeURIComponent(id),{method:'PATCH',body:JSON.stringify(body)});await loadAccounts()}catch(e){text('accountMsg',e.message,true)}}
$('accountSearchBtn').onclick=()=>loadAccounts().catch(e=>text('accountMsg',e.message,true));
async function loadSeasons(){const b=await api('/seasons');$('seasonsList').innerHTML=(b.seasons||[]).map(s=>`<div class="card"><b>${esc(s.name)}</b> <span class="pill">${esc(s.status)}</span><div class="muted">${esc(s.slug)} • ${new Date(s.starts_at).toLocaleString('pt-BR')}${s.ends_at?' → '+new Date(s.ends_at).toLocaleString('pt-BR'):''}</div><div class="rowBtns"><button data-active="${s.id}">ATIVAR</button><button data-end="${s.id}">ENCERRAR</button><button data-archive="${s.id}">ARQUIVAR</button></div></div>`).join('')||'<p class="muted">Nenhuma temporada.</p>';$('seasonsList').querySelectorAll('[data-active]').forEach(x=>x.onclick=()=>seasonStatus(x.dataset.active,'ACTIVE'));$('seasonsList').querySelectorAll('[data-end]').forEach(x=>x.onclick=()=>seasonStatus(x.dataset.end,'ENDED'));$('seasonsList').querySelectorAll('[data-archive]').forEach(x=>x.onclick=()=>seasonStatus(x.dataset.archive,'ARCHIVED'))}
async function seasonStatus(id,status){try{await api('/seasons/'+id,{method:'PATCH',body:JSON.stringify({status})});await loadSeasons()}catch(e){text('seasonMsg',e.message,true)}}
$('createSeason').onclick=async()=>{try{const cfg=JSON.parse($('seasonConfig').value||'{}'),rewards=JSON.parse($('seasonRewards').value||'{}');const body={slug:$('seasonSlug').value.trim(),name:$('seasonName').value.trim(),status:$('seasonStatus').value,starts_at:new Date($('seasonStart').value||Date.now()).toISOString(),ends_at:$('seasonEnd').value?new Date($('seasonEnd').value).toISOString():null,config:cfg,rewards};await api('/seasons',{method:'POST',body:JSON.stringify(body)});text('seasonMsg','Temporada criada.');await loadSeasons()}catch(e){text('seasonMsg',e.message,true)}};
$('grantReward').onclick=async()=>{try{const id=$('rewardTarget').value,[targetKind,targetId]=id.split(':',2);const payload=JSON.parse($('rewardPayload').value||'{}');await api('/rewards/grant',{method:'POST',body:JSON.stringify({targetKind,targetId,rewardType:$('rewardType').value,amount:Number($('rewardAmount').value||0),payload,reason:$('rewardReason').value})});text('rewardMsg','Recompensa concedida.');await Promise.all([loadAccounts(),loadRewards()])}catch(e){text('rewardMsg',e.message,true)}};
async function loadRewards(){const b=await api('/rewards');$('rewardsBody').innerHTML=(b.grants||[]).map(g=>`<tr><td>${new Date(g.granted_at).toLocaleString('pt-BR')}</td><td>${esc(g.target_kind)}:${esc(g.target_id)}</td><td>${esc(g.reward_type)}</td><td>${g.amount??0}</td><td>${esc(g.reason||'')}</td></tr>`).join('')}
sb.auth.getSession().then(({data})=>{if(data.session)enter()});})();
</script></body></html>
