name: Deploy R41 Cloudflare + MongoDB

on:
  push:
    branches: [r41-correcao-integral-20260819]
    paths:
      - 'R41/Naruto Shinobi no Sho PC/_jogo/cloudflare/r41-api/**'
      - '.github/workflows/deploy-r41-cloudflare.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      AUTH_SECRET: ${{ secrets.R41_AUTH_SECRET }}
      LEON_PRIVATE_CODE: ${{ secrets.LEON_PRIVATE_CODE }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r41-correcao-integral-20260819
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate Worker source
        shell: bash
        run: |
          set -euo pipefail
          W='R41/Naruto Shinobi no Sho PC/_jogo/cloudflare/r41-api'
          cd "$W"
          npm install --no-audit --no-fund
          node --check src/index.js
          node --check src/entry.js
          grep -q '/api/account/save' src/index.js
          grep -q '/api/online/create' src/index.js
          grep -q '/api/v84/world/event' src/index.js
          grep -q '/api/v84/world/tick' src/entry.js
          echo 'Worker syntax/routes: OK' >> "$GITHUB_STEP_SUMMARY"

      - name: Check deploy credentials
        id: creds
        shell: bash
        run: |
          if [ -n "${CLOUDFLARE_API_TOKEN:-}" ] && [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ] && [ -n "${MONGODB_URI:-}" ] && [ -n "${AUTH_SECRET:-}" ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Cloudflare deploy skipped: repository secrets are not all configured.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Configure Worker secrets
        if: steps.creds.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          W='R41/Naruto Shinobi no Sho PC/_jogo/cloudflare/r41-api'
          cd "$W"
          printf '%s' "$MONGODB_URI" | npx wrangler secret put MONGODB_URI --config wrangler.toml
          printf '%s' "$AUTH_SECRET" | npx wrangler secret put AUTH_SECRET --config wrangler.toml
          if [ -n "${LEON_PRIVATE_CODE:-}" ]; then
            printf '%s' "$LEON_PRIVATE_CODE" | npx wrangler secret put LEON_PRIVATE_CODE --config wrangler.toml
          fi

      - name: Deploy Worker
        if: steps.creds.outputs.ready == 'true'
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          W='R41/Naruto Shinobi no Sho PC/_jogo/cloudflare/r41-api'
          cd "$W"
          npx wrangler deploy --config wrangler.toml 2>&1 | tee /tmp/r41-wrangler-deploy.log
          URL="$(grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' /tmp/r41-wrangler-deploy.log | tail -n1 || true)"
          if [ -z "$URL" ]; then
            echo 'Worker deployed, but workers.dev URL was not found in CLI output.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Worker: $URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Validate live Worker
        if: steps.creds.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          URL='${{ steps.deploy.outputs.url }}'
          curl --fail --silent --show-error "$URL/api/status" | tee /tmp/r41-status.json
          node -e "const d=require('/tmp/r41-status.json'); if(!d.ok||!d.configured||!d.routes?.online||!d.routes?.save) process.exit(1); console.log(d.build)"
          echo 'Live /api/status: OK' >> "$GITHUB_STEP_SUMMARY"

      - name: Bake API URL into GitHub Pages frontend
        if: steps.creds.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          URL='${{ steps.deploy.outputs.url }}'
          F='R41/Naruto Shinobi no Sho PC/_jogo/r41-api-config.js'
          python3 - "$F" "$URL" <<'PY'
          from pathlib import Path
          import re,sys
          p=Path(sys.argv[1]); url=sys.argv[2]
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'const baked = "[^"]*";', f'const baked = "{url}";', s)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'r41-cloudflare-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add "$F"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'R41: bake deployed Cloudflare API URL'
          git push origin HEAD:r41-correcao-integral-20260819
