name: Validate Shinobi no Sho R41

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-r41:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate R41 runtime without mutating source
        shell: bash
        run: |
          set -euo pipefail
          G='R41/Naruto Shinobi no Sho PC/_jogo'
          test -f "$G/index.html"
          test -f "$G/app.js"
          test -f "$G/r41-api-config.js"
          test -f "$G/r41-github-api.js"
          test -f "$G/data/r41-user-visuals.js"
          test -f "$G/src/r41-core-bundle.js"
          test -f "$G/src/r41-canonical-repair.js"
          test -f "$G/cloudflare/r41-api/src/index.js"
          test -f "$G/cloudflare/r41-api/src/entry.js"
          test -f "$G/data/r41-gm3-techniques.json"
          ! test -f "$G/vercel.json"
          ! grep -R -n -E 'VERCEL_TOKEN|NARUTO_VERCEL_URL|NARUTO_MONGO_VIA_VERCEL|vercel\.app' "$G/.env.local.example" "$G/r41-api-config.js" "$G/r41-github-api.js" 2>/dev/null

          node --check "$G/app.js"
          node --check "$G/r41-api-config.js"
          node --check "$G/r41-github-api.js"
          node --check "$G/data/r41-user-visuals.js"
          node --check "$G/src/r41-canonical-repair.js"
          node --check "$G/cloudflare/r41-api/src/index.js"
          node --check "$G/cloudflare/r41-api/src/entry.js"

          cd "$G"
          R41_ALLOW_USER_OVERLAY_MISSING=1 node tools/audit-r41-assets.mjs

          python3 - <<'PY'
          import json
          from pathlib import Path

          audit=json.load(open('audit/r41-assets.json',encoding='utf-8'))
          assert audit['ok'] is True,audit
          assert audit['missingHard']==0,audit

          data=json.loads(Path('data/r41-gm3-techniques.json').read_text(encoding='utf-8'))
          techniques=data if isinstance(data,list) else data.get('techniques',data.get('items',[]))
          assert len(techniques)==2792,len(techniques)

          html=Path('index.html').read_text(encoding='utf-8')
          assert html.index('data/r41-user-visuals.js') < html.index('src/r41-core-bundle.js') < html.index('src/r41-canonical-repair.js') < html.index('app.js')

          entry=Path('cloudflare/r41-api/src/entry.js').read_text(encoding='utf-8')
          for token in ['/api/private/claim-leon','/api/v84/world/tick','@cf/zai-org/glm-4.7-flash','TERION é a autoridade mecânica']:
              assert token in entry,token

          app=Path('app.js').read_text(encoding='utf-8')
          for token in ['/api/account/save','/api/online/create','/api/v84/world/event','TERION']:
              assert token in app,token

          print(json.dumps({
              'result':'PASS',
              'gm3':len(techniques),
              'assetMissingHard':audit['missingHard'],
              'externalUserOverlay':audit['missingExternalUserOverlay']
          },ensure_ascii=False))
          PY
