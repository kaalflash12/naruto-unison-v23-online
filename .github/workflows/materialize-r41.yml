name: Validate Shinobi no Sho R41 Materialized Runtime

on:
  push:
    branches: [r41-correcao-integral-20260819]
    paths:
      - '.github/workflows/materialize-r41.yml'
      - '.r41-seed/materialize_r41.py'
      - 'R41/Naruto Shinobi no Sho PC/_jogo/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-materialized-r41:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate materialized runtime ownership
        shell: bash
        run: |
          set -euo pipefail
          G='R41/Naruto Shinobi no Sho PC/_jogo'
          test -f "$G/index.html"
          test -f "$G/app.js"
          test -f "$G/r41-api-config.js"
          test -f "$G/r41-github-api.js"
          test -f "$G/cloudflare/r41-api/src/index.js"
          test -f "$G/cloudflare/r41-api/src/entry.js"
          test -f "$G/data/r41-user-visuals.js"
          test -f "$G/data/r41-gm3-techniques.json"
          ! test -f "$G/vercel.json"
          ! grep -R -n -E 'VERCEL_TOKEN|NARUTO_VERCEL_URL|NARUTO_MONGO_VIA_VERCEL' "$G/.env.local.example" "$G/r41-api-config.js" 2>/dev/null
          grep -q 'R41-CLOUDFLARE-MONGODB' "$G/index.html"
          grep -q 'data/r41-user-visuals.js' "$G/index.html"
          grep -q 'src/r41-core-bundle.js' "$G/index.html"
          python3 - <<'PY'
          from pathlib import Path
          s=Path('R41/Naruto Shinobi no Sho PC/_jogo/index.html').read_text(encoding='utf-8')
          assert s.index('data/r41-user-visuals.js') < s.index('src/r41-core-bundle.js') < s.index('src/r41-canonical-repair.js') < s.index('app.js')
          PY
          echo 'Runtime materializado sem dependencia Vercel e com ordem visual correta: OK' >> "$GITHUB_STEP_SUMMARY"

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          G='R41/Naruto Shinobi no Sho PC/_jogo'
          node --check "$G/app.js"
          node --check "$G/r41-api-config.js"
          node --check "$G/r41-github-api.js"
          node --check "$G/data/r41-user-visuals.js"
          node --check "$G/src/r41-canonical-repair.js"
          node --check "$G/cloudflare/r41-api/src/index.js"
          node --check "$G/cloudflare/r41-api/src/entry.js"
          echo 'JavaScript parse: OK' >> "$GITHUB_STEP_SUMMARY"

      - name: Audit literal asset references in Git source
        shell: bash
        run: |
          set -euo pipefail
          G='R41/Naruto Shinobi no Sho PC/_jogo'
          cd "$G"
          R41_ALLOW_USER_OVERLAY_MISSING=1 node tools/audit-r41-assets.mjs
          python3 - <<'PY'
          import json
          d=json.load(open('audit/r41-assets.json',encoding='utf-8'))
          assert d['ok'] is True,d
          assert d['missingHard']==0,d
          print('User bundle pending in Git:',d['missingExternalUserOverlay'])
          PY
          cat audit/r41-assets.json >> "$GITHUB_STEP_SUMMARY"

      - name: Validate TERION authority, API and core catalogs
        shell: bash
        run: |
          set -euo pipefail
          G='R41/Naruto Shinobi no Sho PC/_jogo'
          grep -q 'TERION' "$G/app.js"
          grep -q 'SceneDirector\|sceneDirector\|scene' "$G/app.js"
          grep -q '/api/account/save' "$G/app.js"
          grep -q '/api/online/create' "$G/app.js"
          grep -q '/api/v84/world/event' "$G/app.js"
          grep -q '/api/v84/world/tick' "$G/cloudflare/r41-api/src/entry.js"
          grep -q '/api/private/claim-leon' "$G/cloudflare/r41-api/src/entry.js"
          grep -q '@cf/zai-org/glm-4.7-flash' "$G/cloudflare/r41-api/src/entry.js"
          grep -q 'TERION é a autoridade mecânica' "$G/cloudflare/r41-api/src/entry.js"
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('R41/Naruto Shinobi no Sho PC/_jogo/data/r41-gm3-techniques.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          items=d if isinstance(d,list) else d.get('techniques',d.get('items',[]))
          assert len(items)==2792, len(items)
          print('GM3 techniques:',len(items))
          PY
          echo 'TERION/catalog/API/Workers AI gates: OK' >> "$GITHUB_STEP_SUMMARY"
