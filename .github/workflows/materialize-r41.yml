name: Materialize Shinobi no Sho R41
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/materialize-r41.yml'
      - '.r41-seed/materialize_r41.py'
      - 'r41-live/c*.js'
      - 'r41-live/r41-run.js'
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - name: Materialize R41 static game into GitHub
        run: python3 .r41-seed/materialize_r41.py
      - name: Point GitHub Pages root at local R41
        shell: bash
        run: |
          touch .nojekyll
          cat > index.html <<'HTML'
          <!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="r41-build" content="R41-MD-OPERACIONAL-APLICADO-2026-08-17"><meta http-equiv="refresh" content="0;url=./R41/Naruto%20Shinobi%20no%20Sho%20PC/_jogo/"><title>Shinobi no Sho R41</title></head><body><h1>Shinobi no Sho R41</h1><p><a href="./R41/Naruto%20Shinobi%20no%20Sho%20PC/_jogo/">Entrar no jogo</a></p></body></html>
          HTML
      - name: Validate local static ownership
        shell: bash
        run: |
          set -euo pipefail
          G='R41/Naruto Shinobi no Sho PC/_jogo'
          test -f "$G/app.js"
          test -f "$G/data/r41-gm3-techniques.json"
          grep -q 'R41-MD-OPERACIONAL-APLICADO-2026-08-17' "$G/app.js"
          grep -q 'GitHub' "$G/index.html"
          ! grep -q '<base href="https://naruto-shinobi-r40-online.vercel.app/' "$G/index.html"
          python3 - <<'PY'
          import json
          p='R41/Naruto Shinobi no Sho PC/_jogo/R41_GITHUB_MATERIALIZATION.json'
          d=json.load(open(p,encoding='utf8'))
          assert d['gm3Techniques']==2792,d
          assert d['staticFilesDownloaded']>1000,d
          print(d)
          PY
      - name: Commit materialized game to source branch
        shell: bash
        run: |
          git config user.name 'kaalflash12'
          git config user.email 'mestrederpg35@gmail.com'
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Materialize full R41 runtime on GitHub Pages'
          TARGET="${GITHUB_HEAD_REF:-main}"
          git push origin HEAD:"$TARGET"
