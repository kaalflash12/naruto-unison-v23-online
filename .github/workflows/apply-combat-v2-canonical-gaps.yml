name: Apply Combat V2 Canonical Gaps

on:
  push:
    branches: [main]
    paths:
      - 'tools/patch-combat-rules-v2-canonical-gaps.mjs'
      - '.github/workflows/apply-combat-v2-canonical-gaps.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-combat-v2-canonical-gaps
  cancel-in-progress: false

jobs:
  apply-and-prove:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Repair patcher for current V2 engine
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/patch-combat-rules-v2-canonical-gaps.mjs')
          s=p.read_text(encoding='utf-8')
          old='''once('exports',
          "  VERSION,createFighter,createState,getFighter,normalizeSkill,legacyToV2,resolveTargets,canUseSkill,resolveSkill,applyEffect,applyDamage,runTriggers,endPhase,processDots,costWithStatuses,canPay,pay,evaluateRequirement,intersects,normClasses,makeRng,isImmuneTo,isDisabledFor",
          "  VERSION,createFighter,createState,getFighter,normalizeSkill,legacyToV2,resolveTargets,canUseSkill,resolveSkill,applyEffect,applyDamage,runTriggers,endPhase,processDots,costWithStatuses,canPay,pay,evaluateRequirement,applySkillChanges,intersects,normClasses,makeRng,isImmuneTo,isDisabledFor");'''
          new='''const exportMatch=src.match(/return Object\\.freeze\\(\\{([\\s\\S]*?)\\}\\);/);
          if(!exportMatch)throw new Error('exports: Object.freeze block not found');
          const exportNames=['applySkillChanges','reflectRatio','redirectTarget','tickChannels'];
          let exportBody=exportMatch[1].replace(/\\s+$/,'');
          for(const name of exportNames){if(!new RegExp(`\\\\b${name}\\\\b`).test(exportBody))exportBody+=`,${name}`}
          src=src.replace(exportMatch[0],`return Object.freeze({${exportBody}\\n});`);'''
          if s.count(old)!=1:
              raise SystemExit(f'expected exactly one stale export block, got {s.count(old)}')
          s=s.replace(old,new,1)
          bad="assert.deepEqual(gate.cost,[]);"
          good="assert.equal(gate.cost.length,0);"
          if s.count(bad)!=1:
              raise SystemExit(f'expected exactly one cross-realm assertion, got {s.count(bad)}')
          s=s.replace(bad,good,1)
          p.write_text(s,encoding='utf-8')
          print('PATCHER_CURRENT_V2_REPAIR=PASS')
          PY
          node --check tools/patch-combat-rules-v2-canonical-gaps.mjs
      - name: Apply canonical gap patch
        run: |
          set -euo pipefail
          node tools/patch-combat-rules-v2-canonical-gaps.mjs
      - name: Syntax and deterministic semantics
        run: |
          set -euo pipefail
          node --check combat-rules-v2.js
          node --check tools/test-combat-rules-v2.mjs
          node tools/test-combat-rules-v2.mjs
      - name: Published V2 regression gate
        run: |
          set -euo pipefail
          node tools/audit-published-techniques-v2.mjs | tee /tmp/published-v2-after-gap-patch.json
          node - <<'JS'
          const fs=require('fs');
          const s=JSON.parse(fs.readFileSync('audit/balance/published-v2/SUMMARY.json','utf8'));
          if(s.gate!=='PASS'||s.canonicalPlayableCharacters!==209||s.canonicalLinks!==836) throw new Error('published V2 regression');
          if(s.unsupported!==0||s.runtimeFailures!==0||s.unknownCosts!==0||s.noops!==0) throw new Error('published V2 semantic regression');
          console.log('COMBAT_V2_CANONICAL_GAPS_REGRESSION=PASS');
          JS
      - name: Prove canonical gap semantics at runtime
        run: |
          set -euo pipefail
          node - <<'JS'
          const fs=require('fs');
          const vm=require('vm');
          const assert=require('node:assert/strict');
          const ctx={console};ctx.globalThis=ctx;vm.createContext(ctx);
          vm.runInContext(fs.readFileSync('combat-rules-v2.js','utf8'),ctx,{filename:'combat-rules-v2.js'});
          const R=ctx.NARUTO_COMBAT_RULES_V2;
          for(const name of ['applySkillChanges','reflectRatio','redirectTarget','tickChannels']) assert.equal(typeof R[name],'function',`${name} not exported`);
          const fighter=(id,side)=>({id,side,hp:100,maxHp:100,chakra:{Blood:5,Gen:5,Nin:5,Tai:5,Rand:0}});
          const state=()=>R.createState([fighter('A','A'),fighter('B','B'),fighter('C','B')],{seed:123});
          const get=(s,id)=>R.getFighter(s,id);

          {
            const s=state();
            const skill={id:'dynamic-cost',name:'Dynamic Cost',cost:['Nin'],classes:['nin'],mechanic:{version:2,target:'enemy',changes:[{type:'setCost',cost:[]}],effects:[{type:'damage',amount:1,variance:0}]}};
            const gate=R.canUseSkill(s,'A',skill,'B');
            assert.equal(gate.ok,true);assert.equal(gate.cost.length,0);assert.equal(gate.skill.cost.length,0);
          }
          {
            const s=state();R.applyEffect(s,get(s,'B'),get(s,'B'),{type:'reflect',ratio:.5,duration:2,classes:['all']});
            const r=R.applyDamage(s,get(s,'A'),get(s,'B'),{type:'damage',amount:20,variance:0,classes:['all']});
            assert.equal(r.dealt,20);assert.equal(r.reflected,10);assert.equal(get(s,'A').hp,90);
          }
          {
            const s=state();R.applyEffect(s,get(s,'C'),get(s,'B'),{type:'redirect',redirectToId:'C',duration:2,classes:['all']});
            const r=R.applyDamage(s,get(s,'A'),get(s,'B'),{type:'damage',amount:20,variance:0,classes:['all']});
            assert.equal(r.redirectedTo,'C');assert.equal(get(s,'B').hp,100);assert.equal(get(s,'C').hp,80);
          }
          {
            const s=state();R.applyEffect(s,get(s,'A'),get(s,'B'),{type:'bomb',duration:1,durationUnit:'ownerPhases',effects:[{type:'damage',amount:7,variance:0}]});
            R.endPhase(s,'B');assert.equal(get(s,'B').hp,93);assert.equal(get(s,'B').traps.length,0);
          }
          {
            const s=state();get(s,'B').hp=10;const r=R.applyEffect(s,get(s,'B'),get(s,'B'),{type:'sacrifice',amount:20,minHp:1});
            assert.equal(r.lost,9);assert.equal(get(s,'B').hp,1);
          }
          {
            const s=state();R.applyEffect(s,get(s,'A'),get(s,'B'),{type:'channel',id:'ch',duration:1,durationUnit:'ownerPhases',tickEffects:[{type:'damage',amount:5,variance:0}]});
            assert.equal(get(s,'B').channels.length,1);R.endPhase(s,'B');assert.equal(get(s,'B').hp,95);assert.equal(get(s,'B').channels.length,0);
          }
          {
            const s=state();R.applyEffect(s,get(s,'A'),get(s,'B'),{type:'channel',id:'ch2',duration:3,durationUnit:'ownerPhases',tickEffects:[{type:'damage',amount:5,variance:0}]});
            const r=R.applyEffect(s,get(s,'A'),get(s,'B'),{type:'interrupt',channelId:'ch2',classes:['all']});
            assert.equal(r.interrupted,1);assert.equal(get(s,'B').channels.length,0);
          }
          console.log('COMBAT_V2_CANONICAL_GAPS_RUNTIME=PASS');
          JS
      - name: Commit proven engine patch and repaired patcher
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/patch-combat-rules-v2-canonical-gaps.mjs combat-rules-v2.js tools/test-combat-rules-v2.mjs audit/balance/published-v2
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'feat(combat): apply canonical gap semantics to V2 engine'
          git pull --rebase origin main
          git push origin HEAD:main
