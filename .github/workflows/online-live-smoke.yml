name: Online Live Smoke

on:
  push:
    paths:
      - 'index.html'
      - 'online-config.js'
      - 'secure-auth-adapter.js'
      - 'app-online.js'
      - '.github/workflows/online-live-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Smoke production Pages, assets, Auth and API
        shell: bash
        env:
          SITE: https://kaalflash12.github.io/naruto-unison-v23-online
          API: https://cpdgkszviwrgrwsltbyk.supabase.co/functions/v1/naruto-api-cors
          BRIDGE: https://cpdgkszviwrgrwsltbyk.supabase.co/functions/v1/legacy-auth-bridge
          AUTH_HEALTH: https://cpdgkszviwrgrwsltbyk.supabase.co/auth/v1/health
          PUBLISHABLE_KEY: sb_publishable_KGkT_uJNg1nRBgftEvlT3w_c_aHOo5K
          ORIGIN: https://kaalflash12.github.io
        run: |
          set -euo pipefail

          echo '== Wait until GitHub Pages serves online-r45 through CORS gateway =='
          ready=0
          for i in $(seq 1 36); do
            if curl -fLsS --connect-timeout 10 --max-time 25 "$SITE/online-config.js?v=$GITHUB_SHA-$i" -o /tmp/online-config.js \
              && grep -Fq "version:'online-r45'" /tmp/online-config.js \
              && grep -Fq "functionUrl:'https://cpdgkszviwrgrwsltbyk.supabase.co/functions/v1/naruto-api-cors'" /tmp/online-config.js \
              && grep -Fq 'secure-auth-adapter.js?v=20260827-r45' /tmp/online-config.js \
              && grep -Fq "</'+'script>" /tmp/online-config.js; then
              ready=1
              break
            fi
            sleep 5
          done
          test "$ready" -eq 1

          echo '== Public index and required bundles =='
          curl -fLsS --connect-timeout 10 --max-time 30 "$SITE/?v=$GITHUB_SHA" -o /tmp/index.html
          grep -Fq 'online-config.js' /tmp/index.html
          grep -Fq 'app-online.js' /tmp/index.html

          assets=(
            roster.js
            story-data.js
            character-unlocks.js
            jutsu-variants.js
            battle-fx.js
            v23-data.js
            online-config.js
            secure-auth-adapter.js
            app-online.js
            desktop-overhaul.css
            r39-live-hotfix.css
            r42-responsive-fix.css
            account-recovery.js
            r40-battle-guard.js
            r40-desktop-overhaul.js
            r39-live-hotfix.js
            r43-admin-entry.js
          )
          for asset in "${assets[@]}"; do
            echo "asset: $asset"
            curl -fLsS --connect-timeout 10 --max-time 30 "$SITE/$asset?v=$GITHUB_SHA" -o "/tmp/${asset//\//_}"
            test -s "/tmp/${asset//\//_}"
          done

          echo '== JavaScript parser gate on deployed files =='
          node --check /tmp/online-config.js
          node --check /tmp/secure-auth-adapter.js
          node --check /tmp/app-online.js
          node --check /tmp/account-recovery.js
          node --check /tmp/r40-battle-guard.js
          node --check /tmp/r40-desktop-overhaul.js
          node --check /tmp/r39-live-hotfix.js
          node --check /tmp/r43-admin-entry.js

          echo '== naruto-api-cors OPTIONS / CORS =='
          options_code="$(curl -sS --connect-timeout 10 --max-time 30 \
            -D /tmp/api-options.headers -o /tmp/api-options.body -w '%{http_code}' \
            -X OPTIONS \
            -H "Origin: $ORIGIN" \
            -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: content-type,authorization' \
            "$API/api/account/login")"
          case "$options_code" in
            200|204) ;;
            *) echo "Unexpected OPTIONS status: $options_code"; cat /tmp/api-options.body; exit 1 ;;
          esac
          tr -d '\r' < /tmp/api-options.headers | grep -Eqi '^access-control-allow-origin:[[:space:]]*https://kaalflash12\.github\.io$'

          echo '== naruto-api login route is reachable with CORS on error =='
          code="$(curl -sS --connect-timeout 10 --max-time 30 \
            -D /tmp/login.headers -o /tmp/login.json -w '%{http_code}' \
            -H "Origin: $ORIGIN" \
            -H 'content-type: application/json' \
            --data "{\"login\":\"smoke${GITHUB_RUN_ID}\",\"password\":\"invalid-password-live-smoke\"}" \
            "$API/api/account/login")"
          case "$code" in
            400|401|403|429) ;;
            *) echo "Unexpected login status: $code"; cat /tmp/login.json; exit 1 ;;
          esac
          tr -d '\r' < /tmp/login.headers | grep -Eqi '^access-control-allow-origin:[[:space:]]*https://kaalflash12\.github\.io$'
          tr -d '\r' < /tmp/login.headers | grep -Eqi '^x-naruto-cors-gateway:[[:space:]]*1$'

          echo '== Supabase Auth health =='
          curl -fLsS --connect-timeout 10 --max-time 30 \
            -H "apikey: $PUBLISHABLE_KEY" \
            "$AUTH_HEALTH" -o /tmp/auth-health.json
          test -s /tmp/auth-health.json

          echo '== legacy-auth-bridge health / CORS =='
          curl -fLsS --connect-timeout 10 --max-time 30 \
            -H "Origin: $ORIGIN" \
            "$BRIDGE/health" -o /tmp/bridge-health.json
          grep -Fq '"ok":true' /tmp/bridge-health.json
          grep -Fq 'legacy-auth-bridge' /tmp/bridge-health.json
          curl -sS --connect-timeout 10 --max-time 30 \
            -D /tmp/bridge-options.headers -o /tmp/bridge-options.body \
            -X OPTIONS \
            -H "Origin: $ORIGIN" \
            -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: content-type' \
            "$BRIDGE/exchange"
          grep -Eqi '^access-control-allow-origin:[[:space:]]*https://kaalflash12\.github\.io' /tmp/bridge-options.headers

          echo '== legacy-auth-bridge exchange route is reachable =='
          bridge_code="$(curl -sS --connect-timeout 10 --max-time 30 \
            -o /tmp/bridge-exchange.json -w '%{http_code}' \
            -H "Origin: $ORIGIN" \
            -H 'content-type: application/json' \
            --data '{"token":"00000000000000000000000000000000","password":"invalid-password-live-smoke"}' \
            "$BRIDGE/exchange")"
          case "$bridge_code" in
            401|403|428|429) ;;
            *) echo "Unexpected bridge status: $bridge_code"; cat /tmp/bridge-exchange.json; exit 1 ;;
          esac

          echo 'ONLINE_LIVE_SMOKE=PASS'

      - name: Browser public CORS proof
        shell: bash
        env:
          SITE: https://kaalflash12.github.io/naruto-unison-v23-online
          EXPECTED_API: https://cpdgkszviwrgrwsltbyk.supabase.co/functions/v1/naruto-api-cors
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || true)"
          test -n "$CHROME"
          WORK="$(mktemp -d)"
          cd "$WORK"
          npm init -y >/dev/null 2>&1
          npm install --silent --no-audit --no-fund puppeteer-core@24.16.0
          CHROME="$CHROME" SITE="$SITE" EXPECTED_API="$EXPECTED_API" GITHUB_RUN_ID="$GITHUB_RUN_ID" node <<'NODE'
          const puppeteer = require('puppeteer-core');

          (async () => {
            const browser = await puppeteer.launch({
              executablePath: process.env.CHROME,
              headless: true,
              args: ['--no-sandbox', '--disable-dev-shm-usage']
            });
            const page = await browser.newPage();
            const failures = [];

            page.on('console', msg => {
              const text = msg.text();
              if (/cors|failed to fetch/i.test(text)) failures.push(`console:${text}`);
            });
            page.on('pageerror', err => {
              const text = String(err && err.message || err);
              if (/cors|failed to fetch/i.test(text)) failures.push(`pageerror:${text}`);
            });
            page.on('requestfailed', req => {
              if (/supabase\.co/i.test(req.url())) failures.push(`requestfailed:${req.method()}:${req.url()}:${req.failure()?.errorText || ''}`);
            });

            const response = await page.goto(`${process.env.SITE}/?browser-proof=${Date.now()}`, {
              waitUntil: 'domcontentloaded',
              timeout: 30000
            });
            if (!response || !response.ok()) throw new Error(`Public page HTTP ${response?.status()}`);
            await new Promise(resolve => setTimeout(resolve, 1500));

            const proof = await page.evaluate(async ({ expectedApi, runId }) => {
              const cfg = window.NARUTO_ONLINE_CONFIG || {};
              const actualApi = String(cfg.functionUrl || '');
              if (actualApi !== expectedApi) return { error: `Unexpected functionUrl: ${actualApi}`, actualApi };
              try {
                const r = await fetch(`${actualApi}/api/account/login`, {
                  method: 'POST',
                  headers: { 'content-type': 'application/json' },
                  body: JSON.stringify({ login: `browser-smoke${runId}`, password: 'invalid-password-browser-smoke' })
                });
                const body = await r.text();
                return { actualApi, status: r.status, body: body.slice(0, 500) };
              } catch (e) {
                return { actualApi, error: String(e && e.message || e) };
              }
            }, { expectedApi: process.env.EXPECTED_API, runId: process.env.GITHUB_RUN_ID });

            console.log('BROWSER_PROOF=' + JSON.stringify(proof));
            if (proof.error) throw new Error(proof.error);
            if (![400, 401, 403, 429].includes(proof.status)) throw new Error(`Unexpected browser login status: ${proof.status}`);
            if (failures.length) throw new Error('Browser network/CORS failures: ' + failures.join(' | '));

            const title = await page.title();
            if (!/Naruto Unison/i.test(title)) throw new Error(`Unexpected public title: ${title}`);
            console.log('BROWSER_CORS_PROOF=PASS');
            await browser.close();
          })().catch(err => {
            console.error(err);
            process.exit(1);
          });
          NODE
