name: Validate Phase-aware Defense Expiry

on:
  push:
    branches: [main]
    paths:
      - 'app-online.js'
      - 'tools/simulate-balance.mjs'
      - '.github/workflows/phase-defense-balance-fix.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prove phase-aware defense semantics are installed
        shell: bash
        run: |
          set -euo pipefail
          node --check app-online.js
          node --check tools/simulate-balance.mjs
          node - <<'JS'
          const fs=require('fs');
          const app=fs.readFileSync('app-online.js','utf8');
          const sim=fs.readFileSync('tools/simulate-balance.mjs','utf8');
          const requiredApp=[
            'function expireDefenseAfterOpponentPhase(team)',
            'expireDefenseAfterOpponentPhase(G.ai);',
            'expireDefenseAfterOpponentPhase(G.you);'
          ];
          for(const marker of requiredApp){
            if(!app.includes(marker)) throw new Error('app-online.js missing marker: '+marker);
          }
          const helperCount=(app.match(/function expireDefenseAfterOpponentPhase\(team\)/g)||[]).length;
          if(helperCount!==1) throw new Error('app helper count='+helperCount);
          const aiCalls=(app.match(/expireDefenseAfterOpponentPhase\(G\.ai\);/g)||[]).length;
          const youCalls=(app.match(/expireDefenseAfterOpponentPhase\(G\.you\);/g)||[]).length;
          if(aiCalls<2||youCalls<2) throw new Error(`phase calls insufficient ai=${aiCalls} you=${youCalls}`);
          const tickStart=app.indexOf('async function tick(){');
          const tickEnd=app.indexOf('\n}',tickStart);
          const tick=app.slice(tickStart,tickEnd+2);
          if(/invTurns|shieldTurns/.test(tick)) throw new Error('global tick still decrements phase defenses');
          if(!sim.includes('function expireDefenseAfterOpponentPhase(team)')) throw new Error('sim helper missing');
          if(!sim.includes('step(A,B,chA,policyA);expireDefenseAfterOpponentPhase(B)')) throw new Error('sim A→B phase expiry missing');
          if(!sim.includes('step(B,A,chB,policyB);expireDefenseAfterOpponentPhase(A)')) throw new Error('sim B→A phase expiry missing');
          console.log('PHASE_DEFENSE_MARKERS=PASS',{helperCount,aiCalls,youCalls});
          JS
      - name: Run reduced deterministic simulator smoke
        env:
          BALANCE_DUEL_SEEDS: '1'
          BALANCE_TEAM_BATTLES: '1000'
          BALANCE_MAX_TURNS: '20'
        run: |
          set -euo pipefail
          node tools/simulate-balance.mjs > /tmp/phase-defense-smoke.json
          grep -q '"characters": 209' /tmp/phase-defense-smoke.json
          grep -q '"jutsusObserved": 836' /tmp/phase-defense-smoke.json
          git restore audit/balance/current
          test -z "$(git status --porcelain)"
          echo 'PHASE_DEFENSE_SIMULATION=PASS'
