name: Apply Canonical Engine Envelope Classifier

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-canonical-engine-envelope-classifier.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-canonical-engine-envelope-classifier
  cancel-in-progress: false

jobs:
  apply-and-prove:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Patch classifier and finalizer for engine envelope
        run: |
          set -euo pipefail
          node <<'JS'
          const fs=require('fs');
          function once(src,from,to,label,path){
            if(src.includes(to)) return src;
            const n=src.split(from).length-1;
            if(n!==1) throw new Error(`${path}:${label}: expected 1 match, got ${n}`);
            return src.replace(from,to);
          }
          function patchClassifier(){
            const path='tools/classify-canonical-upstream-v2.mjs';
            let src=fs.readFileSync(path,'utf8');
            src=once(src,
              "  if (['enemies', 'all-enemies'].includes(t)) return 'enemies';",
              "  if (['enemies', 'all-enemies', 'other-enemies'].includes(t)) return 'enemies';",
              'other-enemies-normalization',path);
            const marker='function publishedCategories(published) {';
            if(!src.includes('function engineEnvelopeEffects(published)')){
              const helper=`function engineEnvelopeEffects(published) {\n  const roots=arr(published?.effect?.engineEffects);\n  const out=[];\n  const visit=(e)=>{\n    if(!e||typeof e!=='object')return;out.push(e);\n    for(const k of ['effects','tickEffects','endEffects','onBreak'])for(const child of arr(e[k]))visit(child);\n  };\n  for(const e of roots)visit(e);\n  return out;\n}\nfunction engineEffectCategory(e) {\n  const type=String(e?.type||'');\n  const direct={damage:'damage',heal:'heal',defense:'defense',invulnerable:'invulnerable',immunity:'invulnerable',stun:'stun',disable:'disable',silence:'silence',dot:'dot',reduction:'reduction',focus:'focus',strengthen:'strengthen',expose:'expose',exhaust:'exhaust',weaken:'weaken',cleanse:'cleanse',cure:'cleanse',dispel:'dispel',demolish:'demolish',chakra:'chakra',stack:'stack',alternate:'alternate',trap:'trap-counter',counter:'trap-counter',bomb:'bomb',sacrifice:'sacrifice',reflect:'reflect',redirect:'redirect',channel:'channel',interrupt:'interrupt'};\n  if(type==='leech')return ['damage','leech','heal'];\n  if(type==='status'){const s=String(e?.status||'');if(['stun','freeze'].includes(s))return['stun'];if(s==='bind')return['disable'];if(s==='silence')return['silence'];if(s==='invuln')return['invulnerable'];if(['bleed','burn','parasite','poison'].includes(s))return['dot'];if(s==='counter')return['trap-counter'];if(s==='regen')return['heal'];if(s==='vulnerable')return['expose'];if(s==='chakra-lock')return['chakra'];return['status'];}\n  return direct[type]?[direct[type]]:[];\n}\nfunction engineEnvelopeCategories(published) {\n  const out=[];\n  for(const e of engineEnvelopeEffects(published)){out.push(...engineEffectCategory(e));if(e?.amountScale?.type==='stack')out.push('stack');}\n  if(published?.effect?.engineRequirements!=null)out.push('requirement');\n  if(published?.effect?.engineCharges!=null||published?.charges!=null)out.push('charges');\n  if(arr(published?.effect?.engineChanges).length)out.push('dynamic-change');\n  return uniq(out);\n}\nfunction engineEnvelopeTargets(published){return uniq(engineEnvelopeEffects(published).map(e=>normalizeTarget(e?.target)).filter(t=>t&&t!=='unknown'));}\nfunction engineEnvelopeDurations(published){return uniq(engineEnvelopeEffects(published).map(e=>num(e?.duration,null)).filter(x=>x!=null&&x>0)).sort((a,b)=>a-b);}\nfunction engineEnvelopeDirectDamage(published){return engineEnvelopeEffects(published).filter(e=>['damage','leech'].includes(String(e?.type||''))).map(e=>num(e?.amount,null)).filter(x=>x!=null);}\n\n`;
              const n=src.split(marker).length-1;if(n!==1)throw new Error(`${path}:helper-marker:${n}`);src=src.replace(marker,helper+marker);
            }
            src=once(src,"function publishedCategories(published) {\n  const out = [];","function publishedCategories(published) {\n  const out = [...engineEnvelopeCategories(published)];",'categories-envelope',path);
            src=once(src,
              "function publishedTargets(published) {\n  return uniq(arr(published?.mechanics).map((m) => normalizeTarget(m?.target === 'primary' ? (['buff','heal','shield','cleanse','chakra-gain'].includes(String(m?.op)) ? 'ally' : 'enemy') : m?.target)));\n}",
              "function publishedTargets(published) {\n  return uniq([...arr(published?.mechanics).map((m) => normalizeTarget(m?.target === 'primary' ? (['buff','heal','shield','cleanse','chakra-gain'].includes(String(m?.op)) ? 'ally' : 'enemy') : m?.target)), ...engineEnvelopeTargets(published)]);\n}",
              'targets-envelope',path);
            src=once(src,
              "function publishedDurations(published) {\n  return uniq(arr(published?.mechanics).map((m) => num(m?.turns, null)).filter((x) => x != null && x > 0)).sort((a, b) => a - b);\n}",
              "function publishedDurations(published) {\n  return uniq([...arr(published?.mechanics).map((m) => num(m?.turns, null)).filter((x) => x != null && x > 0), ...engineEnvelopeDurations(published)]).sort((a, b) => a - b);\n}",
              'durations-envelope',path);
            src=once(src,"  return vals;\n}\nfunction canonicalDirectDamage(upstream) {","  return [...vals,...engineEnvelopeDirectDamage(published)];\n}\nfunction canonicalDirectDamage(upstream) {",'damage-envelope',path);
            const unresolved="  const unresolved = classifyTechnique({ published: basePublished, upstream: null });";
            if(!src.includes('SELFTEST_ENGINE_MINATO')){
              const tests=`  const engineMinato=classifyTechnique({published:{description:'Rasen-Flash causa 20 de dano ao alvo e 20 por marca em todos os inimigos.',chakraCost:['KEK','Q'],cooldown:0,mechanics:[],effect:{engineEffects:[{type:'damage',target:'enemy',amount:20},{type:'damage',target:'enemies',amount:0,amountScale:{type:'stack',source:'target',key:'Space-Time Marking',per:20}}]}},upstream:{categories:['damage','stack'],damage:[20],pierce:[],afflict:[],heal:[],defend:[],reduce:[],executeThresholds:[],targets:['enemy','enemies'],cost:['Blood','Rand'],cooldown:0,durations:[]}});\n  if(JSON.stringify(engineMinato.classifications)!==JSON.stringify(['CORRETA']))throw new Error('SELFTEST_ENGINE_MINATO:'+JSON.stringify(engineMinato));\n  const engineCat=classifyTechnique({published:{description:'Cat Claws causa 15 no alvo e 5 nos demais; +5 por uso.',chakraCost:['KEK'],cooldown:1,mechanics:[],effect:{engineRequirements:{type:'stackAtLeast',key:'Two-Tailed Transformation',amount:1},engineEffects:[{type:'damage',target:'enemy',amount:15,amountScale:{type:'stack',source:'source',key:'Cat Claws',per:5}},{type:'damage',target:'other-enemies',amount:5,amountScale:{type:'stack',source:'source',key:'Cat Claws',per:5}},{type:'stack',target:'self',key:'Cat Claws',op:'add',amount:1}]}},upstream:{categories:['damage','stack','requirement'],damage:[],pierce:[],afflict:[],heal:[],defend:[],reduce:[],executeThresholds:[],targets:['enemy','enemies','self'],cost:['Blood'],cooldown:1,durations:[]}});\n  if(JSON.stringify(engineCat.classifications)!==JSON.stringify(['CORRETA']))throw new Error('SELFTEST_ENGINE_CAT:'+JSON.stringify(engineCat));\n`;
              const n=src.split(unresolved).length-1;if(n!==1)throw new Error(`${path}:selftest-marker:${n}`);src=src.replace(unresolved,tests+unresolved);
            }
            fs.writeFileSync(path,src);
          }
          function patchFinalizer(){
            const path='tools/finalize-canonical-upstream-v2.mjs';
            let src=fs.readFileSync(path,'utf8');
            src=once(src,"const targetNorm=x=>{const t=String(x??'').trim().toLowerCase();if(t==='primary')return'enemy';if(t==='all-enemies'||t==='enemies')return'enemies';if(t==='all-allies'||t==='allies')return'allies';return t||'unknown'};","const targetNorm=x=>{const t=String(x??'').trim().toLowerCase();if(t==='primary')return'enemy';if(t==='all-enemies'||t==='enemies'||t==='other-enemies')return'enemies';if(t==='all-allies'||t==='allies')return'allies';return t||'unknown'};",'final-target-normalization',path);
            const marker='function localCats(pub){';
            if(!src.includes('function engineEnvelopeEffects(pub)')){
              const helper=`function engineEnvelopeEffects(pub){const out=[];const visit=e=>{if(!e||typeof e!=='object')return;out.push(e);for(const k of ['effects','tickEffects','endEffects','onBreak'])for(const child of arr(e[k]))visit(child)};for(const e of arr(pub?.effect?.engineEffects))visit(e);return out}\nfunction engineEnvelopeCats(pub){const out=[];const map={damage:'damage',heal:'heal',defense:'defense',invulnerable:'invulnerable',immunity:'invulnerable',stun:'stun',disable:'disable',silence:'silence',dot:'dot',reduction:'reduction',focus:'focus',strengthen:'strengthen',expose:'expose',exhaust:'exhaust',weaken:'weaken',cleanse:'cleanse',cure:'cleanse',dispel:'dispel',demolish:'demolish',chakra:'chakra',stack:'stack',alternate:'alternate',trap:'trap-counter',counter:'trap-counter',bomb:'bomb',sacrifice:'sacrifice',reflect:'reflect',redirect:'redirect',channel:'channel',interrupt:'interrupt'};for(const e of engineEnvelopeEffects(pub)){const t=String(e?.type||'');if(t==='leech')out.push('damage','leech','heal');else if(t==='status'){const s=String(e?.status||'');if(['stun','freeze'].includes(s))out.push('stun');else if(s==='bind')out.push('disable');else if(s==='silence')out.push('silence');else if(s==='invuln')out.push('invulnerable');else if(['bleed','burn','parasite','poison'].includes(s))out.push('dot');else if(s==='counter')out.push('trap-counter');else if(s==='regen')out.push('heal');else if(s==='vulnerable')out.push('expose');else if(s==='chakra-lock')out.push('chakra');else out.push('status')}else if(map[t])out.push(map[t]);if(e?.amountScale?.type==='stack')out.push('stack')}if(pub?.effect?.engineRequirements!=null)out.push('requirement');if(pub?.effect?.engineCharges!=null||pub?.charges!=null)out.push('charges');if(arr(pub?.effect?.engineChanges).length)out.push('dynamic-change');return uniq(out)}\nfunction engineEnvelopeTargets(pub){return uniq(engineEnvelopeEffects(pub).map(e=>targetNorm(e?.target)).filter(t=>t&&t!=='unknown'))}\nfunction engineEnvelopeDur(pub){return uniq(engineEnvelopeEffects(pub).map(e=>num(e?.duration,null)).filter(x=>x!=null&&x>0)).sort((a,b)=>a-b)}\nfunction engineEnvelopeDamage(pub){return engineEnvelopeEffects(pub).filter(e=>['damage','leech'].includes(String(e?.type||''))).map(e=>num(e?.amount,null)).filter(x=>x!=null)}\n`;
              const n=src.split(marker).length-1;if(n!==1)throw new Error(`${path}:helper-marker:${n}`);src=src.replace(marker,helper+marker);
            }
            src=once(src,"function localCats(pub){const out=[];","function localCats(pub){const out=[...engineEnvelopeCats(pub)];",'final-cats-envelope',path);
            src=once(src,"function localTargets(pub){return uniq(arr(pub.mechanics).map(m=>targetNorm(m?.target==='primary'?(['buff','heal','shield','cleanse','chakra-gain'].includes(String(m?.op))?'ally':'enemy'):m?.target)))}","function localTargets(pub){return uniq([...arr(pub.mechanics).map(m=>targetNorm(m?.target==='primary'?(['buff','heal','shield','cleanse','chakra-gain'].includes(String(m?.op))?'ally':'enemy'):m?.target)),...engineEnvelopeTargets(pub)])}",'final-targets-envelope',path);
            src=once(src,"function localDur(pub){return uniq(arr(pub.mechanics).map(m=>num(m?.turns,null)).filter(x=>x!=null&&x>0)).sort((a,b)=>a-b)}","function localDur(pub){return uniq([...arr(pub.mechanics).map(m=>num(m?.turns,null)).filter(x=>x!=null&&x>0),...engineEnvelopeDur(pub)]).sort((a,b)=>a-b)}",'final-dur-envelope',path);
            src=once(src,"function localDamage(pub){const v=[];for(const m of arr(pub.mechanics)){if(['damage','multi-hit','drain'].includes(String(m?.op))){const n=num(m.amount,null);if(n!=null)v.push(n)}}return v}","function localDamage(pub){const v=[];for(const m of arr(pub.mechanics)){if(['damage','multi-hit','drain'].includes(String(m?.op))){const n=num(m.amount,null);if(n!=null)v.push(n)}}return[...v,...engineEnvelopeDamage(pub)]}",'final-damage-envelope',path);
            fs.writeFileSync(path,src);
          }
          patchClassifier();patchFinalizer();
          JS
      - name: Syntax and classifier self-test
        run: |
          set -euo pipefail
          node --check tools/classify-canonical-upstream-v2.mjs
          node --check tools/finalize-canonical-upstream-v2.mjs
          node tools/classify-canonical-upstream-v2.mjs --self-test
      - name: Verify envelope markers
        run: |
          set -euo pipefail
          grep -Fq "engineEnvelopeCategories" tools/classify-canonical-upstream-v2.mjs
          grep -Fq "other-enemies" tools/classify-canonical-upstream-v2.mjs
          grep -Fq "SELFTEST_ENGINE_MINATO" tools/classify-canonical-upstream-v2.mjs
          grep -Fq "engineEnvelopeCats" tools/finalize-canonical-upstream-v2.mjs
          echo 'CANONICAL_ENGINE_ENVELOPE_CLASSIFIER=PASS'
      - name: Commit proven classifier patch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/classify-canonical-upstream-v2.mjs tools/finalize-canonical-upstream-v2.mjs
          if git diff --cached --quiet; then
            echo 'Patch already present.'
            exit 0
          fi
          git commit -m 'fix(canonical): classify V2 engine envelope semantics'
          git pull --rebase origin main
          git push origin HEAD:main
