name: Inspect Naruto Unison R38 artifacts

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1
      - name: List release assets and validate R382 patch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          echo '=== RELEASES ==='
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 || true
          echo '=== RELEASE ASSETS ==='
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | {tag:.tag_name,name:.name,assets:[.assets[]?.name]}' || true
          echo '=== R382 PATCH ==='
          python - <<'PY'
          from pathlib import Path
          import base64,re,lzma,hashlib
          paths=['.r382-delta/part-00','.r382-delta/part-01','.r382-delta/part-02','.r382-delta/part-03','.r382-delta/part-04','.r382-delta/part-05','.r382-delta/part-06']
          s=b''.join(re.sub(rb'[^A-Za-z0-9+/=]',b'',Path(p).read_bytes()) for p in paths)
          print('chars',len(s),'mod4',len(s)%4)
          data=base64.b64decode(s,validate=True)
          lzma.decompress(data)
          print('bytes',len(data),'sha256',hashlib.sha256(data).hexdigest())
          Path('/tmp/r382.tar.xz').write_bytes(data)
          PY
          tar -tJf /tmp/r382.tar.xz | head -80
