name: Validate Naruto Unison R38.2 payload

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1
      - name: Recover, reconstruct and validate
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/r382-site"
          rm -rf "$OUT"
          mkdir -p "$OUT"

          python - <<'PY'
          from pathlib import Path
          import base64,re,lzma,itertools

          paths=['.r38-delta/part-00','.r38-delta/part-01','.r38-delta/part-02','.r38-delta/part-03-05','.r38-delta/part-06-08']
          s=b''.join(re.sub(rb'[^A-Za-z0-9+/=]',b'',Path(p).read_bytes()) for p in paths)
          print('R38 base64 chars',len(s),'mod4',len(s)%4)
          recovered=None
          if len(s)%4==0:
              try:
                  data=base64.b64decode(s,validate=True); lzma.decompress(data); recovered=data
                  print('R38 payload already valid')
              except Exception as e: print('R38 existing decode invalid',repr(e))
          elif len(s)%4==1:
              prefix=s[:-1]
              last=s[-1:]
              alphabet=b'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/'
              candidates=[]
              for a in alphabet:
                for b in alphabet:
                  for c in alphabet:
                    q=last+bytes((a,b,c))
                    try: tail=base64.b64decode(q,validate=True)
                    except Exception: continue
                    if tail.endswith(b'YZ'): candidates.append(bytes((a,b,c)))
              print('XZ footer suffix candidates', [x.decode() for x in candidates])
              for suf in candidates:
                  try:
                      data=base64.b64decode(s+suf,validate=True)
                      lzma.decompress(data)
                      recovered=data
                      print('RECOVERED_R38_SUFFIX='+suf.decode())
                      break
                  except Exception: pass
          if recovered is None: raise SystemExit('R38 payload could not be recovered')
          Path('/tmp/r38.tar.xz').write_bytes(recovered)

          p382=['.r382-delta/part-00','.r382-delta/part-01','.r382-delta/part-02','.r382-delta/part-03','.r382-delta/part-04','.r382-delta/part-05','.r382-delta/part-06']
          s382=b''.join(re.sub(rb'[^A-Za-z0-9+/=]',b'',Path(p).read_bytes()) for p in p382)
          print('R382 base64 chars',len(s382),'mod4',len(s382)%4)
          data382=base64.b64decode(s382,validate=True)
          lzma.decompress(data382)
          Path('/tmp/r382.tar.xz').write_bytes(data382)
          print('R382 payload valid bytes',len(data382))
          PY

          xz -t /tmp/r38.tar.xz
          tar -xJf /tmp/r38.tar.xz -C "$OUT"
          cp -a .r38-patch/. "$OUT/"
          sed -i 's/V23.31-R38/V23.31-R38.1/g' "$OUT/index.html"
          sed -i 's/naruto-unison-v23-31-r38/naruto-unison-v23-31-r38-1/g' "$OUT/sw.js"
          sed -i 's/37.1.5/38.1.0/g' "$OUT/src/core/bootstrap.js"
          xz -t /tmp/r382.tar.xz
          tar -xJf /tmp/r382.tar.xz -C "$OUT"

          grep -q 'V23.32-R38.2' "$OUT/index.html"
          grep -q 'submissionId' "$OUT/src/domains/ranked/ranked-service.js"
          test "$(find "$OUT/assets/fx-r382" -type f -name '*.svg' | wc -l)" -eq 31
          node --check "$OUT/src/core/bootstrap.js"
          node --check "$OUT/src/fx/combat-animation-director.js"
          node --check "$OUT/src/fx/item-fx-director.js"
          echo "VALIDATED R38.2 $(find "$OUT" -type f | wc -l) files"
