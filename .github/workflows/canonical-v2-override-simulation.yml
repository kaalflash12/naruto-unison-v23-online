name: Canonical V2 Override Simulation

on:
  push:
    branches: [main]
    paths:
      - 'balance/canonical-v2-overrides.json'
      - 'combat-rules-v2.js'
      - 'roster.js'
      - 'tools/simulate-balance-3v3-v2.mjs'
      - 'tools/run-balance-v2-with-overrides.mjs'
      - '.github/workflows/canonical-v2-override-simulation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canonical-v2-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate configuration and runner
        run: |
          set -euo pipefail
          node --check tools/run-balance-v2-with-overrides.mjs
          node --check tools/simulate-balance-3v3-v2.mjs
          node --check combat-rules-v2.js
          node - <<'JS'
          const fs=require('fs');
          const c=JSON.parse(fs.readFileSync('balance/canonical-v2-overrides.json','utf8'));
          const keys=Object.keys(c.overrides||{});
          if(c.mode!=='analysis-only') throw new Error('override mode must remain analysis-only');
          if(keys.length!==8) throw new Error('expected 8 canonical overrides, got '+keys.length);
          const batch2=keys.filter(k=>c.overrides[k]?.batch===2);
          if(batch2.length!==5) throw new Error('expected 5 Batch 002 overrides, got '+batch2.length);
          console.log('CANONICAL_OVERRIDE_CONFIG=PASS',{total:keys.length,batch2:batch2.length});
          JS

      - name: Run deterministic override simulation smoke
        env:
          SIM_MODE: smoke
          SIM_SEEDS: '1'
          SIM_MAX_TURNS: '20'
        run: |
          set -euo pipefail
          node tools/run-balance-v2-with-overrides.mjs | tee /tmp/canonical-v2-override-state.json
          test -s audit/balance/simulation-v2-overrides/OVERRIDE-APPLICATION.json
          node - <<'JS'
          const fs=require('fs');
          const p='audit/balance/simulation-v2-overrides/OVERRIDE-APPLICATION.json';
          const s=JSON.parse(fs.readFileSync(p,'utf8'));
          if(s.overridesConfigured!==8) throw new Error('overridesConfigured='+s.overridesConfigured);
          if(s.batches['1']!==3||s.batches['2']!==5) throw new Error('unexpected batches '+JSON.stringify(s.batches));
          if(s.publicRosterMutated!==false||s.scope!=='analysis-only') throw new Error('analysis-only guard failed');
          console.log('CANONICAL_OVERRIDE_EXECUTION=PASS',s);
          JS

      - name: Prove public roster remains unchanged
        run: |
          set -euo pipefail
          git diff --exit-code -- roster.js
          echo 'PUBLIC_ROSTER_UNCHANGED=PASS'

      - uses: actions/upload-artifact@v4
        with:
          name: canonical-v2-override-smoke-${{ github.sha }}
          path: audit/balance/simulation-v2-overrides
          if-no-files-found: error
          retention-days: 30
