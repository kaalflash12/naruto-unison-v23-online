name: Balance Evaluation Policy

on:
  push:
    branches: [main]
    paths:
      - 'audit/balance/current/CHARACTER-SIMULATION.json'
      - 'tools/evaluate-balance-policy.mjs'
      - '.github/workflows/balance-evaluation-policy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run uncertainty and exploitability evaluation
        run: |
          set -euo pipefail
          node --check tools/evaluate-balance-policy.mjs
          node tools/evaluate-balance-policy.mjs | tee /tmp/balance-evaluation-summary.json
          test -s audit/balance/evaluation/BALANCE-EVALUATION.json
          test -s audit/balance/evaluation/SUMMARY.json
          test -s audit/balance/evaluation/BALANCE-EVALUATION.md

      - name: Validate evaluation coverage and policy
        run: |
          node - <<'JS'
          const fs=require('fs');
          const e=JSON.parse(fs.readFileSync('audit/balance/evaluation/BALANCE-EVALUATION.json','utf8'));
          const s=JSON.parse(fs.readFileSync('audit/balance/evaluation/SUMMARY.json','utf8'));
          if(e.length!==209) throw new Error(`expected 209 evaluated characters, got ${e.length}`);
          if(s.characters!==209) throw new Error(`summary characters=${s.characters}`);
          if(!Array.isArray(s.methodReferences)||s.methodReferences.length!==3) throw new Error('methodReferences must contain 3 applied repositories');
          for(const r of ['google-deepmind/open_spiel','sublee/trueskill','EbTech/Elo-MMR']){
            if(!s.methodReferences.some(x=>x.repository===r)) throw new Error('missing method reference '+r);
          }
          if(!e.every(x=>Number.isFinite(x.priorityScore)&&Array.isArray(x.flags))) throw new Error('invalid evaluation row');
          if(!e.some(x=>x.flags.includes('OVERPOWERED_HIGH_CONFIDENCE'))) throw new Error('no overpowered high-confidence case detected');
          if(!e.some(x=>x.flags.includes('UNDERPOWERED_HIGH_CONFIDENCE'))) throw new Error('no underpowered high-confidence case detected');
          if(!e.some(x=>x.flags.includes('EXPLOITABLE_MATCHUP'))) throw new Error('no exploitable matchup detected');
          console.log('BALANCE_EVALUATION_POLICY=PASS',s.counts);
          JS

      - uses: actions/upload-artifact@v4
        with:
          name: balance-evaluation-policy-${{ github.sha }}
          path: audit/balance/evaluation
          if-no-files-found: error
          retention-days: 30
