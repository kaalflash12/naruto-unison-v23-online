name: Balance Batch Audit

on:
  push:
    branches: [main]
    paths:
      - 'tools/extract-balance-batch.mjs'
      - 'audit/balance/current/META-BALANCE.json'
      - 'audit/balance/current/CHARACTER-SIMULATION.json'
      - '.github/workflows/balance-batch-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  batch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Extract first review batch
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/extract-balance-batch.mjs
          node tools/extract-balance-batch.mjs | tee /tmp/batch.json
          test -s audit/balance/current/BATCH-001-CANDIDATES.json
          test -s audit/balance/current/BATCH-001-CANDIDATES.md
          node - <<'JS'
          const fs=require('fs');const x=JSON.parse(fs.readFileSync('audit/balance/current/BATCH-001-CANDIDATES.json','utf8'));
          if(x.characters.length!==10)throw new Error(`batch=${x.characters.length}`);
          if(x.characters.filter(c=>c.action==='BUFF_CANDIDATE').length!==5)throw new Error('buff count');
          if(x.characters.filter(c=>c.action==='NERF_CANDIDATE').length!==5)throw new Error('nerf count');
          for(const c of x.characters)if(c.skills.length!==4)throw new Error(`${c.characterId}: skills=${c.skills.length}`);
          console.log('BATCH_001_INTEGRITY=PASS');
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: balance-batch-001-${{ github.sha }}
          path: |
            audit/balance/current/BATCH-001-CANDIDATES.json
            audit/balance/current/BATCH-001-CANDIDATES.md
          if-no-files-found: error
          retention-days: 30
      - name: Commit generated batch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit/balance/current/BATCH-001-CANDIDATES.json audit/balance/current/BATCH-001-CANDIDATES.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'audit(balance): add first intervention batch [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
