name: Recover Naruto API v84 source

on:
  push:
    branches:
      - recover-naruto-api-v84
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: cpdgkszviwrgrwsltbyk
    steps:
      - uses: actions/checkout@v4

      - name: Check Supabase CI credential
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo 'SUPABASE_ACCESS_TOKEN is not configured in this repository.' >> "$GITHUB_STEP_SUMMARY"
            exit 2
          fi
          echo 'Supabase CI credential is configured.' >> "$GITHUB_STEP_SUMMARY"

      - name: Download deployed naruto-api
        shell: bash
        run: |
          set -euo pipefail
          npx --yes supabase@latest functions download naruto-api --project-ref "$PROJECT_REF"
          test -f supabase/functions/naruto-api/index.ts
          echo "Downloaded files:" >> "$GITHUB_STEP_SUMMARY"
          find supabase/functions/naruto-api -maxdepth 2 -type f -printf '%P\n' | sort >> "$GITHUB_STEP_SUMMARY"
          sha256sum supabase/functions/naruto-api/index.ts > naruto-api-index.sha256

      - name: Sanity-check recovered legacy API
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'naruto_accounts' supabase/functions/naruto-api/index.ts
          grep -q 'session_token' supabase/functions/naruto-api/index.ts
          grep -q '/api/account/login' supabase/functions/naruto-api/index.ts
          echo 'Recovered source contains LEGACY account/login/session markers.' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload recovered source
        uses: actions/upload-artifact@v4
        with:
          name: naruto-api-v84-source
          path: |
            supabase/functions/naruto-api/**
            naruto-api-index.sha256
          if-no-files-found: error
          retention-days: 1
