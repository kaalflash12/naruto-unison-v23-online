name: Runtime Semantics Audit

on:
  push:
    branches: [main]
    paths:
      - 'roster.js'
      - 'jutsu-variants.js'
      - 'app-online.js'
      - 'tools/audit-runtime-semantics.mjs'
      - 'tools/classify-critical-runtime.mjs'
      - '.github/workflows/runtime-semantics-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate runtime-accurate audit
        run: |
          set -euo pipefail
          node --check tools/audit-runtime-semantics.mjs
          node --check tools/classify-critical-runtime.mjs
          node tools/audit-runtime-semantics.mjs | tee /tmp/runtime-summary.json
          node tools/classify-critical-runtime.mjs | tee /tmp/critical-summary.json
          for f in SUMMARY.json JUTSU-RUNTIME.json SEMANTIC-REVIEW.json CHARACTER-RUNTIME.json RUNTIME-REPORT.md CRITICAL-BACKLOG.json CRITICAL-SUMMARY.json CRITICAL-REPORT.md; do
            test -s "audit/balance/runtime/$f"
          done
      - name: Integrity
        run: |
          node - <<'JS'
          const fs=require('fs');
          const s=JSON.parse(fs.readFileSync('audit/balance/runtime/SUMMARY.json','utf8'));
          const c=JSON.parse(fs.readFileSync('audit/balance/runtime/CRITICAL-SUMMARY.json','utf8'));
          if(s.characters!==209) throw new Error('characters='+s.characters);
          if(s.jutsus!==836) throw new Error('jutsus='+s.jutsus);
          if(s.standardCharacters+s.eventCharacters+s.specialReviewCharacters!==s.characters) throw new Error('classificação incompleta');
          if(s.warnings.critical!==41) throw new Error('critical warnings='+s.warnings.critical);
          if(c.criticalJutsus<1||c.criticalJutsus>41) throw new Error('critical jutsus='+c.criticalJutsus);
          console.log('RUNTIME_SEMANTICS_AUDIT=PASS',s,c);
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-semantics-${{ github.sha }}
          path: audit/balance/runtime
          if-no-files-found: error
          retention-days: 30
      - name: Persist runtime audit on main
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit/balance/runtime
          if git diff --cached --quiet; then
            echo 'RUNTIME_AUDIT_ALREADY_CURRENT=PASS'
            exit 0
          fi
          git commit -m 'audit: refresh runtime semantic backlog [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
