name: Publish Naruto Unison R38.2 from staging static

on:
  push:
    branches: [staging]
    paths:
      - '.deploy-r382-staging'
      - '.github/workflows/deploy-r382-staging.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: r382-staging-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging static source
        uses: actions/checkout@v5
        with:
          ref: staging
          path: source
          fetch-depth: 1

      - name: Checkout validated R38.2 payload
        uses: actions/checkout@v5
        with:
          ref: r382-publish-trigger
          path: payload
          fetch-depth: 1

      - name: Checkout main publish target
        uses: actions/checkout@v5
        with:
          ref: main
          path: publish
          fetch-depth: 0
          persist-credentials: true

      - name: Reconstruct R38 runtime over intact staging static
        id: build
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/r382-site"
          BASE="$RUNNER_TEMP/r38-base.tar.xz"
          PATCH="$RUNNER_TEMP/r382-patch.tar.xz"
          rm -rf "$OUT"
          mkdir -p "$OUT"

          test -d source/static
          cp -a source/static "$OUT/static"

          cat \
            payload/.r38-delta/part-00 \
            payload/.r38-delta/part-01 \
            payload/.r38-delta/part-02 \
            payload/.r38-delta/part-03-05 \
            payload/.r38-delta/part-06-08 \
            | base64 -d > "$BASE"
          xz -t "$BASE"
          tar -xJf "$BASE" -C "$OUT"

          rm -rf "$OUT/static"
          cp -a source/static "$OUT/static"

          cp -a payload/.r38-patch/. "$OUT/"
          sed -i 's/V23.31-R38/V23.31-R38.1/g' "$OUT/index.html"
          sed -i 's/naruto-unison-v23-31-r38/naruto-unison-v23-31-r38-1/g' "$OUT/sw.js"
          sed -i 's/37.1.5/38.1.0/g' "$OUT/src/core/bootstrap.js"

          cat \
            payload/.r382-delta/part-00 \
            payload/.r382-delta/part-01 \
            payload/.r382-delta/part-02 \
            payload/.r382-delta/part-03 \
            payload/.r382-delta/part-04 \
            payload/.r382-delta/part-05 \
            payload/.r382-delta/part-06 \
            | base64 -d > "$PATCH"
          echo 'b8611810355ed83c077466498f7f8ce33936dd5ef41193103c09f5d9607b6da6  '"$PATCH" | sha256sum -c -
          xz -t "$PATCH"
          tar -xJf "$PATCH" -C "$OUT"

          printf 'V23.32-R38.2\n' > "$OUT/DEPLOYED-VERSION.txt"
          printf 'source=staging-static+r38-delta+r38.1-patch+r38.2-delta\nr382_sha256=b8611810355ed83c077466498f7f8ce33936dd5ef41193103c09f5d9607b6da6\n' > "$OUT/R382-BUILD-PROOF.txt"

          test -f "$OUT/index.html"
          test -f "$OUT/sw.js"
          test -f "$OUT/r38-config.json"
          test -f "$OUT/src/core/bootstrap.js"
          test -f "$OUT/src/domains/ranked/ranked-service.js"
          test -f "$OUT/src/domains/battle/balance-engine.js"
          test -f "$OUT/src/fx/combat-animation-director.js"
          test -f "$OUT/src/fx/item-fx-director.js"
          grep -q 'V23.32-R38.2' "$OUT/index.html"
          grep -q 'naruto-unison-v23-32-r38-2' "$OUT/sw.js"
          grep -q 'R38.2' "$OUT/src/core/bootstrap.js"
          grep -q 'submissionId' "$OUT/src/domains/ranked/ranked-service.js"
          grep -q 'sb_publishable_' "$OUT/r38-config.json"
          test "$(find "$OUT/assets/fx-r382" -type f -name '*.svg' | wc -l)" -eq 31
          test "$(find "$OUT/static" -type f | wc -l)" -ge 100
          node --check "$OUT/src/core/bootstrap.js"
          node --check "$OUT/src/fx/animation-profile-registry.js"
          node --check "$OUT/src/fx/combat-animation-director.js"
          node --check "$OUT/src/fx/item-fx-director.js"
          node --check "$OUT/src/domains/battle/mechanics-engine.js"

          FILES="$(find "$OUT" -type f | wc -l | tr -d ' ')"
          BYTES="$(du -sb "$OUT" | cut -f1)"
          echo "files=$FILES" >> "$GITHUB_OUTPUT"
          echo "bytes=$BYTES" >> "$GITHUB_OUTPUT"
          echo "Validated R38.2 site: $FILES files / $BYTES bytes"

      - name: Publish complete validated site to main
        shell: bash
        env:
          FILES: ${{ steps.build.outputs.files }}
          BYTES: ${{ steps.build.outputs.bytes }}
        run: |
          set -euo pipefail
          cd publish
          find . -mindepth 1 -maxdepth 1 \
            ! -name .git \
            ! -name .github \
            ! -name .r38-delta \
            ! -name .r38-patch \
            ! -name .r382-delta \
            ! -name .r38-repaired \
            -exec rm -rf {} +
          cp -a "$RUNNER_TEMP/r382-site"/. .
          printf 'V23.32-R38.2\nfiles=%s\nbytes=%s\nsource_branch=staging\nr382_sha256=b8611810355ed83c077466498f7f8ce33936dd5ef41193103c09f5d9607b6da6\n' "$FILES" "$BYTES" > R382-DEPLOY-VALIDATED.txt
          git config user.name 'Naruto Unison R38.2 Publisher'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git reset -- .r38-delta .r38-patch .r382-delta .r38-repaired 2>/dev/null || true
          if git diff --cached --quiet; then
            echo 'Main already contains the validated R38.2 site.'
          else
            git commit -m 'Naruto Unison V23.32 R38.2 validated site [skip ci]'
            git push origin HEAD:main
          fi
