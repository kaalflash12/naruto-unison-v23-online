name: Canonical Upstream V2 Classification

on:
  push:
    branches: [main]
    paths:
      - 'roster.js'
      - 'combat-content-adapter-v2.js'
      - 'combat-rules-v2.js'
      - 'tools/audit-published-techniques-v2.mjs'
      - 'tools/classify-canonical-upstream-v2.mjs'
      - '.github/workflows/canonical-upstream-v2-classification.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: canonical-upstream-v2-classification
  cancel-in-progress: true

jobs:
  classify-836:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout game
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Checkout pinned Naruto Unison upstream
        uses: actions/checkout@v4
        with:
          repository: naruto-unison/naruto-unison
          ref: 3f81bcd0de1795c17ce1f8e8d9f9fa51b38af0e1
          path: canonical-upstream

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Classifier syntax and deterministic self-test
        run: |
          set -euo pipefail
          node --check tools/classify-canonical-upstream-v2.mjs
          node tools/classify-canonical-upstream-v2.mjs --self-test

      - name: Re-prove published V2 209x4 source
        run: |
          set -euo pipefail
          node tools/audit-published-techniques-v2.mjs | tee /tmp/published-v2-summary.json
          node - <<'JS'
          const fs=require('fs');
          const s=JSON.parse(fs.readFileSync('audit/balance/published-v2/SUMMARY.json','utf8'));
          if(s.gate!=='PASS') throw new Error(`published-v2 gate=${s.gate}`);
          if(s.canonicalPlayableCharacters!==209) throw new Error(`characters=${s.canonicalPlayableCharacters}`);
          if(s.canonicalLinks!==836) throw new Error(`links=${s.canonicalLinks}`);
          if(s.unsupported!==0||s.runtimeFailures!==0||s.unknownCosts!==0||s.noops!==0) throw new Error('published V2 source not clean');
          console.log('PUBLISHED_V2_SOURCE=PASS');
          JS

      - name: Build raw 836-technique upstream classification
        env:
          UPSTREAM_DIR: canonical-upstream
          UPSTREAM_COMMIT: 3f81bcd0de1795c17ce1f8e8d9f9fa51b38af0e1
        run: |
          set +e
          node tools/classify-canonical-upstream-v2.mjs \
            --root . \
            --upstream canonical-upstream \
            --upstream-commit 3f81bcd0de1795c17ce1f8e8d9f9fa51b38af0e1 \
            | tee /tmp/canonical-v2-summary.json
          code=${PIPESTATUS[0]}
          echo "$code" > /tmp/canonical-v2-exit-code
          exit 0

      - name: Upload raw classification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canonical-upstream-v2-raw-${{ github.sha }}
          path: audit/balance/canonical-v2
          if-no-files-found: error
          retention-days: 30

      - name: Enforce raw 836 classification integrity
        run: |
          set -euo pipefail
          node - <<'JS'
          const fs=require('fs');
          const required=['CORRETA','DESCRIÇÃO_ERRADA','DANO_ERRADO','EFEITO_ERRADO','ALVO_ERRADO','CUSTO_ERRADO','COOLDOWN_ERRADO','DURAÇÃO_ERRADA','MOTOR_INSUFICIENTE'];
          const allowed=new Set(required);
          const s=JSON.parse(fs.readFileSync('audit/balance/canonical-v2/SUMMARY.json','utf8'));
          const rows=JSON.parse(fs.readFileSync('audit/balance/canonical-v2/CLASSIFICATION-836.json','utf8'));
          if(s.upstreamCommit!=='3f81bcd0de1795c17ce1f8e8d9f9fa51b38af0e1') throw new Error(`upstream=${s.upstreamCommit}`);
          if(s.playableCharacters!==209) throw new Error(`characters=${s.playableCharacters}`);
          if(s.classifiedTechniques!==836||rows.length!==836) throw new Error(`coverage=${s.classifiedTechniques}/${rows.length}`);
          if((s.resolved||0)+(s.unresolved||0)!==836) throw new Error(`raw accounting=${s.resolved}+${s.unresolved}`);
          if(s.invalidRows!==0) throw new Error(`invalidRows=${s.invalidRows}`);
          for(const r of rows){
            if(!Array.isArray(r.classifications)) throw new Error(`invalid classifications ${r.characterId}/${r.slot}`);
            if(r.classifications.some(x=>!allowed.has(x))) throw new Error(`unknown classification ${r.characterId}/${r.slot}`);
            if(r.classifications.includes('CORRETA')&&r.classifications.length!==1) throw new Error(`CORRETA mixed ${r.characterId}/${r.slot}`);
            if(r.resolution==='RESOLVIDO'&&r.classifications.length===0) throw new Error(`empty resolved classification ${r.characterId}/${r.slot}`);
          }
          console.log('CANONICAL_UPSTREAM_V2_RAW_836=PASS',{resolved:s.resolved,unresolved:s.unresolved,classificationCounts:s.classificationCounts});
          JS

      - name: Commit generated raw canonical V2 audit
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit/balance/canonical-v2
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'audit(balance): refresh raw canonical V2 classification [skip ci]'
          git restore audit/balance/published-v2 || true
          git pull --rebase origin main
          git push origin HEAD:main
