name: Canonical Upstream V2 Final Accounting

on:
  push:
    branches: [main]
    paths:
      - 'tools/classify-canonical-upstream-v2.mjs'
      - 'tools/finalize-canonical-upstream-v2.mjs'
      - 'tools/build-canonical-v2-correction-queue.mjs'
      - 'balance/canonical-upstream-v2-justifications.json'
      - 'balance/canonical-upstream-v2-ambiguities.json'
      - '.canonical-upstream-v2-run-trigger'
      - '.github/workflows/canonical-upstream-v2-final.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: canonical-upstream-v2-final-accounting
  cancel-in-progress: true

jobs:
  final-836:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: naruto-unison/naruto-unison
          ref: 3f81bcd0de1795c17ce1f8e8d9f9fa51b38af0e1
          path: canonical-upstream
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and classifier self-test
        run: |
          set -euo pipefail
          node --check tools/classify-canonical-upstream-v2.mjs
          node --check tools/finalize-canonical-upstream-v2.mjs
          node --check tools/build-canonical-v2-correction-queue.mjs
          node tools/classify-canonical-upstream-v2.mjs --self-test
          node tools/build-canonical-v2-correction-queue.mjs --self-test
      - name: Re-prove published V2 source
        run: |
          set -euo pipefail
          node tools/audit-published-techniques-v2.mjs >/tmp/published-v2.json
          node - <<'JS'
          const fs=require('fs');const s=JSON.parse(fs.readFileSync('audit/balance/published-v2/SUMMARY.json','utf8'));
          if(s.gate!=='PASS'||s.canonicalPlayableCharacters!==209||s.canonicalLinks!==836)throw new Error(JSON.stringify(s));
          console.log('PUBLISHED_V2_209X4=PASS', {contentRevision:s.contentRevision, characters:s.canonicalPlayableCharacters, links:s.canonicalLinks});
          JS
      - name: Generate raw comparison evidence
        env:
          UPSTREAM_DIR: canonical-upstream
          UPSTREAM_COMMIT: 3f81bcd0de1795c17ce1f8e8d9f9fa51b38af0e1
        run: |
          set +e
          node tools/classify-canonical-upstream-v2.mjs --root . --upstream canonical-upstream --upstream-commit 3f81bcd0de1795c17ce1f8e8d9f9fa51b38af0e1 | tee /tmp/raw-canonical-v2.json
          echo ${PIPESTATUS[0]} >/tmp/raw-exit
          exit 0
      - name: Finalize resolved and explicitly justified coverage
        run: |
          set -euo pipefail
          node tools/finalize-canonical-upstream-v2.mjs --root . --upstream canonical-upstream | tee /tmp/final-canonical-v2.json
      - name: Enforce final 836 accounting
        run: |
          set -euo pipefail
          node - <<'JS'
          const fs=require('fs');
          const s=JSON.parse(fs.readFileSync('audit/balance/canonical-v2/FINAL-SUMMARY.json','utf8'));
          const rows=JSON.parse(fs.readFileSync('audit/balance/canonical-v2/FINAL-CLASSIFICATION-836.json','utf8'));
          if(s.upstreamCommit!=='3f81bcd0de1795c17ce1f8e8d9f9fa51b38af0e1')throw new Error('upstream not pinned');
          if(rows.length!==836||s.totalTechniques!==836)throw new Error(`coverage=${rows.length}/${s.totalTechniques}`);
          if(s.accounted!==836||s.unaccounted!==0)throw new Error(`accounted=${s.accounted}, unaccounted=${s.unaccounted}`);
          if(s.invalidComparable!==0||s.invalidJustified!==0)throw new Error('invalid final rows');
          if((s.classificationCounts?.MOTOR_INSUFICIENTE||0)!==0)throw new Error(`motor=${s.classificationCounts?.MOTOR_INSUFICIENTE}`);
          if(s.gate!=='PASS')throw new Error(`gate=${s.gate}`);
          console.log('CANONICAL_UPSTREAM_V2_FINAL_836=PASS',s);
          JS
      - name: Rebuild canonical correction queue
        run: |
          set -euo pipefail
          node tools/build-canonical-v2-correction-queue.mjs --root . | tee /tmp/canonical-v2-correction-queue.json
          node - <<'JS'
          const fs=require('fs');
          const q=JSON.parse(fs.readFileSync('audit/balance/canonical-v2-corrections/SUMMARY.json','utf8'));
          if(q.totalTechniques!==836||q.comparable!==719||q.justifiedExcluded!==117)throw new Error(`queue coverage=${JSON.stringify(q)}`);
          if((q.classificationCounts?.MOTOR_INSUFICIENTE||0)!==0)throw new Error(`queue motor=${q.classificationCounts?.MOTOR_INSUFICIENTE}`);
          if(q.gate!=='PASS')throw new Error(`queue gate=${q.gate}`);
          console.log('CANONICAL_V2_CORRECTION_QUEUE=PASS',q);
          JS
      - name: Upload final evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canonical-upstream-v2-final-${{ github.sha }}
          path: |
            audit/balance/canonical-v2
            audit/balance/canonical-v2-corrections
          if-no-files-found: error
          retention-days: 30
      - name: Commit final audit and correction queue
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit/balance/canonical-v2 audit/balance/canonical-v2-corrections
          if git diff --cached --quiet; then
            echo 'CANONICAL_EVIDENCE_ALREADY_CURRENT=PASS'
            exit 0
          fi
          git commit -m 'audit(balance): refresh canonical V2 accounting and correction queue [skip ci]'
          if git push origin HEAD:main; then
            echo 'CANONICAL_EVIDENCE_PUSH=PASS'
            exit 0
          fi
          echo 'CONCURRENT_EVIDENCE_PUSH=DETECTED'
          git fetch origin main
          git show origin/main:audit/balance/canonical-v2/FINAL-SUMMARY.json >/tmp/remote-final-summary.json
          git show origin/main:audit/balance/canonical-v2-corrections/SUMMARY.json >/tmp/remote-queue-summary.json
          node - <<'JS'
          const fs=require('fs');
          const f=JSON.parse(fs.readFileSync('/tmp/remote-final-summary.json','utf8'));
          const q=JSON.parse(fs.readFileSync('/tmp/remote-queue-summary.json','utf8'));
          if(f.gate!=='PASS'||f.totalTechniques!==836||f.accounted!==836||f.unaccounted!==0)throw new Error(`remote final evidence stale: ${JSON.stringify(f)}`);
          if((f.classificationCounts?.MOTOR_INSUFICIENTE||0)!==0)throw new Error(`remote motor=${f.classificationCounts?.MOTOR_INSUFICIENTE}`);
          if(q.gate!=='PASS'||q.totalTechniques!==836||q.comparable!==719||q.justifiedExcluded!==117)throw new Error(`remote queue evidence stale: ${JSON.stringify(q)}`);
          if(q.safeStructural!==0)throw new Error(`remote safeStructural=${q.safeStructural}`);
          console.log('REMOTE_CANONICAL_EVIDENCE=PASS',{accounted:f.accounted,safeStructural:q.safeStructural,complexEffect:q.complexEffect});
          JS
