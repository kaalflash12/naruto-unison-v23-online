name: Apply Percent Strengthen and Enrage Semantics V2

on:
  push:
    branches: [main]
    paths:
      - 'tools/patch-percent-enrage-semantics-v2.mjs'
      - 'tools/test-percent-enrage-semantics-v2.cjs'
      - '.github/workflows/apply-percent-enrage-semantics-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-percent-enrage-semantics-v2
  cancel-in-progress: true

jobs:
  patch-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply deterministic patch
        run: |
          set -euo pipefail
          node tools/patch-percent-enrage-semantics-v2.mjs
      - name: Syntax and regression contracts
        run: |
          set -euo pipefail
          node --check combat-rules-v2.js
          node --check combat-content-adapter-v2.js
          node --check tools/test-percent-enrage-semantics-v2.cjs
          node tools/test-content-mechanics-v2.cjs
          node tools/test-content-engine-extensions-v2.cjs
          node tools/test-curse-mark-canonical-v2.cjs
          node tools/test-percent-enrage-semantics-v2.cjs
      - name: Guard exact semantics
        run: |
          set -euo pipefail
          grep -Fq "function attackMultiplier" combat-rules-v2.js
          grep -Fq "amountMode" combat-rules-v2.js
          grep -Fq "blocked:'enrage'" combat-rules-v2.js
          echo 'PERCENT_ENRAGE_SEMANTICS_V2=PASS'
      - name: Commit engine patch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add combat-rules-v2.js
          if git diff --cached --quiet; then
            echo 'No engine change required'
            exit 0
          fi
          git commit -m 'fix(combat): support percent strengthen and enrage semantics'
          git pull --rebase origin main
          git push origin HEAD:main
