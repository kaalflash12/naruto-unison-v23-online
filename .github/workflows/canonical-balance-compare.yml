name: Canonical Balance Comparison

on:
  push:
    branches: [main]
    paths:
      - 'roster.js'
      - 'jutsu-variants.js'
      - 'tools/build-canonical-upstream-index.mjs'
      - '.github/workflows/canonical-balance-compare.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: canonical-balance-compare
  cancel-in-progress: true

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch canonical Naruto Unison upstream
        run: |
          set -euo pipefail
          git clone --depth=1 https://github.com/naruto-unison/naruto-unison.git /tmp/naruto-unison-upstream
          git -C /tmp/naruto-unison-upstream rev-parse HEAD > /tmp/upstream-sha
      - name: Build canonical comparison
        env:
          UPSTREAM_DIR: /tmp/naruto-unison-upstream
        run: |
          set -euo pipefail
          node --check tools/build-canonical-upstream-index.mjs
          export UPSTREAM_COMMIT="$(cat /tmp/upstream-sha)"
          node tools/build-canonical-upstream-index.mjs | tee /tmp/canonical-summary.json
          node - <<'JS'
          const fs=require('fs');
          const s=JSON.parse(fs.readFileSync('audit/balance/canonical/SUMMARY.json','utf8'));
          if(s.localJutsu!==836) throw new Error(`localJutsu=${s.localJutsu}, esperado=836`);
          if(s.characters!==209) throw new Error(`characters=${s.characters}, esperado=209`);
          if(s.upstreamSkills<100) throw new Error('extração upstream insuficiente');
          if(s.matched<100) throw new Error('cobertura canônica insuficiente');
          console.log('CANONICAL_COMPARE=PASS',s);
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: canonical-balance-${{ github.sha }}
          path: audit/balance/canonical
          if-no-files-found: error
          retention-days: 30
      - name: Commit generated canonical audit
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit/balance/canonical
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'audit(balance): refresh canonical jutsu comparison [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
