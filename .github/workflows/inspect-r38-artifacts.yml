name: Inspect R38 workflow artifacts

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  inspect:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[INSPECT-R38-ARTIFACTS]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Inspect repository artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'R38 WORKFLOW ARTIFACT INVENTORY'
            echo "generated_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" --jq '.artifacts[] | [.id,.name,.size_in_bytes,.expired,.workflow_run.id,.workflow_run.head_sha] | @tsv' || true
          } > R38-ARTIFACTS.txt
          git config user.name 'Naruto Unison Artifact Inspector'
          git config user.email 'actions@users.noreply.github.com'
          git add R38-ARTIFACTS.txt
          git commit -m 'ci: record R38 artifact inventory [skip ci]' || true
          git push origin HEAD:main || true
