name: Validate Admin Studio

on:
  push:
    branches: [main]
    paths:
      - 'admin-studio.html'
      - 'admin-studio.css'
      - 'admin-studio.js'
      - 'admin-studio-admin.css'
      - 'admin-studio-admin.js'
      - 'r43-admin-entry.js'
      - 'supabase/functions/admin-studio-api/**'
      - '.github/workflows/validate-admin-studio.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: |
          node --check admin-studio.js
          node --check admin-studio-admin.js
          node --check r43-admin-entry.js
      - name: Studio contract
        run: |
          set -euo pipefail
          for f in admin-studio.html admin-studio.css admin-studio.js admin-studio-admin.css admin-studio-admin.js supabase/functions/admin-studio-api/index.ts; do test -s "$f"; done
          grep -Fq 'admin-studio.js' admin-studio.html
          grep -Fq 'admin-studio-admin.js' admin-studio.html
          grep -Fq 'admin-studio-admin.css' admin-studio.html
          grep -Fq 'data-tab="roles"' admin-studio.html
          grep -Fq 'id="versionHistory"' admin-studio.html
          grep -Fq 'location.assign('\''./admin-studio.html'\'')' r43-admin-entry.js
          grep -Fq '/content/validate' admin-studio.js
          grep -Fq '/content/publish' admin-studio.js
          grep -Fq '/content/rollback' admin-studio.js
          grep -Fq '/functions/v1/ai-event-director' admin-studio.js
          grep -Fq '/functions/v1/admin-studio-api' admin-studio-admin.js
          grep -Fq 'LAST_OWNER' supabase/functions/admin-studio-api/index.ts
          grep -Fq 'SELF_OWNER' supabase/functions/admin-studio-api/index.ts
          grep -Fq 'admin.principal.update' supabase/functions/admin-studio-api/index.ts
          for token in character technique mission story_chapter equipment boss event location scene ai_profile animation_profile; do grep -Fq "$token" admin-studio.js; done
      - name: Production backend smoke
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS 'https://cpdgkszviwrgrwsltbyk.supabase.co/functions/v1/content/manifest' > manifest.json
          grep -Fq '"ok":true' manifest.json
          admin_code=$(curl -sS -o admin-anon.json -w '%{http_code}' 'https://cpdgkszviwrgrwsltbyk.supabase.co/functions/v1/admin/status' || true)
          studio_code=$(curl -sS -o studio-anon.json -w '%{http_code}' 'https://cpdgkszviwrgrwsltbyk.supabase.co/functions/v1/admin-studio-api/principals' || true)
          test "$admin_code" = '401' -o "$admin_code" = '403'
          test "$studio_code" = '401' -o "$studio_code" = '403'
          echo "ADMIN_STUDIO_BACKEND=PASS"
      - name: Public page source smoke
        shell: bash
        run: |
          set -euo pipefail
          url='https://kaalflash12.github.io/naruto-unison-v23-online/admin-studio.html'
          ok=0
          for i in $(seq 1 18); do
            if curl -fsS "$url" -o page.html && grep -Fq 'NARUTO UNISON — ADMIN STUDIO' page.html; then ok=1; break; fi
            sleep 5
          done
          test "$ok" = '1'
          grep -Fq 'data-tab="roles"' page.html
          grep -Fq 'admin-studio-admin.js' page.html
          echo "ADMIN_STUDIO_PUBLIC=PASS"
