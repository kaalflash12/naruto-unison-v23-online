name: BAN Runtime Live Proof

# live-proof-trigger: 2026-08-26-ban-session-gate
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ban-runtime-live-proof.yml'

permissions:
  contents: read

jobs:
  live-ban-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Register isolated legacy test account
        shell: bash
        env:
          BASE: https://cpdgkszviwrgrwsltbyk.supabase.co/functions/v1/naruto-api
        run: |
          set -euo pipefail
          USERNAME="banprobe${GITHUB_RUN_ID}a${GITHUB_RUN_ATTEMPT}"
          PASSWORD="$(openssl rand -hex 24)"
          printf '%s' "$USERNAME" > /tmp/banprobe-user
          printf '%s' "$PASSWORD" > /tmp/banprobe-pass

          code=$(curl --max-time 25 -sS -o /tmp/register.json -w '%{http_code}' \
            -X POST "$BASE/api/account/register" \
            -H 'content-type: application/json' \
            --data "$(jq -nc --arg user "$USERNAME" --arg pass "$PASSWORD" '{user:$user,pass:$pass}')")
          test "$code" = 201
          jq -e '.ok == true and (.token|type=="string") and (.token|length>10) and (.profile|type=="object")' /tmp/register.json >/dev/null
          jq -r '.token' /tmp/register.json > /tmp/banprobe-token
          echo "BAN_PROBE_USERNAME=$USERNAME"
          echo 'REGISTER_BEFORE_BAN=PASS HTTP=201'

      - name: Prove session and save work before ban
        shell: bash
        env:
          BASE: https://cpdgkszviwrgrwsltbyk.supabase.co/functions/v1/naruto-api
        run: |
          set -euo pipefail
          TOKEN=$(cat /tmp/banprobe-token)
          code=$(curl --max-time 25 -sS -o /tmp/session-before.json -w '%{http_code}' \
            "$BASE/api/account/session?token=$TOKEN")
          test "$code" = 200
          jq -e '.ok == true' /tmp/session-before.json >/dev/null

          jq --arg token "$TOKEN" '{token:$token,profile:.profile,revision:(.revision // 0)}' /tmp/register.json > /tmp/save-before-body.json
          code=$(curl --max-time 25 -sS -o /tmp/save-before.json -w '%{http_code}' \
            -X POST "$BASE/api/account/save" \
            -H 'content-type: application/json' \
            --data @/tmp/save-before-body.json)
          test "$code" = 200
          jq -e '.ok == true' /tmp/save-before.json >/dev/null
          REV=$(jq -r '.revision // empty' /tmp/save-before.json)
          if [ -n "$REV" ]; then
            jq --argjson revision "$REV" '.revision=$revision' /tmp/save-before-body.json > /tmp/save-after-body.json
          else
            cp /tmp/save-before-body.json /tmp/save-after-body.json
          fi
          echo 'SESSION_BEFORE_BAN=PASS HTTP=200'
          echo 'SAVE_BEFORE_BAN=PASS HTTP=200'

      - name: Wait for external banned=true toggle and require token revocation
        shell: bash
        env:
          BASE: https://cpdgkszviwrgrwsltbyk.supabase.co/functions/v1/naruto-api
        run: |
          set -euo pipefail
          TOKEN=$(cat /tmp/banprobe-token)
          blocked=0
          for i in $(seq 1 90); do
            code=$(curl --max-time 20 -sS -o /tmp/session-after.json -w '%{http_code}' \
              "$BASE/api/account/session?token=$TOKEN" || true)
            if [ "$code" = 401 ] || [ "$code" = 403 ]; then
              blocked=1
              break
            fi
            sleep 2
          done
          if [ "$blocked" != 1 ]; then
            echo 'BAN_TOKEN_REVOCATION=FAIL'
            exit 1
          fi
          echo "SESSION_AFTER_BAN=PASS HTTP=$code"

      - name: Require gameplay persistence action blocked after ban
        shell: bash
        env:
          BASE: https://cpdgkszviwrgrwsltbyk.supabase.co/functions/v1/naruto-api
        run: |
          set -euo pipefail
          code=$(curl --max-time 25 -sS -o /tmp/save-after.json -w '%{http_code}' \
            -X POST "$BASE/api/account/save" \
            -H 'content-type: application/json' \
            --data @/tmp/save-after-body.json || true)
          case "$code" in 401|403) ;; *) echo "SAVE_AFTER_BAN=FAIL HTTP=$code"; cat /tmp/save-after.json; exit 1;; esac
          echo "SAVE_AFTER_BAN=PASS HTTP=$code"

      - name: Require fresh login blocked after ban
        shell: bash
        env:
          BASE: https://cpdgkszviwrgrwsltbyk.supabase.co/functions/v1/naruto-api
        run: |
          set -euo pipefail
          USERNAME=$(cat /tmp/banprobe-user)
          PASSWORD=$(cat /tmp/banprobe-pass)
          code=$(curl --max-time 25 -sS -o /tmp/login-after.json -w '%{http_code}' \
            -X POST "$BASE/api/account/login" \
            -H 'content-type: application/json' \
            --data "$(jq -nc --arg user "$USERNAME" --arg pass "$PASSWORD" '{user:$user,pass:$pass}')" || true)
          case "$code" in 401|403) ;; *) echo "LOGIN_AFTER_BAN=FAIL HTTP=$code"; cat /tmp/login-after.json; exit 1;; esac
          echo "LOGIN_AFTER_BAN=PASS HTTP=$code"
          echo 'BAN_RUNTIME_CONTRACT=PASS'
