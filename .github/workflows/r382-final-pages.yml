name: Naruto Unison R38.2 final gate and publish

on:
  pull_request:
    branches: [staging, main]
    types: [opened, synchronize, reopened]
  push:
    branches: [staging, main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: naruto-unison-r382-final
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      site_sha: ${{ steps.sitehash.outputs.sha }}
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Fetch immutable staging static and locked R38.2 patch
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            r38-stage-final:refs/remotes/origin/r38-stage-final \
            r382-publish-trigger:refs/remotes/origin/r382-publish-trigger

      - name: Assemble R38 base from intact staging static plus validated runtime
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/r382-site"
          SRC="$RUNNER_TEMP/r382-source"
          rm -rf "$OUT" "$SRC"
          mkdir -p "$OUT" "$SRC"

          git archive --format=tar origin/r38-stage-final static assets .nojekyll | tar -xf - -C "$OUT"

          cat .r38-runtime/part-* | tr -d '\r\n\t ' | base64 -d > "$RUNNER_TEMP/r38-runtime-base.tar.xz"
          echo '739cb40b32f6285881fa5cd0c58622bdb10bf7bed0ec18ad66e4328bccf751f4  '"$RUNNER_TEMP/r38-runtime-base.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/r38-runtime-base.tar.xz" -C "$OUT"

          git archive --format=tar origin/r382-publish-trigger .r38-patch | tar -xf - -C "$SRC"
          cp -a "$SRC/.r38-patch"/. "$OUT/"
          sed -i 's/V23.31-R38/V23.31-R38.1/g' "$OUT/index.html"
          sed -i 's/naruto-unison-v23-31-r38/naruto-unison-v23-31-r38-1/g' "$OUT/sw.js"
          sed -i 's/37.1.5/38.1.0/g' "$OUT/src/core/bootstrap.js"

          : > "$RUNNER_TEMP/r382.b64"
          for i in 00 01 02 03 04 05 06; do
            git show "origin/r382-publish-trigger:.r382-delta/part-$i" | tr -d '\r\n\t ' >> "$RUNNER_TEMP/r382.b64"
          done
          base64 -d "$RUNNER_TEMP/r382.b64" > "$RUNNER_TEMP/r382.tar.xz"
          echo 'b8611810355ed83c077466498f7f8ce33936dd5ef41193103c09f5d9607b6da6  '"$RUNNER_TEMP/r382.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/r382.tar.xz" -C "$OUT"

          python - "$OUT" <<'PY'
          import json, os, sys
          root=sys.argv[1]
          def load(name):
              p=os.path.join(root,'src','data','fallback',name+'.json')
              with open(p,encoding='utf-8') as f: return p,json.load(f)
          for name,folder in [('equipment','equipment-r36'),('item','items-r36')]:
              p,d=load(name)
              arr=d.get('items',[]) if isinstance(d,dict) else d
              for x in arr:
                  img=x.get('image')
                  if not isinstance(img,str): continue
                  stem=os.path.splitext(os.path.basename(img))[0]
                  x['image']=f'static/img/{folder}/{stem}.svg'
                  target=os.path.join(root,x['image'])
                  if not os.path.isfile(target): raise SystemExit(f'missing staging asset: {x["image"]}')
              with open(p,'w',encoding='utf-8') as f: json.dump(d,f,ensure_ascii=False,separators=(',',':'))
          p,d=load('scene')
          arr=d.get('items',[]) if isinstance(d,dict) else d
          for x in arr:
              if x.get('background')=='assets/scenes/story-forest.webp': x['background']='static/img/bg/valley.png'
          with open(p,'w',encoding='utf-8') as f: json.dump(d,f,ensure_ascii=False,separators=(',',':'))
          PY

          echo "$OUT" > "$RUNNER_TEMP/r382-site-path"

      - name: Final R38.2 gates
        shell: bash
        run: |
          set -euo pipefail
          OUT="$(cat "$RUNNER_TEMP/r382-site-path")"
          grep -q 'V23.32-R38.2' "$OUT/index.html"
          grep -q 'naruto-unison-v23-32-r38-2' "$OUT/sw.js"
          grep -q '38.2.0' "$OUT/src/core/bootstrap.js"
          grep -q 'sb_publishable_4SW2yJ1u14hwcwg_L2Tbrg_D1brVLPA' "$OUT/r38-config.json"
          grep -q "'/ranked/turn'" "$OUT/src/domains/ranked/ranked-service.js"
          grep -q 'submissionId' "$OUT/src/domains/ranked/ranked-service.js"
          test -f "$OUT/src/domains/battle/balance-engine.js"
          test -f "$OUT/src/fx/combat-animation-director.js"
          test -f "$OUT/src/fx/item-fx-director.js"
          test -f "$OUT/assets/fx-r382/spiral.svg"
          test -f "$OUT/assets/fx-r382/impact.svg"
          test "$(find "$OUT/assets/fx-r382" -type f -name '*.svg' | wc -l)" -eq 31
          test "$(find "$OUT/static" -type f | wc -l)" -ge 2000
          test "$(find "$OUT" -type f | wc -l)" -ge 2200
          node --check "$OUT/src/core/bootstrap.js"
          node --check "$OUT/src/domains/battle/mechanics-engine.js"
          node --check "$OUT/src/fx/animation-profile-registry.js"
          node --check "$OUT/src/fx/combat-animation-director.js"
          node --check "$OUT/src/fx/item-fx-director.js"
          node --check "$OUT/src/fx/audio-director.js"

          python - "$OUT" <<'PY'
          import json, os, sys
          root=sys.argv[1]
          missing=[]; refs=0
          for name in ['character','technique','equipment','item','scene']:
              p=os.path.join(root,'src','data','fallback',name+'.json')
              d=json.load(open(p,encoding='utf-8'))
              arr=d.get('items',[]) if isinstance(d,dict) else d
              for x in arr:
                  for key in ('image','background'):
                      v=x.get(key)
                      if not isinstance(v,str) or v.startswith(('http://','https://')): continue
                      refs+=1
                      if not os.path.isfile(os.path.join(root,v)): missing.append((name,x.get('id'),v))
          if missing:
              print('Missing asset refs:',missing[:30])
              raise SystemExit(2)
          print('R38.2 FINAL VALIDATION PASS; local asset refs',refs)
          PY

      - name: Site content hash
        id: sitehash
        shell: bash
        run: |
          set -euo pipefail
          OUT="$(cat "$RUNNER_TEMP/r382-site-path")"
          find "$OUT" -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | awk '{print "sha="$1}' >> "$GITHUB_OUTPUT"

      - name: Preserve assembled candidate for publish job
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: naruto-unison-r382-site
          path: ${{ runner.temp }}/r382-site
          if-no-files-found: error
          retention-days: 1

  publish-main:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[R382-SITE-PUBLISHED]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Download validated site
        uses: actions/download-artifact@v4
        with:
          name: naruto-unison-r382-site
          path: ${{ runner.temp }}/r382-site
      - name: Commit complete validated site to main
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/r382-site"
          find . -mindepth 1 -maxdepth 1 \
            ! -name .git ! -name .github ! -name .r38-runtime \
            -exec rm -rf {} +
          cp -a "$OUT"/. .
          git config user.name 'Naruto Unison R38.2 Publisher'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git reset -- .r38-runtime 2>/dev/null || true
          if git diff --cached --quiet; then
            echo 'Validated site is already the main tree.'
          else
            git commit -m '[R382-SITE-PUBLISHED] Naruto Unison V23.32 R38.2'
            git push origin HEAD:main
          fi
