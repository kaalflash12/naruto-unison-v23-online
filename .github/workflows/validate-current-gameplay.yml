name: Validate Current Gameplay Readiness

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'app-online.js'
      - 'battle-fx.js'
      - 'battle-mobile-guard.js'
      - 'character-unlocks.js'
      - 'desktop-overhaul.js'
      - 'jutsu-variants.js'
      - 'online-config.js'
      - 'r40-battle-guard.js'
      - 'roster.js'
      - 'story-data.js'
      - 'v23-data.js'
      - 'admin.html'
      - 'admin-combat-reset.html'
      - 'supabase/functions/**'
      - 'supabase/migrations/**'
      - '.github/workflows/validate-current-gameplay.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax gate for current runtime
        shell: bash
        run: |
          set -euo pipefail
          for f in \
            app-online.js battle-fx.js battle-mobile-guard.js character-unlocks.js \
            desktop-overhaul.js jutsu-variants.js online-config.js r40-battle-guard.js \
            roster.js story-data.js v23-data.js; do
            test -s "$f"
            node --check "$f"
          done
          test -s index.html
          test -s admin.html
          test -s admin-combat-reset.html
          grep -Fq '"skills"' roster.js
          grep -Fq 'admin_reset_combat_history' admin-combat-reset.html
          grep -Fq 'RESETAR HISTÓRICO DE TODAS AS CONTAS' admin-combat-reset.html
          echo 'CURRENT_RUNTIME_SYNTAX=PASS'

      - name: Resolve runner Chrome
        shell: bash
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          mkdir -p /tmp/current-playwright
          cd /tmp/current-playwright
          npm init -y >/dev/null 2>&1
          npm install --silent playwright-core@1.55.0
          "$CHROME_BIN" --version

      - name: Validate current public build
        shell: bash
        env:
          BASE: https://kaalflash12.github.io/naruto-unison-v23-online
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 24); do
            game=$(curl -L --max-time 20 -sS -o /tmp/game.html -w '%{http_code}' "$BASE/?sha=${GITHUB_SHA}" || true)
            admin=$(curl -L --max-time 20 -sS -o /tmp/admin.html -w '%{http_code}' "$BASE/admin.html?sha=${GITHUB_SHA}" || true)
            reset=$(curl -L --max-time 20 -sS -o /tmp/reset.html -w '%{http_code}' "$BASE/admin-combat-reset.html?sha=${GITHUB_SHA}" || true)
            if [ "$game" = 200 ] && [ "$admin" = 200 ] && [ "$reset" = 200 ] && grep -Fq 'Reset seguro de histórico de lutas' /tmp/reset.html; then
              ok=1; break
            fi
            sleep 5
          done
          test "$ok" = 1
          grep -Fq 'admin_reset_combat_history' /tmp/reset.html
          echo 'CURRENT_PUBLIC_BUILD=PASS'

      - name: Browser smoke desktop and mobile
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/current-playwright/test.mjs <<'JS'
          import { chromium } from 'playwright-core';
          const base='https://kaalflash12.github.io/naruto-unison-v23-online/';
          const browser=await chromium.launch({headless:true,executablePath:process.env.CHROME_BIN,args:['--no-sandbox','--disable-dev-shm-usage']});
          const proof=[];
          for (const [label,width,height] of [['desktop',1366,768],['mobile',390,844]]) {
            const ctx=await browser.newContext({viewport:{width,height}});
            const page=await ctx.newPage();
            const errors=[];
            page.on('pageerror',e=>errors.push(String(e)));
            const res=await page.goto(base+'?current='+Date.now(),{waitUntil:'domcontentloaded',timeout:60000});
            if (!res || res.status()!==200) throw new Error(label+': game HTTP '+(res?.status()??'none'));
            await page.waitForTimeout(2500);
            const state=await page.evaluate(()=>({
              title:document.title,
              body:(document.body?.innerText||'').trim(),
              roster:Array.isArray(window.NARUTO_ROSTER)?window.NARUTO_ROSTER.length:0,
              rosterKeys:Array.isArray(window.NARUTO_ROSTER)&&window.NARUTO_ROSTER[0]?Object.keys(window.NARUTO_ROSTER[0]).sort():[],
              firstCharacterSkills:Array.isArray(window.NARUTO_ROSTER)&&window.NARUTO_ROSTER[0]&&Array.isArray(window.NARUTO_ROSTER[0].skills)?window.NARUTO_ROSTER[0].skills.length:0,
              dataGlobals:Object.keys(window).filter(k=>/jutsu|skill|roster/i.test(k)).sort().slice(0,40),
              overflow:Math.max(document.documentElement.scrollWidth,document.body.scrollWidth)-window.innerWidth
            }));
            if (state.body.length<40) throw new Error(label+': game body empty');
            if (state.roster<1 || state.firstCharacterSkills<1) throw new Error(label+': roster/skills not loaded '+JSON.stringify(state));
            if (errors.length) throw new Error(label+': page errors '+errors.join(' | '));
            proof.push({label,...state,body:state.body.slice(0,120)});
            await ctx.close();
          }
          for (const file of ['admin.html','admin-combat-reset.html']) {
            const ctx=await browser.newContext({viewport:{width:1366,height:768}});
            const page=await ctx.newPage();
            const errors=[]; page.on('pageerror',e=>errors.push(String(e)));
            const res=await page.goto(base+file+'?current='+Date.now(),{waitUntil:'domcontentloaded',timeout:60000});
            if (!res || res.status()!==200) throw new Error(file+': HTTP '+(res?.status()??'none'));
            await page.waitForTimeout(1200);
            const text=(await page.locator('body').innerText()).trim();
            if (text.length<40) throw new Error(file+': empty');
            if (errors.length) throw new Error(file+': page errors '+errors.join(' | '));
            proof.push({file,text:text.slice(0,140)});
            await ctx.close();
          }
          await browser.close();
          console.log(JSON.stringify(proof,null,2));
          JS
          cd /tmp/current-playwright
          node test.mjs | tee "$GITHUB_WORKSPACE/current-gameplay-proof.json"
          echo 'CURRENT_BROWSER_SMOKE=PASS'

      - name: Verify anonymous reset is blocked
        shell: bash
        run: |
          set -euo pipefail
          URL='https://cpdgkszviwrgrwsltbyk.supabase.co/rest/v1/rpc/admin_reset_combat_history'
          KEY='sb_publishable_KGkT_uJNg1nRBgftEvlT3w_c_aHOo5K'
          code=$(curl --max-time 25 -sS -o /tmp/reset-anon.json -w '%{http_code}' \
            -X POST "$URL" \
            -H "apikey: $KEY" -H 'content-type: application/json' \
            --data '{"p_legacy_account_id":null,"p_user_id":null,"p_reset_all":false,"p_reason":"anonymous-probe"}' || true)
          case "$code" in
            401|403) ;;
            *) echo "anonymous reset unexpectedly returned HTTP=$code"; cat /tmp/reset-anon.json || true; exit 1;;
          esac
          echo "ANONYMOUS_RESET_BLOCKED=PASS HTTP=$code"

      - name: Upload readiness proof
        uses: actions/upload-artifact@v4
        with:
          name: current-gameplay-readiness-${{ github.sha }}
          path: current-gameplay-proof.json
          if-no-files-found: error
          retention-days: 14
