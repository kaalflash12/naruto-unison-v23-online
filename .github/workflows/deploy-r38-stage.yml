name: Publish Naruto Unison clean final

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: naruto-unison-clean-final
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[DEPLOY-FINAL-CLEAN]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging assets
        uses: actions/checkout@v5
        with:
          ref: staging
          path: source
          fetch-depth: 1

      - name: Checkout payload
        uses: actions/checkout@v5
        with:
          ref: main
          path: payload
          fetch-depth: 1

      - name: Checkout publish target
        uses: actions/checkout@v5
        with:
          ref: main
          path: publish
          fetch-depth: 0
          persist-credentials: true

      - name: Reconstruct, patch and validate
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/site"
          BASE="$RUNNER_TEMP/base.tar.xz"
          OVERLAY="$RUNNER_TEMP/overlay.tar.xz"
          DIAG="$RUNNER_TEMP/final-deploy-diagnostic.txt"
          : > "$DIAG"
          exec > >(tee -a "$DIAG") 2>&1
          rm -rf "$OUT" && mkdir -p "$OUT"

          decode_parts() {
            local dir="$1" out="$2" b64="$RUNNER_TEMP/$(basename "$dir").b64"
            mapfile -t parts < <(find "$dir" -maxdepth 1 -type f -name 'part-*' | sort -V)
            echo "decode_dir=$dir parts=${#parts[@]}"
            test "${#parts[@]}" -gt 0
            : > "$b64"
            for p in "${parts[@]}"; do tr -cd 'A-Za-z0-9+/=' < "$p" >> "$b64"; done
            base64 -d "$b64" > "$out"
            xz -t "$out"
            echo "archive_bytes=$(wc -c < "$out") sha=$(sha256sum "$out" | cut -d' ' -f1)"
          }

          extract_normalized() {
            local archive="$1" dest="$2" tmp="$RUNNER_TEMP/extract-$RANDOM"
            mkdir -p "$tmp"
            tar -xJf "$archive" -C "$tmp"
            if [ -d "$tmp/public" ]; then cp -a "$tmp/public"/. "$dest"/; else cp -a "$tmp"/. "$dest"/; fi
            rm -rf "$tmp"
          }

          test -d payload/.r38-repaired
          decode_parts payload/.r38-repaired "$BASE"
          extract_normalized "$BASE" "$OUT"
          echo 'base_runtime=PASS'

          test -d source/static
          rm -rf "$OUT/static"
          cp -a source/static "$OUT/static"
          STATIC_FILES="$(find "$OUT/static" -type f | wc -l | tr -d ' ')"
          echo "static_files=$STATIC_FILES"
          test "$STATIC_FILES" -ge 3000

          test -d payload/.final-overlay-b64
          decode_parts payload/.final-overlay-b64 "$OVERLAY"
          extract_normalized "$OVERLAY" "$OUT"
          echo 'final_overlay=PASS'

          for f in index.html manifest.webmanifest r38-config.json sw.js src/core/bootstrap.js src/ui/auth/auth-overlay.js src/admin/admin-api.js src/admin/admin-shell.js src/admin/admin.css; do
            test -f "$OUT/$f" || { echo "missing=$f"; exit 21; }
          done
          grep -q 'sb_publishable_' "$OUT/r38-config.json"
          grep -q 'resetPasswordForEmail' "$OUT/src/domains/auth/auth-service.js"
          grep -q 'ESQUECI MINHA SENHA' "$OUT/src/ui/auth/auth-overlay.js"
          grep -q '/admin-gameops/seasons' "$OUT/src/admin/admin-api.js"
          grep -q '/admin-gameops/rewards' "$OUT/src/admin/admin-api.js"
          grep -q "'seasons'" "$OUT/src/admin/admin-shell.js"
          grep -q "'rewards'" "$OUT/src/admin/admin-shell.js"
          node --check "$OUT/src/core/bootstrap.js"
          node --check "$OUT/src/ui/auth/auth-overlay.js"
          node --check "$OUT/src/admin/admin-api.js"
          node --check "$OUT/src/admin/admin-shell.js"
          if grep -Eqi 'R38(?:\.[0-9]+)?|R37|R36|V23\.' "$OUT/index.html" "$OUT/manifest.webmanifest" "$OUT/src/ui/auth/auth-overlay.js"; then
            echo 'public_revision_leak=FAIL'; exit 31
          fi
          if grep -Eqi '<small>R38|R37 BOOT ERROR' "$OUT/src/core/bootstrap.js"; then
            echo 'runtime_revision_leak=FAIL'; exit 32
          fi
          echo 'public_revision_gate=PASS'
          echo "final_files=$(find "$OUT" -type f | wc -l | tr -d ' ')"
          echo 'validation=PASS'

      - name: Record reconstruction failure
        if: steps.build.outcome != 'success'
        shell: bash
        run: |
          set -euo pipefail
          cd publish
          git pull --ff-only origin main
          cp "$RUNNER_TEMP/final-deploy-diagnostic.txt" FINAL-DEPLOY-DIAGNOSTIC.txt || true
          git config user.name 'Naruto Unison Diagnostics'
          git config user.email 'actions@users.noreply.github.com'
          git add FINAL-DEPLOY-DIAGNOSTIC.txt
          git commit -m 'diagnostic: clean final deploy [skip ci]' || true
          git push origin HEAD:main || true
          exit 1

      - name: Synchronize validated site to main
        if: steps.build.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          cd publish
          git pull --ff-only origin main
          find . -mindepth 1 -maxdepth 1 ! -name '.*' -exec rm -rf {} +
          cp -a "$RUNNER_TEMP/site"/. .
          printf 'Naruto Unison PT-BR\nvalidated=true\ndeployed_at=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > DEPLOY-VALIDATED.txt
          rm -f FINAL-DEPLOY-DIAGNOSTIC.txt R382-FINAL-DIAGNOSTIC.txt
          git config user.name 'Naruto Unison Publisher'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Naruto Unison clean validated public site [skip ci]'
            git push origin HEAD:main
          fi
