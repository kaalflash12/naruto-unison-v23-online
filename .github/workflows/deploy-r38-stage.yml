name: Deploy Naruto Unison R38

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

environment:
  name: github-pages

concurrency:
  group: r38-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.head_commit.message != 'Naruto Unison V23.31 R38 online update' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout existing Unison
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Reconstruct R38 overlay stored in main
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r38-overlay"
          git show HEAD:.r38-delta/part-00 > "$RUNNER_TEMP/00"
          git show HEAD:.r38-delta/part-01 > "$RUNNER_TEMP/01"
          git show HEAD:.r38-delta/part-02 > "$RUNNER_TEMP/02"
          git show HEAD:.r38-delta/part-03-05 > "$RUNNER_TEMP/03-05"
          git show HEAD:.r38-delta/part-06-08 > "$RUNNER_TEMP/06-08"
          cat "$RUNNER_TEMP/00" "$RUNNER_TEMP/01" "$RUNNER_TEMP/02" "$RUNNER_TEMP/03-05" "$RUNNER_TEMP/06-08" | base64 -d > "$RUNNER_TEMP/r38.tar.xz"
          tar -xJf "$RUNNER_TEMP/r38.tar.xz" -C "$RUNNER_TEMP/r38-overlay"
          test -f "$RUNNER_TEMP/r38-overlay/index.html"
          grep -q 'V23.31-R38' "$RUNNER_TEMP/r38-overlay/index.html"
          COUNT=$(find "$RUNNER_TEMP/r38-overlay" -type f | wc -l)
          echo "R38 overlay files: $COUNT"
          test "$COUNT" -ge 100

      - name: Build updated Unison site
        shell: bash
        run: |
          set -euo pipefail
          SITE="$RUNNER_TEMP/r38-site"
          rm -rf "$SITE"
          mkdir -p "$SITE"
          git archive HEAD | tar -x -C "$SITE"
          cp -a "$RUNNER_TEMP/r38-overlay"/. "$SITE/"
          rm -rf "$SITE/.r38-delta" "$SITE/.git" "$SITE/.github"
          test -f "$SITE/index.html"
          grep -q 'V23.31-R38' "$SITE/index.html"

      - name: Commit actual R38 site to main
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github ! -name .r38-delta -exec rm -rf {} +
          cp -a "$RUNNER_TEMP/r38-site"/. .
          git config user.name 'Naruto Unison R38 Deploy'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git reset -- .r38-delta 2>/dev/null || true
          if git diff --cached --quiet; then
            echo 'No site changes detected.'
          else
            git commit -m 'Naruto Unison V23.31 R38 online update'
            git push origin HEAD:main
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/r38-site

      - name: Deploy R38 to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify public R38 marker
        shell: bash
        run: |
          set -euo pipefail
          URL='https://kaalflash12.github.io/naruto-unison-v23-online/'
          for i in $(seq 1 30); do
            BODY=$(curl -fsSL --retry 2 "$URL?r38=$GITHUB_RUN_ID" || true)
            if printf '%s' "$BODY" | grep -q 'V23.31-R38'; then
              echo 'R38 marker confirmed on public Pages.'
              exit 0
            fi
            sleep 10
          done
          echo 'R38 public marker not observed.' >&2
          exit 1
