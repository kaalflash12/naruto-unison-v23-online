name: Publish Naruto Unison R38.2 final

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: r382-final-publish
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[DEPLOY-R382-FINAL]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout intact staging static
        uses: actions/checkout@v5
        with:
          ref: staging
          path: source
          fetch-depth: 1

      - name: Checkout runtime and patches
        uses: actions/checkout@v5
        with:
          ref: main
          path: payload
          fetch-depth: 1

      - name: Checkout main publish target
        uses: actions/checkout@v5
        with:
          ref: main
          path: publish
          fetch-depth: 0
          persist-credentials: true

      - name: Reconstruct and validate V23.32-R38.2
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/r382-site"
          RUNTIME="$RUNNER_TEMP/r38-runtime.tar.xz"
          R382="$RUNNER_TEMP/r382.tar.xz"
          DIAG="$RUNNER_TEMP/r382-final-diag.txt"
          : > "$DIAG"
          exec > >(tee -a "$DIAG") 2>&1
          echo 'V23.32-R38.2 FINAL BUILD DIAGNOSTIC'
          rm -rf "$OUT" && mkdir -p "$OUT"

          test -d source/static
          STATIC_FILES="$(find source/static -type f | wc -l | tr -d ' ')"
          echo "staging_static_files=$STATIC_FILES"
          test "$STATIC_FILES" -ge 100
          cp -a source/static "$OUT/static"

          decode_xz_parts() {
            local dir="$1" out="$2" b64="$RUNNER_TEMP/parts.b64"
            mapfile -t parts < <(find "$dir" -maxdepth 1 -type f -name 'part-*' | sort -V)
            echo "decode_dir=$dir parts=${#parts[@]}"
            test "${#parts[@]}" -gt 0
            : > "$b64"
            for p in "${parts[@]}"; do tr -cd 'A-Za-z0-9+/=' < "$p" >> "$b64"; done
            echo "concat_b64_bytes=$(wc -c < "$b64")"
            if base64 -d "$b64" > "$out" 2>/dev/null && xz -t "$out" 2>/dev/null; then
              echo "decode_mode=concatenated decoded_bytes=$(wc -c < "$out") sha=$(sha256sum "$out"|cut -d' ' -f1)"
              return 0
            fi
            : > "$out"
            for p in "${parts[@]}"; do base64 -di "$p" >> "$out"; done
            echo "decode_mode=independent decoded_bytes=$(wc -c < "$out") sha=$(sha256sum "$out"|cut -d' ' -f1)"
            xz -t "$out"
          }

          decode_xz_parts payload/.r38-runtime-v2 "$RUNTIME"
          echo 'runtime_xz=PASS'
          tar -tJf "$RUNTIME" > "$RUNNER_TEMP/runtime-list.txt"
          echo "runtime_entries=$(wc -l < "$RUNNER_TEMP/runtime-list.txt")"
          grep -qE '(^|\./)src/core/bootstrap\.js$' "$RUNNER_TEMP/runtime-list.txt"
          grep -qE '(^|\./)src/data/fallback/technique\.json$' "$RUNNER_TEMP/runtime-list.txt"
          tar -xJf "$RUNTIME" -C "$OUT"
          echo 'runtime_extract=PASS'

          rm -rf "$OUT/static" && cp -a source/static "$OUT/static"

          cp -a payload/.r38-patch/. "$OUT/"
          sed -i 's/V23.31-R38/V23.31-R38.1/g' "$OUT/index.html"
          sed -i 's/naruto-unison-v23-31-r38/naruto-unison-v23-31-r38-1/g' "$OUT/sw.js"
          sed -i 's/37.1.5/38.1.0/g' "$OUT/src/core/bootstrap.js"
          echo 'r381_overlay=PASS'

          decode_xz_parts payload/.r382-delta "$R382"
          echo 'b8611810355ed83c077466498f7f8ce33936dd5ef41193103c09f5d9607b6da6  '"$R382" | sha256sum -c -
          tar -xJf "$R382" -C "$OUT"
          echo 'r382_overlay=PASS'

          printf 'V23.32-R38.2\n' > "$OUT/DEPLOYED-VERSION.txt"
          printf 'source=staging-static+r38-runtime-v2+r38.1-patch+r38.2-delta\nr382_sha256=b8611810355ed83c077466498f7f8ce33936dd5ef41193103c09f5d9607b6da6\n' > "$OUT/R382-BUILD-PROOF.txt"

          for f in index.html sw.js r38-config.json src/core/bootstrap.js src/domains/ranked/ranked-service.js src/domains/battle/balance-engine.js src/fx/combat-animation-director.js src/fx/item-fx-director.js; do test -f "$OUT/$f" || { echo "missing=$f"; exit 22; }; done
          grep -q 'V23.32-R38.2' "$OUT/index.html"
          grep -q 'naruto-unison-v23-32-r38-2' "$OUT/sw.js"
          grep -q 'R38.2' "$OUT/src/core/bootstrap.js"
          grep -q 'submissionId' "$OUT/src/domains/ranked/ranked-service.js"
          grep -q 'sb_publishable_' "$OUT/r38-config.json"
          FX="$(find "$OUT/assets/fx-r382" -type f -name '*.svg' | wc -l | tr -d ' ')"
          echo "fx_families=$FX"
          test "$FX" -eq 31
          test "$(find "$OUT/static" -type f | wc -l | tr -d ' ')" -eq "$STATIC_FILES"

          node --check "$OUT/src/core/bootstrap.js"
          node --check "$OUT/src/fx/animation-profile-registry.js"
          node --check "$OUT/src/fx/combat-animation-director.js"
          node --check "$OUT/src/fx/item-fx-director.js"
          node --check "$OUT/src/domains/battle/mechanics-engine.js"

          ROOT="$OUT" node <<'NODE'
          const fs=require('fs'),path=require('path'),root=process.env.ROOT;
          const arr=n=>{const d=JSON.parse(fs.readFileSync(path.join(root,'src/data/fallback',n+'.json'),'utf8'));return Array.isArray(d)?d:(d.items||[])};
          for(const [n,c] of Object.entries({character:214,technique:1262,equipment:105,item:24})){const got=arr(n).length;console.log(`${n}=${got}`);if(got!==c)throw Error(`${n}:${got}!=${c}`)}
          NODE

          FILES="$(find "$OUT" -type f | wc -l | tr -d ' ')"
          BYTES="$(du -sb "$OUT" | cut -f1)"
          echo "final_files=$FILES final_bytes=$BYTES"
          echo "files=$FILES" >> "$GITHUB_OUTPUT"
          echo "bytes=$BYTES" >> "$GITHUB_OUTPUT"
          echo "static_files=$STATIC_FILES" >> "$GITHUB_OUTPUT"
          echo "fx=$FX" >> "$GITHUB_OUTPUT"
          echo 'validation=PASS'

      - name: Record failed final reconstruction
        if: steps.build.outcome != 'success'
        shell: bash
        run: |
          set -euo pipefail
          cd publish
          git pull --ff-only origin main
          cp "$RUNNER_TEMP/r382-final-diag.txt" R382-FINAL-DIAGNOSTIC.txt || true
          git config user.name 'Naruto Unison R38.2 Diagnostics'
          git config user.email 'actions@users.noreply.github.com'
          git add R382-FINAL-DIAGNOSTIC.txt
          git commit -m 'ci: record R38.2 final diagnostics [skip ci]' || true
          git push origin HEAD:main || true
          exit 1

      - name: Synchronize validated R38.2 site to main
        if: steps.build.outcome == 'success'
        shell: bash
        env:
          FILES: ${{ steps.build.outputs.files }}
          BYTES: ${{ steps.build.outputs.bytes }}
          STATIC_FILES: ${{ steps.build.outputs.static_files }}
          FX: ${{ steps.build.outputs.fx }}
        run: |
          set -euo pipefail
          cd publish
          find . -mindepth 1 -maxdepth 1 \
            ! -name .git ! -name .github \
            ! -name .r38-delta ! -name .r38-patch ! -name .r382-delta \
            ! -name .r38-repaired ! -name .r38-runtime-lite ! -name .r38-runtime-v2 \
            -exec rm -rf {} +
          cp -a "$RUNNER_TEMP/r382-site"/. .
          {
            echo 'V23.32-R38.2'
            echo "files=$FILES"
            echo "bytes=$BYTES"
            echo "static_files=$STATIC_FILES"
            echo "fx_families=$FX"
            echo 'source=staging-static+r38-runtime-v2+r38.1-patch+r38.2-delta'
            echo 'r382_sha256=b8611810355ed83c077466498f7f8ce33936dd5ef41193103c09f5d9607b6da6'
            echo "deployed_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > R382-DEPLOY-VALIDATED.txt
          rm -f R382-STAGING-STATUS.txt R382-FINAL-DIAGNOSTIC.txt
          git config user.name 'Naruto Unison R38.2 Publisher'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git reset -- .r38-delta .r38-patch .r382-delta .r38-repaired .r38-runtime-lite .r38-runtime-v2 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m 'Naruto Unison V23.32 R38.2 validated site [skip ci]'
            git push origin HEAD:main
          fi
