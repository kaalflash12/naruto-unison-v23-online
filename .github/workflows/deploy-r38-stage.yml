name: Deploy Naruto Unison R38.2 to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

environment:
  name: github-pages

concurrency:
  group: pages-r382
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout payload
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1

      - name: Reconstruct R38.2 public site
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/r382-site"
          rm -rf "$OUT"
          mkdir -p "$OUT"

          for p in part-00 part-01 part-02 part-03-05 part-06-08; do
            test -f ".r38-delta/$p"
          done
          cat .r38-delta/part-00 .r38-delta/part-01 .r38-delta/part-02 .r38-delta/part-03-05 .r38-delta/part-06-08 | base64 -d > "$RUNNER_TEMP/r38.tar.xz"
          tar -xJf "$RUNNER_TEMP/r38.tar.xz" -C "$OUT"

          cp -a .r38-patch/. "$OUT/"
          sed -i 's/V23.31-R38/V23.31-R38.1/g' "$OUT/index.html"
          sed -i 's/naruto-unison-v23-31-r38/naruto-unison-v23-31-r38-1/g' "$OUT/sw.js"
          sed -i 's/37.1.5/38.1.0/g' "$OUT/src/core/bootstrap.js"

          for p in part-00 part-01 part-02 part-03 part-04 part-05 part-06; do
            test -f ".r382-delta/$p"
          done
          cat .r382-delta/part-00 .r382-delta/part-01 .r382-delta/part-02 .r382-delta/part-03 .r382-delta/part-04 .r382-delta/part-05 .r382-delta/part-06 | base64 -d > "$RUNNER_TEMP/r382.tar.xz"
          echo 'b8611810355ed83c077466498f7f8ce33936dd5ef41193103c09f5d9607b6da6  '"$RUNNER_TEMP/r382.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/r382.tar.xz" -C "$OUT"

          test -f "$OUT/index.html"
          grep -q 'V23.32-R38.2' "$OUT/index.html"
          grep -q 'naruto-unison-v23-32-r38-2' "$OUT/sw.js"
          grep -q 'R38.2' "$OUT/src/core/bootstrap.js"
          grep -q 'submissionId' "$OUT/src/domains/ranked/ranked-service.js"
          test -f "$OUT/src/fx/combat-animation-director.js"
          test -f "$OUT/src/fx/item-fx-director.js"
          test "$(find "$OUT/assets/fx-r382" -type f -name '*.svg' | wc -l)" -eq 31
          node --check "$OUT/src/core/bootstrap.js"
          node --check "$OUT/src/fx/animation-profile-registry.js"
          node --check "$OUT/src/fx/combat-animation-director.js"
          node --check "$OUT/src/fx/item-fx-director.js"
          echo "R38.2 files: $(find "$OUT" -type f | wc -l)"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/r382-site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
