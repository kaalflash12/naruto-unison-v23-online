name: Publish Naruto Unison R38.2 from staging static

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-r382-final
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[DEPLOY-R382-FINAL]') }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - name: Checkout intact staging static
        uses: actions/checkout@v5
        with:
          ref: staging
          path: source
          fetch-depth: 1

      - name: Checkout validated runtime and patches
        uses: actions/checkout@v5
        with:
          ref: main
          path: payload
          fetch-depth: 1

      - name: Checkout publish target
        uses: actions/checkout@v5
        with:
          ref: main
          path: publish
          fetch-depth: 0
          persist-credentials: true

      - name: Reconstruct and validate V23.32-R38.2
        id: build
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/r382-site"
          RUNTIME="$RUNNER_TEMP/r38-runtime.tar.xz"
          R382="$RUNNER_TEMP/r382.tar.xz"
          rm -rf "$OUT" && mkdir -p "$OUT"

          test -d source/static
          STATIC_FILES="$(find source/static -type f | wc -l | tr -d ' ')"
          test "$STATIC_FILES" -ge 100
          cp -a source/static "$OUT/static"

          decode_xz_parts() {
            local dir="$1" out="$2" b64="$RUNNER_TEMP/parts.b64"
            mapfile -t parts < <(find "$dir" -maxdepth 1 -type f -name 'part-*' | sort -V)
            test "${#parts[@]}" -gt 0
            : > "$b64"
            for p in "${parts[@]}"; do tr -cd 'A-Za-z0-9+/=' < "$p" >> "$b64"; done
            if base64 -d "$b64" > "$out" 2>/dev/null && xz -t "$out" 2>/dev/null; then
              echo "decoded concatenated base64 from $dir (${#parts[@]} parts)"
              return 0
            fi
            : > "$out"
            for p in "${parts[@]}"; do base64 -di "$p" >> "$out"; done
            xz -t "$out"
            echo "decoded independent base64 blocks from $dir (${#parts[@]} parts)"
          }

          # The old .r38-repaired/.r38-delta path is intentionally not used.
          decode_xz_parts payload/.r38-runtime-v2 "$RUNTIME"
          tar -tJf "$RUNTIME" | grep -qE '(^|\./)src/core/bootstrap\.js$'
          tar -tJf "$RUNTIME" | grep -qE '(^|\./)src/data/fallback/technique\.json$'
          tar -xJf "$RUNTIME" -C "$OUT"

          # staging/static is authoritative for the large legacy image tree.
          rm -rf "$OUT/static" && cp -a source/static "$OUT/static"

          # R38.1 corrections.
          cp -a payload/.r38-patch/. "$OUT/"
          sed -i 's/V23.31-R38/V23.31-R38.1/g' "$OUT/index.html"
          sed -i 's/naruto-unison-v23-31-r38/naruto-unison-v23-31-r38-1/g' "$OUT/sw.js"
          sed -i 's/37.1.5/38.1.0/g' "$OUT/src/core/bootstrap.js"

          # Exact R38.2 overlay already independently validated in CI.
          decode_xz_parts payload/.r382-delta "$R382"
          echo 'b8611810355ed83c077466498f7f8ce33936dd5ef41193103c09f5d9607b6da6  '"$R382" | sha256sum -c -
          tar -xJf "$R382" -C "$OUT"

          printf 'V23.32-R38.2\n' > "$OUT/DEPLOYED-VERSION.txt"
          printf 'source=staging-static+r38-runtime-v2+r38.1-patch+r38.2-delta\nr382_sha256=b8611810355ed83c077466498f7f8ce33936dd5ef41193103c09f5d9607b6da6\n' > "$OUT/R382-BUILD-PROOF.txt"

          test -f "$OUT/index.html"
          test -f "$OUT/sw.js"
          test -f "$OUT/r38-config.json"
          test -f "$OUT/src/core/bootstrap.js"
          test -f "$OUT/src/domains/ranked/ranked-service.js"
          test -f "$OUT/src/domains/battle/balance-engine.js"
          test -f "$OUT/src/fx/combat-animation-director.js"
          test -f "$OUT/src/fx/item-fx-director.js"
          grep -q 'V23.32-R38.2' "$OUT/index.html"
          grep -q 'naruto-unison-v23-32-r38-2' "$OUT/sw.js"
          grep -q 'R38.2' "$OUT/src/core/bootstrap.js"
          grep -q 'submissionId' "$OUT/src/domains/ranked/ranked-service.js"
          grep -q 'sb_publishable_' "$OUT/r38-config.json"
          test "$(find "$OUT/assets/fx-r382" -type f -name '*.svg' | wc -l)" -eq 31
          test "$(find "$OUT/static" -type f | wc -l)" -eq "$STATIC_FILES"

          node --check "$OUT/src/core/bootstrap.js"
          node --check "$OUT/src/fx/animation-profile-registry.js"
          node --check "$OUT/src/fx/combat-animation-director.js"
          node --check "$OUT/src/fx/item-fx-director.js"
          node --check "$OUT/src/domains/battle/mechanics-engine.js"

          ROOT="$OUT" node <<'NODE'
          const fs=require('fs'),path=require('path');
          const root=process.env.ROOT;
          const read=n=>JSON.parse(fs.readFileSync(path.join(root,'src/data/fallback',n+'.json'),'utf8'));
          const arr=n=>{const d=read(n);return Array.isArray(d)?d:(d.items||[])};
          const expected={character:214,technique:1262,equipment:105,item:24};
          for(const [n,c] of Object.entries(expected)){const got=arr(n).length;if(got!==c)throw new Error(`${n}: ${got} != ${c}`)}
          let missing=[];
          for(const n of ['character','technique','equipment','item','scene']){
            const d=read(n);
            const walk=x=>{if(Array.isArray(x))return x.forEach(walk);if(x&&typeof x==='object')return Object.values(x).forEach(walk);if(typeof x==='string'&&/\.(png|jpe?g|webp|svg|gif|ico)$/i.test(x)&&!/^https?:/i.test(x)){if(!fs.existsSync(path.join(root,x.replace(/^\//,''))))missing.push(`${n}:${x}`)}};
            walk(d);
          }
          if(missing.length){console.error(missing.slice(0,50).join('\n'));throw new Error(`missing local image refs: ${missing.length}`)}
          console.log('content/image contract PASS',expected);
          NODE

          FILES="$(find "$OUT" -type f | wc -l | tr -d ' ')"
          BYTES="$(du -sb "$OUT" | cut -f1)"
          FX="$(find "$OUT/assets/fx-r382" -type f -name '*.svg' | wc -l | tr -d ' ')"
          echo "files=$FILES" >> "$GITHUB_OUTPUT"
          echo "bytes=$BYTES" >> "$GITHUB_OUTPUT"
          echo "static_files=$STATIC_FILES" >> "$GITHUB_OUTPUT"
          echo "fx=$FX" >> "$GITHUB_OUTPUT"
          echo "R38.2 VALIDATED files=$FILES bytes=$BYTES static=$STATIC_FILES fx=$FX"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload validated Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/r382-site

      - name: Deploy validated R38.2 to Pages
        id: pages
        uses: actions/deploy-pages@v4

      - name: Synchronize validated site to main
        shell: bash
        env:
          PAGE_URL: ${{ steps.pages.outputs.page_url }}
          FILES: ${{ steps.build.outputs.files }}
          BYTES: ${{ steps.build.outputs.bytes }}
          STATIC_FILES: ${{ steps.build.outputs.static_files }}
          FX: ${{ steps.build.outputs.fx }}
        run: |
          set -euo pipefail
          cd publish
          find . -mindepth 1 -maxdepth 1 \
            ! -name .git ! -name .github \
            ! -name .r38-delta ! -name .r38-patch ! -name .r382-delta \
            ! -name .r38-repaired ! -name .r38-runtime-lite ! -name .r38-runtime-v2 \
            -exec rm -rf {} +
          cp -a "$RUNNER_TEMP/r382-site"/. .
          {
            echo 'V23.32-R38.2'
            echo "page_url=$PAGE_URL"
            echo "files=$FILES"
            echo "bytes=$BYTES"
            echo "static_files=$STATIC_FILES"
            echo "fx_families=$FX"
            echo 'source=staging-static+r38-runtime-v2+r38.1-patch+r38.2-delta'
            echo 'r382_sha256=b8611810355ed83c077466498f7f8ce33936dd5ef41193103c09f5d9607b6da6'
            echo "deployed_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > R382-DEPLOY-VALIDATED.txt
          rm -f R382-STAGING-STATUS.txt
          git config user.name 'Naruto Unison R38.2 Publisher'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git reset -- .r38-delta .r38-patch .r382-delta .r38-repaired .r38-runtime-lite .r38-runtime-v2 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m 'Naruto Unison V23.32 R38.2 validated site [skip ci]'
            git push origin HEAD:main
          fi
