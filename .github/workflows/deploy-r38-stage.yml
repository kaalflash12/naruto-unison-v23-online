name: Publish Naruto Unison R38.2 from staging static

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: r382-staging-publish
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[DEPLOY-R382-STAGING]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout intact staging static
        uses: actions/checkout@v5
        with:
          ref: staging
          path: source
          fetch-depth: 1

      - name: Checkout validated R38/R38.2 payloads
        uses: actions/checkout@v5
        with:
          ref: r382-publish-trigger
          path: payload
          fetch-depth: 1

      - name: Checkout main publish target
        uses: actions/checkout@v5
        with:
          ref: main
          path: publish
          fetch-depth: 0
          persist-credentials: true

      - name: Build and validate R38.2
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/r382-site"
          BASE="$RUNNER_TEMP/r38-base.tar.xz"
          PATCH="$RUNNER_TEMP/r382-patch.tar.xz"
          rm -rf "$OUT"
          mkdir -p "$OUT"

          test -d source/static
          STATIC_FILES="$(find source/static -type f | wc -l | tr -d ' ')"
          test "$STATIC_FILES" -ge 100
          cp -a source/static "$OUT/static"

          # IMPORTANT: os blocos R38 foram codificados individualmente. Decodificar
          # cada bloco separadamente evita parar no padding '=' do primeiro bloco.
          : > "$BASE"
          for p in part-00 part-01 part-02 part-03-05 part-06-08; do
            test -s "payload/.r38-delta/$p"
            base64 -di "payload/.r38-delta/$p" >> "$BASE"
          done
          xz -t "$BASE"
          tar -xJf "$BASE" -C "$OUT"

          # A pasta static da staging é a fonte íntegra de imagens/assets legados.
          rm -rf "$OUT/static"
          cp -a source/static "$OUT/static"

          cp -a payload/.r38-patch/. "$OUT/"
          sed -i 's/V23.31-R38/V23.31-R38.1/g' "$OUT/index.html"
          sed -i 's/naruto-unison-v23-31-r38/naruto-unison-v23-31-r38-1/g' "$OUT/sw.js"
          sed -i 's/37.1.5/38.1.0/g' "$OUT/src/core/bootstrap.js"

          # R38.2 também é reconstruída bloco a bloco; o SHA fecha o payload exato.
          : > "$PATCH"
          for p in part-00 part-01 part-02 part-03 part-04 part-05 part-06; do
            test -s "payload/.r382-delta/$p"
            base64 -di "payload/.r382-delta/$p" >> "$PATCH"
          done
          echo 'b8611810355ed83c077466498f7f8ce33936dd5ef41193103c09f5d9607b6da6  '"$PATCH" | sha256sum -c -
          xz -t "$PATCH"
          tar -xJf "$PATCH" -C "$OUT"

          printf 'V23.32-R38.2\n' > "$OUT/DEPLOYED-VERSION.txt"
          printf 'source=staging-static+r38-delta-independent+r38.1-patch+r38.2-delta-independent\nr382_sha256=b8611810355ed83c077466498f7f8ce33936dd5ef41193103c09f5d9607b6da6\n' > "$OUT/R382-BUILD-PROOF.txt"

          test -f "$OUT/index.html"
          test -f "$OUT/sw.js"
          test -f "$OUT/r38-config.json"
          test -f "$OUT/src/core/bootstrap.js"
          test -f "$OUT/src/domains/ranked/ranked-service.js"
          test -f "$OUT/src/domains/battle/balance-engine.js"
          test -f "$OUT/src/fx/combat-animation-director.js"
          test -f "$OUT/src/fx/item-fx-director.js"
          grep -q 'V23.32-R38.2' "$OUT/index.html"
          grep -q 'naruto-unison-v23-32-r38-2' "$OUT/sw.js"
          grep -q 'R38.2' "$OUT/src/core/bootstrap.js"
          grep -q 'submissionId' "$OUT/src/domains/ranked/ranked-service.js"
          grep -q 'sb_publishable_' "$OUT/r38-config.json"
          test "$(find "$OUT/assets/fx-r382" -type f -name '*.svg' | wc -l)" -eq 31
          test "$(find "$OUT/static" -type f | wc -l)" -eq "$STATIC_FILES"
          node --check "$OUT/src/core/bootstrap.js"
          node --check "$OUT/src/fx/animation-profile-registry.js"
          node --check "$OUT/src/fx/combat-animation-director.js"
          node --check "$OUT/src/fx/item-fx-director.js"
          node --check "$OUT/src/domains/battle/mechanics-engine.js"

          FILES="$(find "$OUT" -type f | wc -l | tr -d ' ')"
          BYTES="$(du -sb "$OUT" | cut -f1)"
          FX="$(find "$OUT/assets/fx-r382" -type f -name '*.svg' | wc -l | tr -d ' ')"
          echo "files=$FILES" >> "$GITHUB_OUTPUT"
          echo "bytes=$BYTES" >> "$GITHUB_OUTPUT"
          echo "static_files=$STATIC_FILES" >> "$GITHUB_OUTPUT"
          echo "fx=$FX" >> "$GITHUB_OUTPUT"
          echo "R38.2 VALIDATED: files=$FILES bytes=$BYTES static=$STATIC_FILES fx=$FX"

      - name: Publish validated R38.2 site to main
        if: steps.build.outcome == 'success'
        shell: bash
        env:
          FILES: ${{ steps.build.outputs.files }}
          BYTES: ${{ steps.build.outputs.bytes }}
          STATIC_FILES: ${{ steps.build.outputs.static_files }}
          FX: ${{ steps.build.outputs.fx }}
        run: |
          set -euo pipefail
          cd publish
          find . -mindepth 1 -maxdepth 1 \
            ! -name .git \
            ! -name .github \
            ! -name .r38-delta \
            ! -name .r38-patch \
            ! -name .r382-delta \
            ! -name .r38-repaired \
            ! -name .r38-runtime-lite \
            -exec rm -rf {} +
          cp -a "$RUNNER_TEMP/r382-site"/. .
          {
            echo 'V23.32-R38.2'
            echo "files=$FILES"
            echo "bytes=$BYTES"
            echo "static_files=$STATIC_FILES"
            echo "fx_families=$FX"
            echo 'source=staging-static+r38-delta-independent+r38.1-patch+r38.2-delta-independent'
            echo 'r382_sha256=b8611810355ed83c077466498f7f8ce33936dd5ef41193103c09f5d9607b6da6'
            echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > R382-DEPLOY-VALIDATED.txt
          rm -f R382-STAGING-STATUS.txt
          git config user.name 'Naruto Unison R38.2 Publisher'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git reset -- .r38-delta .r38-patch .r382-delta .r38-repaired .r38-runtime-lite 2>/dev/null || true
          if git diff --cached --quiet; then
            echo 'Main already matches validated R38.2.'
          else
            git commit -m 'Naruto Unison V23.32 R38.2 validated site [skip ci]'
            git push origin HEAD:main
          fi

      - name: Record failed staging reconstruction
        if: steps.build.outcome != 'success'
        shell: bash
        run: |
          set -euo pipefail
          cd publish
          git pull --ff-only origin main
          {
            echo 'R38.2 STAGING RECONSTRUCTION FAILED'
            echo "source_commit=${GITHUB_SHA}"
            echo 'strategy=staging-static+r38-delta-independent+r38.1-patch+r38.2-delta-independent'
            echo 'r382_sha256=b8611810355ed83c077466498f7f8ce33936dd5ef41193103c09f5d9607b6da6'
            echo "failed_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > R382-STAGING-STATUS.txt
          git config user.name 'Naruto Unison R38.2 Publisher'
          git config user.email 'actions@users.noreply.github.com'
          git add R382-STAGING-STATUS.txt
          git commit -m 'ci: R38.2 staging reconstruction failed [skip ci]' || true
          git push origin HEAD:main || true
          exit 1
