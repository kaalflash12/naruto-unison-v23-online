name: Publish Naruto Unison R38.1 to main

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: r38-main-publish
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[DEPLOY-R38-BASE]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Reconstruct R38 base and apply R38.1 patch
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/r381-site"
          mkdir -p "$OUT"
          git show HEAD:.r38-delta/part-00 > "$RUNNER_TEMP/00"
          git show HEAD:.r38-delta/part-01 > "$RUNNER_TEMP/01"
          git show HEAD:.r38-delta/part-02 > "$RUNNER_TEMP/02"
          git show HEAD:.r38-delta/part-03-05 > "$RUNNER_TEMP/03-05"
          git show HEAD:.r38-delta/part-06-08 > "$RUNNER_TEMP/06-08"
          cat "$RUNNER_TEMP/00" "$RUNNER_TEMP/01" "$RUNNER_TEMP/02" "$RUNNER_TEMP/03-05" "$RUNNER_TEMP/06-08" | base64 -d > "$RUNNER_TEMP/r38.tar.xz"
          tar -xJf "$RUNNER_TEMP/r38.tar.xz" -C "$OUT"
          cp -a .r38-patch/. "$OUT/"
          sed -i 's/V23.31-R38/V23.31-R38.1/g' "$OUT/index.html"
          sed -i 's/naruto-unison-v23-31-r38/naruto-unison-v23-31-r38-1/g' "$OUT/sw.js"
          sed -i 's/37.1.5/38.1.0/g' "$OUT/src/core/bootstrap.js"
          grep -q 'V23.31-R38.1' "$OUT/index.html"
          test -f "$OUT/src/domains/battle/balance-engine.js"
          test -f "$OUT/assets/fx-r38/spiral.svg"
          test "$(find "$OUT" -type f | wc -l)" -ge 100

      - name: Commit complete R38.1 site to main
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github ! -name .r38-delta ! -name .r38-patch -exec rm -rf {} +
          cp -a "$RUNNER_TEMP/r381-site"/. .
          git config user.name 'Naruto Unison R38 Publisher'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git reset -- .r38-delta .r38-patch 2>/dev/null || true
          if git diff --cached --quiet; then
            echo 'No changes to publish.'
          else
            git commit -m 'Naruto Unison V23.31 R38.1 online update'
            git push origin HEAD:main
          fi
