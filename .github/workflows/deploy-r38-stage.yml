name: Deploy Naruto Unison R38.2 to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

environment:
  name: github-pages

concurrency:
  group: pages-r382
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout payload
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1

      - name: Reconstruct and validate R38.2 public site
        id: validate
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/r382-site"
          R38="$RUNNER_TEMP/r38.tar.xz"
          R382="$RUNNER_TEMP/r382.tar.xz"
          rm -rf "$OUT"
          mkdir -p "$OUT"

          mapfile -t BASE_PARTS < <(find .r38-repaired -maxdepth 1 -type f -name 'part-*' | sort -V)
          test "${#BASE_PARTS[@]}" -ge 1
          cat "${BASE_PARTS[@]}" | base64 -di > "$R38"
          xz -t "$R38"
          tar -xJf "$R38" -C "$OUT"

          cp -a .r38-patch/. "$OUT/"
          sed -i 's/V23.31-R38/V23.31-R38.1/g' "$OUT/index.html"
          sed -i 's/naruto-unison-v23-31-r38/naruto-unison-v23-31-r38-1/g' "$OUT/sw.js"
          sed -i 's/37.1.5/38.1.0/g' "$OUT/src/core/bootstrap.js"

          : > "$R382"
          for p in part-00 part-01 part-02 part-03 part-04 part-05 part-06; do
            base64 -di ".r382-delta/$p" >> "$R382"
          done
          echo 'b8611810355ed83c077466498f7f8ce33936dd5ef41193103c09f5d9607b6da6  '"$R382" | sha256sum -c -
          xz -t "$R382"
          tar -xJf "$R382" -C "$OUT"

          test -f "$OUT/index.html"
          grep -q 'V23.32-R38.2' "$OUT/index.html"
          grep -q 'naruto-unison-v23-32-r38-2' "$OUT/sw.js"
          grep -q 'R38.2' "$OUT/src/core/bootstrap.js"
          grep -q 'submissionId' "$OUT/src/domains/ranked/ranked-service.js"
          test -f "$OUT/src/fx/combat-animation-director.js"
          test -f "$OUT/src/fx/item-fx-director.js"
          test "$(find "$OUT/assets/fx-r382" -type f -name '*.svg' | wc -l)" -eq 31
          node --check "$OUT/src/core/bootstrap.js"
          node --check "$OUT/src/fx/animation-profile-registry.js"
          node --check "$OUT/src/fx/combat-animation-director.js"
          node --check "$OUT/src/fx/item-fx-director.js"

          FILES="$(find "$OUT" -type f | wc -l | tr -d ' ')"
          BYTES="$(du -sb "$OUT" | cut -f1)"
          printf 'V23.32-R38.2\n' > "$OUT/DEPLOYED-VERSION.txt"
          echo "base_parts=${#BASE_PARTS[@]}" >> "$GITHUB_OUTPUT"
          echo "files=$FILES" >> "$GITHUB_OUTPUT"
          echo "bytes=$BYTES" >> "$GITHUB_OUTPUT"
          printf 'R38 base parts: %s\nR38.2 files: %s\nR38.2 bytes: %s\n' "${#BASE_PARTS[@]}" "$FILES" "$BYTES"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/r382-site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Record successful deployment
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          BASE_PARTS: ${{ steps.validate.outputs.base_parts }}
          FILES: ${{ steps.validate.outputs.files }}
          BYTES: ${{ steps.validate.outputs.bytes }}
        run: |
          set -euo pipefail
          {
            echo 'V23.32-R38.2'
            echo "source_commit=${GITHUB_SHA}"
            echo "page_url=${PAGE_URL}"
            echo "base_parts=${BASE_PARTS}"
            echo "files=${FILES}"
            echo "bytes=${BYTES}"
            echo 'r382_sha256=b8611810355ed83c077466498f7f8ce33936dd5ef41193103c09f5d9607b6da6'
            echo "deployed_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > R382-DEPLOY-VALIDATED.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add R382-DEPLOY-VALIDATED.txt
          if ! git diff --cached --quiet; then
            git commit -m 'chore: record successful R38.2 Pages deployment [skip ci]'
            git push origin HEAD:main
          fi
