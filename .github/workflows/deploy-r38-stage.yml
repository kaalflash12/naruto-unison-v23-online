name: Deploy Naruto Unison R38.2 to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

environment:
  name: github-pages

concurrency:
  group: pages-r382
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout payload
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1

      - name: Reconstruct and validate R38.2 public site
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/r382-site"
          R38="$RUNNER_TEMP/r38.tar.xz"
          R382="$RUNNER_TEMP/r382.tar.xz"
          rm -rf "$OUT"
          mkdir -p "$OUT"

          # R38 repaired base. Concatenate in numeric filename order before decoding.
          mapfile -t BASE_PARTS < <(find .r38-repaired -maxdepth 1 -type f -name 'part-*' | sort -V)
          test "${#BASE_PARTS[@]}" -ge 1
          cat "${BASE_PARTS[@]}" | base64 -di > "$R38"
          xz -t "$R38"
          tar -xJf "$R38" -C "$OUT"

          # R38.1 patch.
          cp -a .r38-patch/. "$OUT/"
          sed -i 's/V23.31-R38/V23.31-R38.1/g' "$OUT/index.html"
          sed -i 's/naruto-unison-v23-31-r38/naruto-unison-v23-31-r38-1/g' "$OUT/sw.js"
          sed -i 's/37.1.5/38.1.0/g' "$OUT/src/core/bootstrap.js"

          # R38.2 delta; SHA-256 locks the exact validated payload.
          : > "$R382"
          for p in part-00 part-01 part-02 part-03 part-04 part-05 part-06; do
            base64 -di ".r382-delta/$p" >> "$R382"
          done
          echo 'b8611810355ed83c077466498f7f8ce33936dd5ef41193103c09f5d9607b6da6  '"$R382" | sha256sum -c -
          xz -t "$R382"
          tar -xJf "$R382" -C "$OUT"

          # Hard release gates: never publish a partial/broken runtime.
          test -f "$OUT/index.html"
          grep -q 'V23.32-R38.2' "$OUT/index.html"
          grep -q 'naruto-unison-v23-32-r38-2' "$OUT/sw.js"
          grep -q 'R38.2' "$OUT/src/core/bootstrap.js"
          grep -q 'submissionId' "$OUT/src/domains/ranked/ranked-service.js"
          test -f "$OUT/src/fx/combat-animation-director.js"
          test -f "$OUT/src/fx/item-fx-director.js"
          test "$(find "$OUT/assets/fx-r382" -type f -name '*.svg' | wc -l)" -eq 31
          node --check "$OUT/src/core/bootstrap.js"
          node --check "$OUT/src/fx/animation-profile-registry.js"
          node --check "$OUT/src/fx/combat-animation-director.js"
          node --check "$OUT/src/fx/item-fx-director.js"

          printf 'V23.32-R38.2\n' > "$OUT/DEPLOYED-VERSION.txt"
          printf 'R38 base parts: %s\n' "${#BASE_PARTS[@]}"
          printf 'R38.2 files: %s\n' "$(find "$OUT" -type f | wc -l)"
          printf 'R38.2 bytes: %s\n' "$(du -sb "$OUT" | cut -f1)"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/r382-site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
