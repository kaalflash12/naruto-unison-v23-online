name: Publish Naruto Unison clean final

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: naruto-unison-clean-final
  cancel-in-progress: true

jobs:
  publish:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[DEPLOY-FINAL-CLEAN]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging assets
        uses: actions/checkout@v5
        with:
          ref: staging
          path: source
          fetch-depth: 1
      - name: Checkout payload
        uses: actions/checkout@v5
        with:
          ref: main
          path: payload
          fetch-depth: 1
      - name: Checkout publish target
        uses: actions/checkout@v5
        with:
          ref: main
          path: publish
          fetch-depth: 0
          persist-credentials: true

      - name: Reconstruct, patch and validate
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/site"
          DIAG="$RUNNER_TEMP/final-deploy-diagnostic.txt"
          : > "$DIAG"
          exec > >(tee -a "$DIAG") 2>&1
          echo 'workflow_revision=clean-final-002'
          rm -rf "$OUT" && mkdir -p "$OUT"

          decode_parts() {
            local srcdir
            local outfile
            local b64file
            local limit
            srcdir="$1"
            outfile="$2"
            limit="${3:-0}"
            b64file="$RUNNER_TEMP/$(basename "$srcdir").b64"
            if [ "$limit" -gt 0 ]; then
              mapfile -t parts < <(find "$srcdir" -maxdepth 1 -type f -name 'part-*' | sort -V | head -n "$limit")
            else
              mapfile -t parts < <(find "$srcdir" -maxdepth 1 -type f -name 'part-*' | sort -V)
            fi
            echo "decode_dir=$srcdir parts=${#parts[@]} limit=$limit"
            [ "${#parts[@]}" -gt 0 ] || return 1
            : > "$b64file"
            for p in "${parts[@]}"; do tr -cd 'A-Za-z0-9+/=' < "$p" >> "$b64file"; done
            B64FILE="$b64file" OUTFILE="$outfile" python - <<'PY'
          import base64,os,sys
          s=open(os.environ['B64FILE'],'r',encoding='ascii').read().strip()
          try:
              raw=base64.b64decode(s,validate=True)
          except Exception as e:
              print('base64_invalid='+repr(e)); sys.exit(2)
          open(os.environ['OUTFILE'],'wb').write(raw)
          print('decoded_bytes='+str(len(raw)))
          PY
            xz -t "$outfile"
            tar -tJf "$outfile" > "$RUNNER_TEMP/archive-list.txt"
            echo "archive_entries=$(wc -l < "$RUNNER_TEMP/archive-list.txt") sha=$(sha256sum "$outfile"|cut -d' ' -f1)"
          }

          BASE="$RUNNER_TEMP/base.tar.xz"
          if decode_parts payload/.r38-repaired "$BASE" 18; then
            echo 'chosen_runtime=.r38-repaired[00-17]'
          else
            echo 'repaired_00_17_failed'
            CHOSEN=''
            for d in payload/.r38-runtime-clean-v3 payload/.r38-runtime-final payload/.r38-runtime-v2 payload/.r38-runtime-clean payload/.r38-runtime-lite; do
              if [ -d "$d" ] && decode_parts "$d" "$BASE"; then CHOSEN="$d"; break; fi
            done
            [ -n "$CHOSEN" ] || { echo 'no_valid_runtime=FAIL'; exit 20; }
            echo "chosen_runtime=$CHOSEN"
          fi

          TMP="$RUNNER_TEMP/base-extract"
          rm -rf "$TMP" && mkdir -p "$TMP"
          tar -xJf "$BASE" -C "$TMP"
          if [ -d "$TMP/public" ]; then cp -a "$TMP/public"/. "$OUT"/; else cp -a "$TMP"/. "$OUT"/; fi
          rm -rf "$OUT/static"
          cp -a source/static "$OUT/static"
          STATIC_FILES="$(find "$OUT/static" -type f | wc -l | tr -d ' ')"
          echo "static_files=$STATIC_FILES"
          test "$STATIC_FILES" -ge 3000

          OVERLAY="$RUNNER_TEMP/overlay.tar.xz"
          decode_parts payload/.final-overlay-b64 "$OVERLAY"
          TMP="$RUNNER_TEMP/overlay-extract"
          rm -rf "$TMP" && mkdir -p "$TMP"
          tar -xJf "$OVERLAY" -C "$TMP"
          if [ -d "$TMP/public" ]; then cp -a "$TMP/public"/. "$OUT"/; else cp -a "$TMP"/. "$OUT"/; fi
          echo 'final_overlay=PASS'

          for f in index.html manifest.webmanifest r38-config.json sw.js src/core/bootstrap.js src/domains/auth/auth-service.js src/ui/auth/auth-overlay.js src/admin/admin-api.js src/admin/admin-shell.js src/admin/admin.css; do
            test -f "$OUT/$f" || { echo "missing=$f"; exit 25; }
          done
          grep -q 'sb_publishable_' "$OUT/r38-config.json"
          grep -q 'resetPasswordForEmail' "$OUT/src/domains/auth/auth-service.js"
          grep -q 'PASSWORD_RECOVERY' "$OUT/src/domains/auth/auth-service.js"
          grep -q 'ESQUECI MINHA SENHA' "$OUT/src/ui/auth/auth-overlay.js"
          grep -q '/admin-gameops/seasons' "$OUT/src/admin/admin-api.js"
          grep -q '/admin-gameops/rewards' "$OUT/src/admin/admin-api.js"
          grep -q "'seasons'" "$OUT/src/admin/admin-shell.js"
          grep -q "'rewards'" "$OUT/src/admin/admin-shell.js"
          node --check "$OUT/src/core/bootstrap.js"
          node --check "$OUT/src/ui/auth/auth-overlay.js"
          node --check "$OUT/src/admin/admin-api.js"
          node --check "$OUT/src/admin/admin-shell.js"
          if grep -Eqi 'R38(?:\.[0-9]+)?|R37|R36|V23\.' "$OUT/index.html" "$OUT/manifest.webmanifest" "$OUT/src/ui/auth/auth-overlay.js"; then echo 'public_revision_leak=FAIL'; exit 31; fi
          if grep -Eqi '<small>R38|R37 BOOT ERROR' "$OUT/src/core/bootstrap.js"; then echo 'runtime_revision_leak=FAIL'; exit 32; fi
          echo 'public_revision_gate=PASS'
          echo "final_files=$(find "$OUT" -type f | wc -l | tr -d ' ')"
          echo 'validation=PASS'

      - name: Record reconstruction failure
        if: steps.build.outcome != 'success'
        shell: bash
        run: |
          set -euo pipefail
          cd publish
          git pull --ff-only origin main
          cp "$RUNNER_TEMP/final-deploy-diagnostic.txt" FINAL-DEPLOY-DIAGNOSTIC.txt || true
          git config user.name 'Naruto Unison Diagnostics'
          git config user.email 'actions@users.noreply.github.com'
          git add FINAL-DEPLOY-DIAGNOSTIC.txt
          git commit -m 'diagnostic: clean final deploy clean-final-002 [skip ci]' || true
          git push origin HEAD:main || true
          exit 1

      - name: Synchronize validated site to main
        if: steps.build.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          cd publish
          git pull --ff-only origin main
          find . -mindepth 1 -maxdepth 1 ! -name '.*' -exec rm -rf {} +
          cp -a "$RUNNER_TEMP/site"/. .
          printf 'Naruto Unison PT-BR\nvalidated=true\nworkflow_revision=clean-final-002\ndeployed_at=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > DEPLOY-VALIDATED.txt
          rm -f FINAL-DEPLOY-DIAGNOSTIC.txt R382-FINAL-DIAGNOSTIC.txt
          git config user.name 'Naruto Unison Publisher'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Naruto Unison clean validated public site clean-final-002 [skip ci]'
            git push origin HEAD:main
          fi
