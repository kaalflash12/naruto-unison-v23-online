name: Story Battle Config Audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - story-data.js
      - roster.js
      - .github/workflows/story-battle-config-audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract and validate story battle config
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const vm=require('vm');
          const context={window:{}};
          vm.createContext(context);
          vm.runInContext(fs.readFileSync('story-data.js','utf8'),context,{filename:'story-data.js'});
          vm.runInContext(fs.readFileSync('roster.js','utf8'),context,{filename:'roster.js'});
          const story=context.window.NARUTO_STORY;
          const roster=Array.isArray(context.window.NARUTO_ROSTER)?context.window.NARUTO_ROSTER:[];
          if(!story||!Array.isArray(story.arcs))throw new Error('NARUTO_STORY ausente ou inválido');
          const missions=story.arcs.flatMap(a=>Array.isArray(a.missions)?a.missions:[]);
          if(missions.length!==44)throw new Error(`esperado 44 capítulos, recebido ${missions.length}`);
          const ids=missions.map(m=>String(m.id||''));
          if(ids.some(x=>!x))throw new Error('capítulo sem id');
          if(new Set(ids).size!==ids.length)throw new Error('id de capítulo duplicado');
          const rosterIds=new Set(roster.map(c=>String(c.slug||c.id||'')).filter(Boolean));
          const cfg=missions.map((m,index)=>{
            const player=Array.isArray(m.player)?m.player.map(String):[];
            const enemy=Array.isArray(m.enemy)?m.enemy.map(String):[];
            if(!player.length||player.length>3)throw new Error(`${m.id}: player precisa ter 1..3 personagens`);
            if(!enemy.length||enemy.length>3)throw new Error(`${m.id}: enemy precisa ter 1..3 personagens`);
            for(const slug of [...player,...enemy])if(!rosterIds.has(slug))throw new Error(`${m.id}: personagem inexistente ${slug}`);
            const type=String(m.objective?.type||'defeat');
            if(!['defeat','survive','protect'].includes(type))throw new Error(`${m.id}: objective.type inválido ${type}`);
            const reward=m.reward&&typeof m.reward==='object'?m.reward:{};
            const xp=Math.max(0,Math.trunc(Number(reward.xp||0)));
            const ryo=Math.max(0,Math.trunc(Number(reward.ryo||0)));
            const unlock=Array.isArray(reward.unlock)?reward.unlock.map(String):[];
            for(const slug of unlock)if(!rosterIds.has(slug))throw new Error(`${m.id}: unlock inexistente ${slug}`);
            return {
              id:String(m.id),
              chapter:index+1,
              player,
              enemy,
              difficulty:String(m.difficulty||'normal'),
              strategy:String(m.strategy||'balanced'),
              objective:m.objective||{type:'defeat'},
              enemyHp:m.enemyHp&&typeof m.enemyHp==='object'?m.enemyHp:{},
              reward:{xp,ryo,unlock,badge:reward.badge?String(reward.badge):null}
            };
          });
          fs.mkdirSync('story-audit',{recursive:true});
          fs.writeFileSync('story-audit/story-battle-config.json',JSON.stringify({schemaVersion:1,count:cfg.length,chapters:cfg},null,2)+'\n');
          const types=[...new Set(cfg.map(x=>x.objective.type))].sort();
          console.log(`story battle config: ${cfg.length}/44 OK`);
          console.log(`objective types: ${types.join(', ')}`);
          NODE
      - name: Upload canonical battle config
        uses: actions/upload-artifact@v4
        with:
          name: story-battle-config
          path: story-audit/story-battle-config.json
          if-no-files-found: error
          retention-days: 7
