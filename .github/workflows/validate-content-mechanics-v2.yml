name: Validate Content Mechanics V2

on:
  push:
    branches: [main]
    paths:
      - 'balance/canonical-v2-overrides.json'
      - 'combat-rules-v2.js'
      - 'combat-content-adapter-v2.js'
      - 'roster.js'
      - 'jutsu-variants.js'
      - 'tools/test-content-mechanics-v2.cjs'
      - 'tools/test-content-engine-extensions-v2.cjs'
      - 'tools/semantic-ai-v2.mjs'
      - 'tools/test-semantic-ai-v2.mjs'
      - 'tools/audit-published-techniques-v2.mjs'
      - 'tools/audit-semantic-skill-values-v2.mjs'
      - 'tools/validate-published-roster-coverage-v2.mjs'
      - 'tools/simulate-published-balance-3v3-v2.mjs'
      - 'tools/simulate-balance-3v3-v2.mjs'
      - 'tools/analyze-balance-v2.mjs'
      - 'tools/run-balance-v2-with-overrides.mjs'
      - 'tools/merge-balance-v2-shards.mjs'
      - 'tools/run-canonical-209-shards.mjs'
      - 'supabase/functions/content/index.ts'
      - '.github/workflows/validate-content-mechanics-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mechanics-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax
        run: |
          set -euo pipefail
          node --check combat-rules-v2.js
          node --check combat-content-adapter-v2.js
          node --check tools/test-content-mechanics-v2.cjs
          node --check tools/test-content-engine-extensions-v2.cjs
          node --check tools/semantic-ai-v2.mjs
          node --check tools/test-semantic-ai-v2.mjs
          node --check tools/audit-published-techniques-v2.mjs
          node --check tools/audit-semantic-skill-values-v2.mjs
          node --check tools/validate-published-roster-coverage-v2.mjs
          node --check tools/simulate-published-balance-3v3-v2.mjs
          node --check tools/simulate-balance-3v3-v2.mjs
          node --check tools/analyze-balance-v2.mjs
          node --check tools/run-balance-v2-with-overrides.mjs
          node --check tools/merge-balance-v2-shards.mjs
          node --check tools/run-canonical-209-shards.mjs
      - name: Canonical mechanics contract
        run: node tools/test-content-mechanics-v2.cjs
      - name: Advanced content envelope contract
        run: node tools/test-content-engine-extensions-v2.cjs
      - name: Semantic AI decision contract
        run: node tools/test-semantic-ai-v2.mjs
      - name: Audit all published techniques
        run: node tools/audit-published-techniques-v2.mjs
      - name: Semantic value audit
        run: node tools/audit-semantic-skill-values-v2.mjs
      - name: Canonical roster simulation smoke
        env:
          SIM_MODE: smoke
          SIM_SCOPE: all
          SIM_SEEDS: '1'
          SIM_MAX_TURNS: '20'
        run: node tools/simulate-published-balance-3v3-v2.mjs
      - name: Canonical roster 209 coverage
        env:
          SIM_MAX_TURNS: '20'
        run: node tools/validate-published-roster-coverage-v2.mjs
      - name: Contract guards
        run: |
          set -euo pipefail
          grep -Fq "const VERSION=2" combat-content-adapter-v2.js
          grep -Fq "UNSUPPORTED_CONTENT_OP" combat-content-adapter-v2.js
          grep -Fq "multi-hit" combat-content-adapter-v2.js
          grep -Fq "bonusIf" combat-content-adapter-v2.js
          grep -Fq "execute" combat-content-adapter-v2.js
          grep -Fq "ENGINE_EFFECT_TYPES" combat-content-adapter-v2.js
          grep -Fq "ENGINE_CHANGE_TYPES" combat-content-adapter-v2.js
          grep -Fq "engineEffects" combat-content-adapter-v2.js
          grep -Fq "engineChanges" combat-content-adapter-v2.js
          grep -Fq "engineRequirements" combat-content-adapter-v2.js
          grep -Fq "engineCharges" combat-content-adapter-v2.js
          grep -Fq "semanticAI.skillScore" tools/simulate-balance-3v3-v2.mjs
          grep -Fq "semanticAI.chooseTarget" tools/simulate-balance-3v3-v2.mjs
          grep -Fq "mark→bonusIf" tools/test-semantic-ai-v2.mjs
          grep -Fq "PAGE_SIZE = 1000" supabase/functions/content/index.ts
          grep -Fq ".range(from, from + PAGE_SIZE - 1)" supabase/functions/content/index.ts
          test -s audit/balance/published-v2/SUMMARY.json
          grep -Fq '"gate": "PASS"' audit/balance/published-v2/SUMMARY.json
          grep -Fq '"canonicalPlayableCharacters": 209' audit/balance/published-v2/SUMMARY.json
          grep -Fq '"canonicalLinks": 836' audit/balance/published-v2/SUMMARY.json
          test -s audit/balance/semantic-v2/SUMMARY.json
          grep -Fq '"gate": "PASS"' audit/balance/semantic-v2/SUMMARY.json
          grep -Fq '"skills": 836' audit/balance/semantic-v2/SUMMARY.json
          grep -Fq '"zeroValuedEffects": 0' audit/balance/semantic-v2/SUMMARY.json
          test -s audit/balance/published-simulation-v2/CANONICAL-SOURCE.json
          grep -Fq '"characters":209' <(tr -d '[:space:]' < audit/balance/published-simulation-v2/CANONICAL-SOURCE.json) || grep -Fq '"playableCharacters":209' <(tr -d '[:space:]' < audit/balance/published-simulation-v2/CANONICAL-SOURCE.json)
          test -s audit/balance/published-coverage-v2/SUMMARY.json
          grep -Fq '"gate": "PASS"' audit/balance/published-coverage-v2/SUMMARY.json
          grep -Fq '"coveredCharacters": 209' audit/balance/published-coverage-v2/SUMMARY.json
          echo 'CONTENT_MECHANICS_V2=PASS'
      - name: Upload published-technique audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: published-techniques-v2-audit
          path: audit/balance/published-v2/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload semantic value audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: published-semantic-v2-audit
          path: audit/balance/semantic-v2/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload canonical simulation smoke
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: published-roster-v2-simulation-smoke
          path: audit/balance/published-simulation-v2/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload canonical coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: published-roster-v2-coverage-209
          path: audit/balance/published-coverage-v2/
          if-no-files-found: warn
          retention-days: 14

  canonical-209:
    needs: mechanics-v2
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Canonical 209 syntax gate
        run: |
          set -euo pipefail
          node --check tools/simulate-balance-3v3-v2.mjs
          node --check tools/analyze-balance-v2.mjs
          node --check tools/run-balance-v2-with-overrides.mjs
          node --check tools/merge-balance-v2-shards.mjs
          node --check tools/run-canonical-209-shards.mjs
      - name: Run isolated canonical 209 shards and strict merge
        env:
          SIM_SHARD_PARALLEL: '4'
        run: |
          set -euo pipefail
          node tools/run-canonical-209-shards.mjs | tee /tmp/canonical-v2-209.log
      - name: Prove exact canonical matrix
        run: |
          node - <<'JS'
          const fs=require('fs');
          const d='audit/balance/canonical-v2-full';
          const a='audit/balance/analysis-v2/all';
          const s=JSON.parse(fs.readFileSync(`${d}/SUMMARY.json`,'utf8'));
          const r=JSON.parse(fs.readFileSync(`${d}/CHARACTER-RATINGS.json`,'utf8'));
          const m=JSON.parse(fs.readFileSync(`${d}/MATCHUPS.json`,'utf8'));
          const o=JSON.parse(fs.readFileSync(`${d}/OVERRIDE-APPLICATION.json`,'utf8'));
          const an=JSON.parse(fs.readFileSync(`${a}/SUMMARY.json`,'utf8'));
          const chars=JSON.parse(fs.readFileSync(`${a}/CHARACTER-ANALYSIS.json`,'utf8'));
          if(s.totalRoster!==209||s.eligibleRoster!==209||s.roster!==209||r.length!==209) throw new Error('209 coverage failed');
          if(s.scope!=='all'||s.pairs!==21736||m.length!==21736||s.matchups!==173888||s.expectedGamesPerPair!==8) throw new Error('full matrix mismatch');
          if(m.some(x=>x.games!==8)||new Set(m.map(x=>`${x.a}\0${x.b}`)).size!==21736) throw new Error('pair uniqueness/games gate failed');
          if(s.shard?.merged!==true||s.shard?.count!==8||s.shard?.globalPairs!==21736) throw new Error('shard merge gate failed');
          if(o.overridesConfigured!==13||o.publicRosterMutated!==false||o.scope!=='analysis-only') throw new Error('override guard failed');
          if(an.scope!=='all'||an.characters!==209||chars.length!==209||an.pairs!==21736||an.games!==173888) throw new Error('analysis 209 gate failed');
          console.log('CANONICAL_V2_FULL_209_MATRIX=PASS',{characters:r.length,pairs:m.length,battles:s.matchups,gamesPerPair:s.expectedGamesPerPair,shards:s.shard.count,overrides:o.overridesConfigured,actions:an.actionCounts,health:an.health});
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: canonical-v2-full-209
          path: |
            audit/balance/canonical-v2-full
            audit/balance/analysis-v2/all
          if-no-files-found: error
          retention-days: 30
