name: Balance Simulation 3v3 — Combat Rules v2

on:
  push:
    branches: [main]
    paths:
      - 'balance/canonical-v2-overrides.json'
      - 'combat-rules-v2.js'
      - 'combat-content-adapter-v2.js'
      - 'roster.js'
      - 'jutsu-variants.js'
      - 'tools/test-combat-rules-v2.mjs'
      - 'tools/semantic-ai-v2.mjs'
      - 'tools/simulate-balance-3v3-v2.mjs'
      - 'tools/analyze-balance-v2.mjs'
      - 'tools/audit-published-techniques-v2.mjs'
      - 'tools/run-balance-v2-with-overrides.mjs'
      - 'tools/merge-balance-v2-shards.mjs'
      - 'tools/run-canonical-209-shards.mjs'
      - 'supabase/functions/content/index.ts'
      - '.github/workflows/simulate-balance-3v3-v2.yml'
      - '.balance-v2-run-trigger'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: balance-simulation-v2
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SIM_SCOPE: competitive
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and engine gate
        run: |
          set -euo pipefail
          node --check combat-rules-v2.js
          node --check combat-content-adapter-v2.js
          node --check roster.js
          node --check tools/test-combat-rules-v2.mjs
          node --check tools/semantic-ai-v2.mjs
          node --check tools/simulate-balance-3v3-v2.mjs
          node --check tools/analyze-balance-v2.mjs
          node --check tools/audit-published-techniques-v2.mjs
          node --check tools/run-balance-v2-with-overrides.mjs
          node --check tools/merge-balance-v2-shards.mjs
          node --check tools/run-canonical-209-shards.mjs
      - name: Deterministic combat semantics
        run: |
          set -euo pipefail
          node tools/test-combat-rules-v2.mjs
      - name: Smoke simulation
        env:
          SIM_MODE: smoke
          SIM_SEEDS: '1'
          SIM_MAX_TURNS: '30'
        run: |
          set -euo pipefail
          node tools/simulate-balance-3v3-v2.mjs | tee /tmp/v2-smoke.json
          node - <<'JS'
          const fs=require('fs');
          const s=JSON.parse(fs.readFileSync('audit/balance/simulation-v2/SUMMARY.json','utf8'));
          if(s.engineVersion!==2) throw new Error('engineVersion != 2');
          if(s.totalRoster!==209||s.eligibleRoster!==209||s.scope!=='competitive'||s.roster!==203) throw new Error('competitive coverage invalid '+JSON.stringify({total:s.totalRoster,eligible:s.eligibleRoster,scope:s.scope,roster:s.roster}));
          if(!Array.isArray(s.excludedCharacters)||s.excludedCharacters.length!==6) throw new Error('excluded coverage invalid');
          if(s.matchups<100) throw new Error('smoke insuficiente');
          if(s.v2NativeSkills+s.legacyFallbackSkills!==s.roster*4) throw new Error('cobertura de jutsus inconsistente');
          console.log('V2_SMOKE=PASS',s);
          JS

  standard:
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SIM_SCOPE: competitive
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Re-run deterministic semantics on standard runner
        run: |
          set -euo pipefail
          node tools/test-combat-rules-v2.mjs
      - name: Standard exhaustive competitive simulation
        env:
          SIM_MODE: standard
          SIM_SEEDS: '2'
          SIM_MAX_TURNS: '30'
        run: |
          set -euo pipefail
          rm -rf audit/balance/simulation-v2 audit/balance/analysis-v2/competitive
          node tools/simulate-balance-3v3-v2.mjs | tee /tmp/v2-standard.json
          node - <<'JS'
          const fs=require('fs');
          const s=JSON.parse(fs.readFileSync('audit/balance/simulation-v2/SUMMARY.json','utf8'));
          if(s.totalRoster!==209||s.eligibleRoster!==209||s.scope!=='competitive'||s.roster!==203) throw new Error('competitive coverage invalid '+JSON.stringify(s));
          if(s.excludedCharacters.length!==6) throw new Error('expected 6 event/special exclusions');
          const expectedPairs=s.roster*(s.roster-1)/2;
          if(s.pairs!==expectedPairs) throw new Error(`pairs=${s.pairs}, esperado=${expectedPairs}`);
          if(s.matchups!==expectedPairs*8) throw new Error(`games=${s.matchups}, esperado=${expectedPairs*8}`);
          if(!s.top || !s.bottom) throw new Error('ranking ausente');
          console.log('V2_STANDARD=PASS',s);
          JS
      - name: Analyze competitive balance from the same matrix
        run: |
          set -euo pipefail
          node tools/analyze-balance-v2.mjs | tee /tmp/v2-analysis.json
          test -s audit/balance/analysis-v2/competitive/SUMMARY.json
          test -s audit/balance/analysis-v2/competitive/CHARACTER-ANALYSIS.json
          test -s audit/balance/analysis-v2/competitive/REPORT.md
          node - <<'JS'
          const fs=require('fs');
          const s=JSON.parse(fs.readFileSync('audit/balance/analysis-v2/competitive/SUMMARY.json','utf8'));
          const c=JSON.parse(fs.readFileSync('audit/balance/analysis-v2/competitive/CHARACTER-ANALYSIS.json','utf8'));
          if(s.scope!=='competitive'||s.characters!==203||c.length!==203) throw new Error('competitive analysis coverage failed');
          for(const repo of ['google-deepmind/open_spiel','sublee/trueskill','Elo/Bradley-Terry family','nianticlabs/metagame-balance']){
            if(!s.methodReferences.some(x=>x.repository===repo)) throw new Error('method missing: '+repo);
          }
          console.log('V2_COMPETITIVE_ANALYSIS=PASS',s.actionCounts,s.health,s.concentration);
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: balance-simulation-v2-${{ github.sha }}
          path: |
            audit/balance/simulation-v2
            audit/balance/analysis-v2/competitive
          if-no-files-found: error
          retention-days: 30
      - name: Commit generated v2 audit
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit/balance/simulation-v2 audit/balance/analysis-v2/competitive
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'audit(balance): refresh combat-rules-v2 competitive analysis [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main

  canonical-209:
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run published-V2 canonical 209 shards and strict merge
        env:
          SIM_SHARD_PARALLEL: '4'
        run: |
          set -euo pipefail
          node tools/run-canonical-209-shards.mjs | tee /tmp/canonical-v2-209.log
      - name: Prove exact 209-character native-V2 matrix
        run: |
          node - <<'JS'
          const fs=require('fs');
          const d='audit/balance/canonical-v2-full';
          const a='audit/balance/analysis-v2/all';
          const p='audit/balance/published-v2';
          const s=JSON.parse(fs.readFileSync(`${d}/SUMMARY.json`,'utf8'));
          const r=JSON.parse(fs.readFileSync(`${d}/CHARACTER-RATINGS.json`,'utf8'));
          const m=JSON.parse(fs.readFileSync(`${d}/MATCHUPS.json`,'utf8'));
          const o=JSON.parse(fs.readFileSync(`${d}/OVERRIDE-APPLICATION.json`,'utf8'));
          const an=JSON.parse(fs.readFileSync(`${a}/SUMMARY.json`,'utf8'));
          const chars=JSON.parse(fs.readFileSync(`${a}/CHARACTER-ANALYSIS.json`,'utf8'));
          const pub=JSON.parse(fs.readFileSync(`${p}/SUMMARY.json`,'utf8'));
          if(pub.gate!=='PASS'||pub.canonicalPlayableCharacters!==209||pub.canonicalLinks!==836) throw new Error('published V2 source gate failed');
          if(s.totalRoster!==209||s.eligibleRoster!==209||s.roster!==209||r.length!==209) throw new Error('209 coverage failed');
          if(s.v2NativeSkills!==836||s.legacyFallbackSkills!==0) throw new Error('native V2/fallback gate failed');
          if(s.scope!=='all'||s.pairs!==21736||m.length!==21736||s.matchups!==173888||s.expectedGamesPerPair!==8) throw new Error('full matrix mismatch');
          if(m.some(x=>x.games!==8)||new Set(m.map(x=>`${x.a}\0${x.b}`)).size!==21736) throw new Error('pair uniqueness/games gate failed');
          if(s.shard?.merged!==true||s.shard?.count!==8||s.shard?.globalPairs!==21736) throw new Error('shard merge gate failed');
          if(o.overridesConfigured!==13||o.publicRosterMutated!==false||o.scope!=='analysis-only') throw new Error('override guard failed');
          if(an.scope!=='all'||an.characters!==209||chars.length!==209||an.pairs!==21736||an.games!==173888) throw new Error('analysis 209 gate failed');
          const counts=r.map(x=>Number(x.matches||0));
          const minBattles=Math.min(...counts),maxBattles=Math.max(...counts);
          if(minBattles!==1664||maxBattles!==1664) throw new Error(`battles/character gate failed ${minBattles}/${maxBattles}`);
          console.log('CANONICAL_V2_FULL_209_MATRIX=PASS',{characters:r.length,pairs:m.length,battles:s.matchups,gamesPerPair:s.expectedGamesPerPair,minBattlesPerCharacter:minBattles,maxBattlesPerCharacter:maxBattles,nativeSkills:s.v2NativeSkills,legacyFallbackSkills:s.legacyFallbackSkills,shards:s.shard.count,overrides:o.overridesConfigured,actions:an.actionCounts,health:an.health});
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: canonical-v2-full-209-${{ github.sha }}
          path: |
            audit/balance/published-v2
            audit/balance/canonical-v2-full
            audit/balance/analysis-v2/all
          if-no-files-found: error
          retention-days: 30
