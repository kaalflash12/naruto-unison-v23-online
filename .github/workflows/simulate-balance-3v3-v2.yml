name: Balance Simulation 3v3 — Combat Rules v2

on:
  push:
    branches: [main]
    paths:
      - 'combat-rules-v2.js'
      - 'roster.js'
      - 'jutsu-variants.js'
      - 'tools/simulate-balance-3v3-v2.mjs'
      - '.github/workflows/simulate-balance-3v3-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: balance-simulation-v2
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and engine gate
        run: |
          set -euo pipefail
          node --check combat-rules-v2.js
          node --check roster.js
          node --check tools/simulate-balance-3v3-v2.mjs
      - name: Smoke simulation
        env:
          SIM_MODE: smoke
          SIM_SEEDS: '1'
          SIM_MAX_TURNS: '30'
        run: |
          set -euo pipefail
          node tools/simulate-balance-3v3-v2.mjs | tee /tmp/v2-smoke.json
          node - <<'JS'
          const fs=require('fs');
          const s=JSON.parse(fs.readFileSync('audit/balance/simulation-v2/SUMMARY.json','utf8'));
          if(s.engineVersion!==2) throw new Error('engineVersion != 2');
          if(s.roster<190) throw new Error('roster incompleto');
          if(s.matchups<100) throw new Error('smoke insuficiente');
          if(s.v2NativeSkills+s.legacyFallbackSkills!==s.roster*4) throw new Error('cobertura de jutsus inconsistente');
          console.log('V2_SMOKE=PASS',s);
          JS

  standard:
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Standard exhaustive focal-pair simulation
        env:
          SIM_MODE: standard
          SIM_SEEDS: '2'
          SIM_MAX_TURNS: '30'
        run: |
          set -euo pipefail
          node tools/simulate-balance-3v3-v2.mjs | tee /tmp/v2-standard.json
          node - <<'JS'
          const fs=require('fs');
          const s=JSON.parse(fs.readFileSync('audit/balance/simulation-v2/SUMMARY.json','utf8'));
          const expectedPairs=s.roster*(s.roster-1)/2;
          if(s.pairs!==expectedPairs) throw new Error(`pairs=${s.pairs}, esperado=${expectedPairs}`);
          if(s.matchups!==expectedPairs*8) throw new Error(`games=${s.matchups}, esperado=${expectedPairs*8}`);
          if(!s.top || !s.bottom) throw new Error('ranking ausente');
          console.log('V2_STANDARD=PASS',s);
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: balance-simulation-v2-${{ github.sha }}
          path: audit/balance/simulation-v2
          if-no-files-found: error
          retention-days: 30
      - name: Commit generated v2 audit
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit/balance/simulation-v2
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'audit(balance): refresh combat-rules-v2 simulation [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
