name: Diagnose Desktop Overflow

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-desktop-overflow.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect public desktop geometry
        shell: bash
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          mkdir -p /tmp/layout-diag && cd /tmp/layout-diag
          npm init -y >/dev/null 2>&1
          npm install --silent playwright-core@1.55.0
          cat > test.mjs <<'JS'
          import { chromium } from 'playwright-core';
          const base='https://kaalflash12.github.io/naruto-unison-v23-online/';
          const browser=await chromium.launch({headless:true,executablePath:process.env.CHROME_BIN,args:['--no-sandbox','--disable-dev-shm-usage']});
          const ctx=await browser.newContext({viewport:{width:1680,height:900}});
          const page=await ctx.newPage();
          await page.goto(base+'?overflow-diag='+Date.now(),{waitUntil:'networkidle',timeout:60000});
          await page.waitForTimeout(1200);
          const out=await page.evaluate(async()=>{
            for(const el of document.querySelectorAll('#main > div')) el.classList.add('hidden');
            const select=document.querySelector('#selectPage');
            select.classList.remove('hidden');
            await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
            const fresh=await fetch('static/css/embeds.css?fresh='+Date.now(),{cache:'no-store'}).then(r=>r.text());
            const offenders=[...document.querySelectorAll('#selectPage *')].map(el=>{
              const r=el.getBoundingClientRect();
              const cs=getComputedStyle(el);
              return {tag:el.tagName,id:el.id,cls:String(el.className||'').slice(0,120),x:Math.round(r.x),right:Math.round(r.right),width:Math.round(r.width),scrollWidth:el.scrollWidth,overflowX:cs.overflowX,position:cs.position,marginLeft:cs.marginLeft,cssWidth:cs.width};
            }).filter(x=>x.right>1684||x.x< -4||x.scrollWidth>x.width+4).sort((a,b)=>Math.max(b.right-1680,b.scrollWidth-b.width)-Math.max(a.right-1680,a.scrollWidth-a.width)).slice(0,30);
            const links=[...document.querySelectorAll('link[rel="stylesheet"]')].map(x=>x.href);
            const preview=document.querySelector('#preview');
            const browse=document.querySelector('#browse');
            return {
              doc:{innerWidth,docScrollWidth:document.documentElement.scrollWidth,bodyScrollWidth:document.body.scrollWidth,overflow:Math.max(document.documentElement.scrollWidth,document.body.scrollWidth)-innerWidth},
              freshEmbedsHasGuard:fresh.includes('R50 overflow guard')&&fresh.includes('overflow-x: clip'),
              loadedLinks:links,
              preview:preview?{width:preview.getBoundingClientRect().width,scrollWidth:preview.scrollWidth,overflowX:getComputedStyle(preview).overflowX}:null,
              browse:browse?{x:browse.getBoundingClientRect().x,right:browse.getBoundingClientRect().right,width:browse.getBoundingClientRect().width,scrollWidth:browse.scrollWidth}:null,
              offenders
            };
          });
          console.log('LAYOUT_DIAG='+JSON.stringify(out,null,2));
          await page.screenshot({path:'/tmp/layout-diag/desktop-overflow-diag.png',fullPage:true});
          await browser.close();
          JS
          CHROME_BIN="$CHROME_BIN" node test.mjs
