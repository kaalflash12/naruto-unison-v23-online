name: Deploy Naruto Unison R38 from staged delta

on:
  push:
    branches:
      - r38-stage-final
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

environment:
  name: github-pages

concurrency:
  group: r38-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout R38 staging
        uses: actions/checkout@v5
        with:
          ref: r38-stage-final
          fetch-depth: 0
          persist-credentials: true

      - name: Reconstruct R38 archive from staged parts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r38-candidates"
          cat .r38-delta/part-00 .r38-delta/part-01 .r38-delta/part-02 .r38-delta/part-03-05 .r38-delta/part-06-08 | base64 -d > "$RUNNER_TEMP/r38-candidates/r38.tar.xz"
          mkdir -p "$RUNNER_TEMP/r38-overlay"
          tar -xJf "$RUNNER_TEMP/r38-candidates/r38.tar.xz" -C "$RUNNER_TEMP/r38-overlay"
          test -f "$RUNNER_TEMP/r38-overlay/index.html"
          grep -q 'V23.31-R38' "$RUNNER_TEMP/r38-overlay/index.html"
          COUNT=$(find "$RUNNER_TEMP/r38-overlay" -type f | wc -l)
          echo "R38 overlay files: $COUNT"
          test "$COUNT" -ge 100

      - name: Build complete site from existing Unison plus R38 overlay
        shell: bash
        run: |
          set -euo pipefail
          SITE="$RUNNER_TEMP/r38-site"
          OVERLAY="$RUNNER_TEMP/r38-overlay"
          rm -rf "$SITE"
          mkdir -p "$SITE"
          git fetch origin main
          git archive origin/main | tar -x -C "$SITE"
          cp -a "$OVERLAY"/. "$SITE/"
          test -f "$SITE/index.html"
          grep -q 'V23.31-R38' "$SITE/index.html"
          echo "R38 site assembled from existing Unison + overlay."

      - name: Synchronize R38 site to main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github ! -name .r38-delta -exec rm -rf {} +
          cp -a "$RUNNER_TEMP/r38-site"/. .
          rm -rf .r38-delta
          git config user.name 'Naruto Unison R38 Deploy'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Main already matches the R38 site.'
          else
            git commit -m 'Naruto Unison V23.31 R38 online update'
            git push origin HEAD:main
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/r38-site

      - name: Deploy R38 to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify public R38 marker
        shell: bash
        run: |
          set -euo pipefail
          URL='https://kaalflash12.github.io/naruto-unison-v23-online/'
          for i in $(seq 1 30); do
            BODY=$(curl -fsSL --retry 2 "$URL?r38=$GITHUB_RUN_ID" || true)
            if printf '%s' "$BODY" | grep -q 'V23.31-R38'; then
              echo 'R38 marker confirmed on public Pages.'
              exit 0
            fi
            sleep 10
          done
          echo 'R38 public marker not observed.' >&2
          exit 1
