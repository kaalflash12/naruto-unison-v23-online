name: Deploy Naruto Unison R38 Artifact

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag containing the R38 frontend zip
        required: true
        type: string
      asset:
        description: Frontend zip asset name
        required: true
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

environment:
  name: github-pages

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Download R38 release asset
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DEPLOY_TAG: ${{ inputs.tag }}
          DEPLOY_ASSET: ${{ inputs.asset }}
        shell: bash
        run: |
          set -euo pipefail
          SITE="$RUNNER_TEMP/r38-site"
          rm -rf "$SITE"
          mkdir -p "$SITE"
          cd "$RUNNER_TEMP"
          rm -f "$DEPLOY_ASSET"
          gh release download "$DEPLOY_TAG" --repo "$GH_REPO" --pattern "$DEPLOY_ASSET"
          unzip -q "$DEPLOY_ASSET" -d "$SITE"
          test -f "$SITE/index.html"
          grep -q 'V23.31-R38' "$SITE/index.html"
          echo "R38 artifact validated."

      - name: Synchronize R38 public tree to main
        shell: bash
        run: |
          set -euo pipefail
          SITE="$RUNNER_TEMP/r38-site"
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a "$SITE"/. .
          git config user.name "Naruto Unison R38 Deploy"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Repository main already matches the R38 public tree."
          else
            git commit -m "Naruto Unison V23.31 R38"
            if ! git push origin HEAD:main; then
              echo "::warning::Main branch sync was blocked; continuing with Pages artifact deployment."
            fi
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload R38 Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/r38-site

      - name: Deploy R38 to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
