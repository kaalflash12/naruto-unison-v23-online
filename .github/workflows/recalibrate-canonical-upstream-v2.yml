name: Verify Canonical Upstream V2 After Content Publish

on:
  push:
    branches: [main]
    paths:
      - 'tools/patch-canonical-invuln-helper-v2.mjs'
      - '.github/workflows/recalibrate-canonical-upstream-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: verify-canonical-upstream-v2-live-content
  cancel-in-progress: false

jobs:
  verify-live-content:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: naruto-unison/naruto-unison
          ref: 3f81bcd0de1795c17ce1f8e8d9f9fa51b38af0e1
          path: canonical-upstream
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply and verify canonical invuln helper parser
        run: |
          set -euo pipefail
          node --check tools/patch-canonical-invuln-helper-v2.mjs
          node tools/patch-canonical-invuln-helper-v2.mjs
          node --check tools/classify-canonical-upstream-v2.mjs
          grep -F "cost: [], cooldown: 4" tools/classify-canonical-upstream-v2.mjs >/dev/null
          grep -F "durations: [1], targets: ['self']" tools/classify-canonical-upstream-v2.mjs >/dev/null
      - name: Verify current comparator and queue
        run: |
          set -euo pipefail
          node --check tools/finalize-canonical-upstream-v2.mjs
          node --check tools/build-canonical-v2-correction-queue.mjs
          node tools/classify-canonical-upstream-v2.mjs --self-test
          node tools/build-canonical-v2-correction-queue.mjs --self-test
      - name: Re-prove published V2 source after live content publish
        run: |
          set -euo pipefail
          node tools/audit-published-techniques-v2.mjs >/tmp/published-v2-live.json
          node - <<'JS'
          const fs=require('fs');
          const s=JSON.parse(fs.readFileSync('audit/balance/published-v2/SUMMARY.json','utf8'));
          if(s.gate!=='PASS'||s.canonicalPlayableCharacters!==209||s.canonicalLinks!==836) throw new Error(JSON.stringify(s));
          if(s.unsupported!==0||s.runtimeFailures!==0||s.unknownCosts!==0||s.noops!==0) throw new Error('published V2 source regression');
          console.log('PUBLISHED_V2_AFTER_LIVE_CORRECTION=PASS');
          JS
      - name: Rebuild canonical upstream evidence
        run: |
          set +e
          node tools/classify-canonical-upstream-v2.mjs --root . --upstream canonical-upstream --upstream-commit 3f81bcd0de1795c17ce1f8e8d9f9fa51b38af0e1 | tee /tmp/raw-live.json
          echo ${PIPESTATUS[0]} >/tmp/raw-exit
          exit 0
      - name: Rebuild final 836 accounting and guarded queue
        run: |
          set -euo pipefail
          node tools/finalize-canonical-upstream-v2.mjs --root . --upstream canonical-upstream | tee /tmp/final-live.json
          node tools/build-canonical-v2-correction-queue.mjs | tee /tmp/queue-live.json
      - name: Enforce Kamui Phase canonical helper correction and accounting
        run: |
          set -euo pipefail
          node - <<'JS'
          const fs=require('fs');
          const roster=JSON.parse(fs.readFileSync('audit/balance/published-v2/CANONICAL-ROSTER-209x4.json','utf8'));
          const fin=JSON.parse(fs.readFileSync('audit/balance/canonical-v2/FINAL-SUMMARY.json','utf8'));
          const rows=JSON.parse(fs.readFileSync('audit/balance/canonical-v2/FINAL-CLASSIFICATION-836.json','utf8'));
          const findById=(value,id)=>{
            if(!value||typeof value!=='object') return null;
            if(value.id===id) return value;
            if(Array.isArray(value)){ for(const x of value){const r=findById(x,id);if(r)return r;} return null; }
            for(const x of Object.values(value)){const r=findById(x,id);if(r)return r;}
            return null;
          };
          if(fin.totalTechniques!==836||fin.accounted!==836||fin.unaccounted!==0||fin.gate!=='PASS') throw new Error(`final accounting ${JSON.stringify(fin)}`);
          if((fin.classificationCounts?.MOTOR_INSUFICIENTE||0)!==0) throw new Error(`MOTOR_INSUFICIENTE=${fin.classificationCounts?.MOTOR_INSUFICIENTE}`);
          const kamuiPub=findById(roster,'masked-man__base_4');
          if(!kamuiPub) throw new Error('KAMUI_PUBLISHED_MISSING');
          if(Number(kamuiPub.cooldown)!==4) throw new Error(`KAMUI_PUBLISHED_COOLDOWN=${kamuiPub.cooldown}`);
          if(!Array.isArray(kamuiPub.cost)||kamuiPub.cost.length!==0) throw new Error(`KAMUI_PUBLISHED_COST=${JSON.stringify(kamuiPub.cost)}`);
          const effects=Array.isArray(kamuiPub.mechanic?.effects)?kamuiPub.mechanic.effects:[];
          if(effects.length!==1||effects[0]?.type!=='invulnerable'||Number(effects[0]?.duration)!==1||effects[0]?.target!=='self') throw new Error(`KAMUI_EFFECTS=${JSON.stringify(effects)}`);
          const kamui=rows.find(r=>r.techniqueId==='masked-man__base_4');
          if(!kamui) throw new Error('KAMUI_CLASSIFICATION_MISSING');
          if(kamui.classifications.length!==1||kamui.classifications[0]!=='CORRETA') throw new Error(`KAMUI_NOT_CORRECT:${JSON.stringify(kamui.classifications)}`);
          console.log('KAMUI_PHASE_CANONICAL_HELPER_CORRECTION=PASS',{
            cooldown:kamuiPub.cooldown,
            cost:kamuiPub.cost,
            classifications:kamui.classifications,
            accounted:fin.accounted
          });
          JS
      - name: Upload live verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canonical-upstream-v2-live-${{ github.sha }}
          path: |
            audit/balance/published-v2
            audit/balance/canonical-v2
            audit/balance/canonical-v2-corrections
          if-no-files-found: error
          retention-days: 30
      - name: Commit proven live-content audit and comparator fix
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/classify-canonical-upstream-v2.mjs audit/balance/published-v2 audit/balance/canonical-v2 audit/balance/canonical-v2-corrections
          if git diff --cached --quiet; then exit 0; fi
          if ! git diff --quiet; then
            echo 'Unexpected unstaged tracked changes:'
            git status --short
            exit 1
          fi
          git commit -m 'audit(balance): fix invuln helper semantics and verify Kamui [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
