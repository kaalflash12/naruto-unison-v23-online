name: Recalibrate Canonical Upstream V2 Numeric Semantics

on:
  push:
    branches: [main]
    paths:
      - 'tools/patch-canonical-upstream-classifier-numeric-v2.mjs'
      - '.github/workflows/recalibrate-canonical-upstream-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: recalibrate-canonical-upstream-v2-numeric
  cancel-in-progress: false

jobs:
  recalibrate-and-prove:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: naruto-unison/naruto-unison
          ref: 3f81bcd0de1795c17ce1f8e8d9f9fa51b38af0e1
          path: canonical-upstream
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply numeric semantic classifier patch
        run: |
          set -euo pipefail
          node --check tools/patch-canonical-upstream-classifier-numeric-v2.mjs
          node tools/patch-canonical-upstream-classifier-numeric-v2.mjs
          node --check tools/classify-canonical-upstream-v2.mjs
          node --check tools/finalize-canonical-upstream-v2.mjs
          node --check tools/build-canonical-v2-correction-queue.mjs
          node tools/classify-canonical-upstream-v2.mjs --self-test
          node tools/build-canonical-v2-correction-queue.mjs --self-test
      - name: Re-prove published V2 source
        run: |
          set -euo pipefail
          node tools/audit-published-techniques-v2.mjs >/tmp/published-v2-numeric.json
          node - <<'JS'
          const fs=require('fs');
          const s=JSON.parse(fs.readFileSync('audit/balance/published-v2/SUMMARY.json','utf8'));
          if(s.gate!=='PASS'||s.canonicalPlayableCharacters!==209||s.canonicalLinks!==836) throw new Error(JSON.stringify(s));
          if(s.unsupported!==0||s.runtimeFailures!==0||s.unknownCosts!==0||s.noops!==0) throw new Error('published V2 source regression');
          console.log('PUBLISHED_V2_NUMERIC_SOURCE=PASS');
          JS
      - name: Rebuild raw upstream evidence with numeric effects
        run: |
          set +e
          node tools/classify-canonical-upstream-v2.mjs --root . --upstream canonical-upstream --upstream-commit 3f81bcd0de1795c17ce1f8e8d9f9fa51b38af0e1 | tee /tmp/raw-numeric.json
          echo ${PIPESTATUS[0]} >/tmp/raw-exit
          exit 0
      - name: Rebuild final 836 accounting
        run: |
          set -euo pipefail
          node tools/finalize-canonical-upstream-v2.mjs --root . --upstream canonical-upstream | tee /tmp/final-numeric.json
      - name: Rebuild guarded correction queue
        run: |
          set -euo pipefail
          node tools/build-canonical-v2-correction-queue.mjs | tee /tmp/queue-numeric.json
      - name: Enforce numeric semantic accounting
        run: |
          set -euo pipefail
          node - <<'JS'
          const fs=require('fs');
          const raw=JSON.parse(fs.readFileSync('audit/balance/canonical-v2/SUMMARY.json','utf8'));
          const fin=JSON.parse(fs.readFileSync('audit/balance/canonical-v2/FINAL-SUMMARY.json','utf8'));
          const rows=JSON.parse(fs.readFileSync('audit/balance/canonical-v2/FINAL-CLASSIFICATION-836.json','utf8'));
          const queue=JSON.parse(fs.readFileSync('audit/balance/canonical-v2-corrections/SUMMARY.json','utf8'));
          const safe=JSON.parse(fs.readFileSync('audit/balance/canonical-v2-corrections/SAFE-STRUCTURAL.json','utf8'));
          if(raw.classifiedTechniques!==836||raw.playableCharacters!==209) throw new Error(`raw coverage ${raw.classifiedTechniques}/${raw.playableCharacters}`);
          if(fin.totalTechniques!==836||fin.accounted!==836||fin.unaccounted!==0||fin.gate!=='PASS') throw new Error(`final accounting ${JSON.stringify(fin)}`);
          if((fin.classificationCounts?.MOTOR_INSUFICIENTE||0)!==0) throw new Error(`MOTOR_INSUFICIENTE=${fin.classificationCounts?.MOTOR_INSUFICIENTE}`);
          if(queue.totalTechniques!==836||queue.gate!=='PASS') throw new Error(`queue ${JSON.stringify(queue)}`);
          const pre=rows.find(r=>r.techniqueId==='kabuto-yakushi__base_2');
          if(!pre) throw new Error('PRE_HEALING_ROW_MISSING');
          if(!pre.classifications.includes('EFEITO_ERRADO')) throw new Error(`PRE_HEALING_EFFECT_NOT_FLAGGED:${JSON.stringify(pre.classifications)}`);
          if(!pre.evidence?.effectNumeric?.heal) throw new Error(`PRE_HEALING_NUMERIC_HEAL_NOT_PROVEN:${JSON.stringify(pre.evidence)}`);
          if(safe.some(r=>r.techniqueId==='kabuto-yakushi__base_2')) throw new Error('PRE_HEALING_STILL_AUTO_SAFE');
          for(const r of safe){
            if(r.classifications.includes('EFEITO_ERRADO')||r.evidence?.effectNumeric) throw new Error(`UNSAFE_NUMERIC_ROW_IN_SAFE_QUEUE:${r.techniqueId}`);
          }
          console.log('CANONICAL_UPSTREAM_V2_NUMERIC_EFFECTS=PASS',{
            comparable:fin.comparable,justified:fin.justified,
            effectWrong:fin.classificationCounts?.EFEITO_ERRADO,
            safeStructural:queue.safeStructural,
            preHealing:pre.evidence.effectNumeric
          });
          JS
      - name: Upload recalibrated numeric evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canonical-upstream-v2-numeric-${{ github.sha }}
          path: |
            audit/balance/canonical-v2
            audit/balance/canonical-v2-corrections
          if-no-files-found: error
          retention-days: 30
      - name: Commit proven numeric recalibration and audit
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/classify-canonical-upstream-v2.mjs tools/finalize-canonical-upstream-v2.mjs audit/balance/canonical-v2 audit/balance/canonical-v2-corrections audit/balance/published-v2
          if git diff --cached --quiet; then exit 0; fi
          if ! git diff --quiet; then
            echo 'Unexpected unstaged tracked changes:'
            git status --short
            exit 1
          fi
          git commit -m 'audit(balance): recalibrate canonical numeric effects [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
