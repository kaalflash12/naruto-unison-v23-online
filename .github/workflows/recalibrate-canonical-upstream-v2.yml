name: Recalibrate Canonical Upstream V2 After Engine Gaps

on:
  push:
    branches: [main]
    paths:
      - 'tools/patch-canonical-upstream-classifier-engine-v2.mjs'
      - '.github/workflows/recalibrate-canonical-upstream-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: recalibrate-canonical-upstream-v2
  cancel-in-progress: false

jobs:
  recalibrate-and-prove:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: naruto-unison/naruto-unison
          ref: 3f81bcd0de1795c17ce1f8e8d9f9fa51b38af0e1
          path: canonical-upstream
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply classifier engine-support recalibration
        run: |
          set -euo pipefail
          node --check tools/patch-canonical-upstream-classifier-engine-v2.mjs
          node tools/patch-canonical-upstream-classifier-engine-v2.mjs
          node --check tools/classify-canonical-upstream-v2.mjs
          node tools/classify-canonical-upstream-v2.mjs --self-test
      - name: Re-prove published V2 source
        run: |
          set -euo pipefail
          node tools/audit-published-techniques-v2.mjs >/tmp/published-v2-recalibrated.json
          node - <<'JS'
          const fs=require('fs');
          const s=JSON.parse(fs.readFileSync('audit/balance/published-v2/SUMMARY.json','utf8'));
          if(s.gate!=='PASS'||s.canonicalPlayableCharacters!==209||s.canonicalLinks!==836) throw new Error(JSON.stringify(s));
          if(s.unsupported!==0||s.runtimeFailures!==0||s.unknownCosts!==0||s.noops!==0) throw new Error('published V2 source regression');
          console.log('PUBLISHED_V2_RECALIBRATION_SOURCE=PASS');
          JS
      - name: Rebuild raw upstream evidence
        run: |
          set +e
          node tools/classify-canonical-upstream-v2.mjs --root . --upstream canonical-upstream --upstream-commit 3f81bcd0de1795c17ce1f8e8d9f9fa51b38af0e1 | tee /tmp/raw-recalibrated.json
          echo ${PIPESTATUS[0]} >/tmp/raw-exit
          exit 0
      - name: Rebuild final 836 accounting
        run: |
          set -euo pipefail
          node tools/finalize-canonical-upstream-v2.mjs --root . --upstream canonical-upstream | tee /tmp/final-recalibrated.json
      - name: Enforce post-engine-gap accounting
        run: |
          set -euo pipefail
          node - <<'JS'
          const fs=require('fs');
          const raw=JSON.parse(fs.readFileSync('audit/balance/canonical-v2/SUMMARY.json','utf8'));
          const fin=JSON.parse(fs.readFileSync('audit/balance/canonical-v2/FINAL-SUMMARY.json','utf8'));
          if(raw.classifiedTechniques!==836||raw.playableCharacters!==209) throw new Error(`raw coverage ${raw.classifiedTechniques}/${raw.playableCharacters}`);
          if(fin.totalTechniques!==836||fin.accounted!==836||fin.unaccounted!==0||fin.gate!=='PASS') throw new Error(`final accounting ${JSON.stringify(fin)}`);
          if((raw.classificationCounts?.MOTOR_INSUFICIENTE||0)!==0) throw new Error(`raw MOTOR_INSUFICIENTE=${raw.classificationCounts?.MOTOR_INSUFICIENTE}`);
          if((fin.classificationCounts?.MOTOR_INSUFICIENTE||0)!==0) throw new Error(`final MOTOR_INSUFICIENTE=${fin.classificationCounts?.MOTOR_INSUFICIENTE}`);
          console.log('CANONICAL_UPSTREAM_V2_POST_ENGINE_GAPS=PASS',{
            rawResolved:raw.resolved,rawUnresolved:raw.unresolved,
            comparable:fin.comparable,justified:fin.justified,accounted:fin.accounted,
            classifications:fin.classificationCounts
          });
          JS
      - name: Upload recalibrated evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canonical-upstream-v2-recalibrated-${{ github.sha }}
          path: audit/balance/canonical-v2
          if-no-files-found: error
          retention-days: 30
      - name: Commit proven recalibration and audit
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/classify-canonical-upstream-v2.mjs audit/balance/canonical-v2 audit/balance/published-v2
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'audit(balance): recalibrate canonical V2 after engine gaps [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
