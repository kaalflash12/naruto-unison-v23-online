name: Verify Canonical Upstream V2 After Content Publish

on:
  push:
    branches: [main]
    paths:
      - 'tools/patch-canonical-invuln-helper-v2.mjs'
      - 'tools/patch-canonical-defaults-v2.mjs'
      - 'tools/audit-published-techniques-v2.mjs'
      - '.github/workflows/recalibrate-canonical-upstream-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: verify-canonical-upstream-v2-live-content
  cancel-in-progress: false

jobs:
  verify-live-content:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: naruto-unison/naruto-unison
          ref: 3f81bcd0de1795c17ce1f8e8d9f9fa51b38af0e1
          path: canonical-upstream
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply and verify canonical parser and adapter contracts
        run: |
          set -euo pipefail
          node --check tools/patch-canonical-invuln-helper-v2.mjs
          node --check tools/patch-canonical-defaults-v2.mjs
          node tools/patch-canonical-invuln-helper-v2.mjs
          node tools/patch-canonical-defaults-v2.mjs
          node --check tools/classify-canonical-upstream-v2.mjs
          node --check combat-content-adapter-v2.js
          node --check tools/test-content-mechanics-v2.cjs
          node --check tools/audit-published-techniques-v2.mjs
          node tools/test-content-mechanics-v2.cjs
          grep -F "cost: [], cooldown: 4" tools/classify-canonical-upstream-v2.mjs >/dev/null
          grep -F "durations: [1], targets: ['self']" tools/classify-canonical-upstream-v2.mjs >/dev/null
          grep -F "SELFTEST_ZERO_DEFAULTS" tools/classify-canonical-upstream-v2.mjs >/dev/null
          grep -F "SELFTEST_EXTRA_TARGET" tools/classify-canonical-upstream-v2.mjs >/dev/null
          grep -F "bonusAmount" combat-content-adapter-v2.js >/dev/null
          grep -F "requirements:statusRequirement(technique.requires)" combat-content-adapter-v2.js >/dev/null
          grep -F "requirementGateVerified" tools/audit-published-techniques-v2.mjs >/dev/null
          echo 'CANONICAL_ADAPTER_REQUIREMENT_FLAT_BONUS=PASS'
      - name: Verify current comparator and queue
        run: |
          set -euo pipefail
          node --check tools/finalize-canonical-upstream-v2.mjs
          node --check tools/build-canonical-v2-correction-queue.mjs
          node tools/classify-canonical-upstream-v2.mjs --self-test
          node tools/build-canonical-v2-correction-queue.mjs --self-test
      - name: Re-prove published V2 source after live content publish
        run: |
          set -euo pipefail
          node tools/audit-published-techniques-v2.mjs >/tmp/published-v2-live.json
          node - <<'JS'
          const fs=require('fs');
          const s=JSON.parse(fs.readFileSync('audit/balance/published-v2/SUMMARY.json','utf8'));
          if(s.gate!=='PASS'||s.canonicalPlayableCharacters!==209||s.canonicalLinks!==836) throw new Error(JSON.stringify(s));
          if(s.unsupported!==0||s.runtimeFailures!==0||s.unknownCosts!==0||s.noops!==0) throw new Error('published V2 source regression');
          if(Number(s.requirementGatesVerified||0)<1) throw new Error(`REQUIREMENT_GATES_NOT_PROVED:${s.requirementGatesVerified}`);
          console.log('PUBLISHED_V2_AFTER_LIVE_CORRECTION=PASS',{requirementGatesVerified:s.requirementGatesVerified});
          JS
      - name: Rebuild canonical upstream evidence
        run: |
          set +e
          node tools/classify-canonical-upstream-v2.mjs --root . --upstream canonical-upstream --upstream-commit 3f81bcd0de1795c17ce1f8e8d9f9fa51b38af0e1 | tee /tmp/raw-live.json
          echo ${PIPESTATUS[0]} >/tmp/raw-exit
          exit 0
      - name: Rebuild final 836 accounting and guarded queue
        run: |
          set -euo pipefail
          node tools/finalize-canonical-upstream-v2.mjs --root . --upstream canonical-upstream | tee /tmp/final-live.json
          node tools/build-canonical-v2-correction-queue.mjs | tee /tmp/queue-live.json
      - name: Enforce canonical Naruto batch and final accounting
        run: |
          set -euo pipefail
          node - <<'JS'
          const fs=require('fs');
          const roster=JSON.parse(fs.readFileSync('audit/balance/published-v2/CANONICAL-ROSTER-209x4.json','utf8'));
          const fin=JSON.parse(fs.readFileSync('audit/balance/canonical-v2/FINAL-SUMMARY.json','utf8'));
          const rows=JSON.parse(fs.readFileSync('audit/balance/canonical-v2/FINAL-CLASSIFICATION-836.json','utf8'));
          const findById=(value,id)=>{
            if(!value||typeof value!=='object') return null;
            if(value.id===id) return value;
            if(Array.isArray(value)){ for(const x of value){const r=findById(x,id);if(r)return r;} return null; }
            for(const x of Object.values(value)){const r=findById(x,id);if(r)return r;}
            return null;
          };
          const one=(id)=>{const x=findById(roster,id);if(!x)throw new Error(`PUBLISHED_MISSING:${id}`);return x;};
          const effect=(skill,type,pred=()=>true)=>skill.mechanic?.effects?.find(e=>e?.type===type&&pred(e));
          const exactCorrect=(id)=>{
            const row=rows.find(r=>r.techniqueId===id);
            if(!row)throw new Error(`CLASSIFICATION_MISSING:${id}`);
            if(row.classifications.length!==1||row.classifications[0]!=='CORRETA') throw new Error(`NOT_CORRECT:${id}:${JSON.stringify(row.classifications)}:${JSON.stringify(row.evidence||{})}`);
          };
          if(fin.totalTechniques!==836||fin.accounted!==836||fin.unaccounted!==0||fin.gate!=='PASS') throw new Error(`final accounting ${JSON.stringify(fin)}`);
          if((fin.classificationCounts?.MOTOR_INSUFICIENTE||0)!==0) throw new Error(`MOTOR_INSUFICIENTE=${fin.classificationCounts?.MOTOR_INSUFICIENTE}`);

          const kamui=one('masked-man__base_4');
          if(Number(kamui.cooldown)!==4||!Array.isArray(kamui.cost)||kamui.cost.length!==0) throw new Error(`KAMUI_PUBLISHED=${JSON.stringify(kamui)}`);
          const kamuiEffects=kamui.mechanic?.effects||[];
          if(kamuiEffects.length!==1||kamuiEffects[0]?.type!=='invulnerable'||Number(kamuiEffects[0]?.duration)!==1||kamuiEffects[0]?.target!=='self') throw new Error(`KAMUI_EFFECTS=${JSON.stringify(kamuiEffects)}`);
          exactCorrect('masked-man__base_4');

          const barrage=one('naruto-uzumaki__base_1');
          if(JSON.stringify(barrage.cost)!==JSON.stringify(['Tai'])||Number(barrage.cooldown)!==0) throw new Error(`BARRAGE_COST_CD=${JSON.stringify({cost:barrage.cost,cd:barrage.cooldown})}`);
          const barrageBase=effect(barrage,'damage',e=>Number(e.amount)===20&&!e.conditionalBonus);
          const barrageBonus=effect(barrage,'damage',e=>Number(e.amount)===10&&e.conditionalBonus===true);
          if(!barrageBase||!barrageBonus||barrageBonus.requirements?.type!=='statusPresent'||barrageBonus.requirements?.status!=='shadow-clones') throw new Error(`BARRAGE_EFFECTS=${JSON.stringify(barrage.mechanic?.effects)}`);

          const rasengan=one('naruto-uzumaki__base_2');
          if(JSON.stringify(rasengan.cost)!==JSON.stringify(['Nin','Rand'])||Number(rasengan.cooldown)!==1) throw new Error(`RASENGAN_COST_CD=${JSON.stringify({cost:rasengan.cost,cd:rasengan.cooldown})}`);
          if(rasengan.mechanic?.requirements?.type!=='statusPresent'||rasengan.mechanic?.requirements?.status!=='shadow-clones') throw new Error(`RASENGAN_REQUIREMENT=${JSON.stringify(rasengan.mechanic?.requirements)}`);
          if(!effect(rasengan,'damage',e=>Number(e.amount)===45)||!effect(rasengan,'stun',e=>Number(e.duration)===1)) throw new Error(`RASENGAN_EFFECTS=${JSON.stringify(rasengan.mechanic?.effects)}`);

          const clones=one('naruto-uzumaki__base_3');
          if(JSON.stringify(clones.cost)!==JSON.stringify(['Rand'])||Number(clones.cooldown)!==3) throw new Error(`CLONES_COST_CD=${JSON.stringify({cost:clones.cost,cd:clones.cooldown})}`);
          if(!effect(clones,'reduction',e=>Number(e.amount)===15&&Number(e.duration)===4)||!effect(clones,'status',e=>e.status==='shadow-clones'&&Number(e.duration)===4)) throw new Error(`CLONES_EFFECTS=${JSON.stringify(clones.mechanic?.effects)}`);

          const sexy=one('naruto-uzumaki__base_4');
          if(!Array.isArray(sexy.cost)||sexy.cost.length!==0||Number(sexy.cooldown)!==4) throw new Error(`SEXY_COST_CD=${JSON.stringify({cost:sexy.cost,cd:sexy.cooldown})}`);
          const sexyEffects=sexy.mechanic?.effects||[];
          if(sexyEffects.length!==1||sexyEffects[0]?.type!=='invulnerable'||Number(sexyEffects[0]?.duration)!==1||sexyEffects[0]?.target!=='self') throw new Error(`SEXY_EFFECTS=${JSON.stringify(sexyEffects)}`);

          for(const id of ['naruto-uzumaki__base_1','naruto-uzumaki__base_2','naruto-uzumaki__base_3','naruto-uzumaki__base_4']) exactCorrect(id);
          console.log('CANONICAL_NARUTO_BATCH_V2=PASS',{accounted:fin.accounted,naruto:4,kamui:'CORRETA'});
          JS
      - name: Upload live verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canonical-upstream-v2-live-${{ github.sha }}
          path: |
            audit/balance/published-v2
            audit/balance/canonical-v2
            audit/balance/canonical-v2-corrections
          if-no-files-found: error
          retention-days: 30
      - name: Commit proven live-content audit and comparator fixes
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/classify-canonical-upstream-v2.mjs audit/balance/published-v2 audit/balance/canonical-v2 audit/balance/canonical-v2-corrections
          if git diff --cached --quiet; then exit 0; fi
          if ! git diff --quiet; then
            echo 'Unexpected unstaged tracked changes:'
            git status --short
            exit 1
          fi
          git commit -m 'audit(balance): verify canonical Naruto batch [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
